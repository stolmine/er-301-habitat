[[item]]
id = "pecto-audio-stack-overflow"
title = "Pecto blew the 2048-byte audio task stack: 1072-byte process() frame from 5 stack-local arrays"
status = "done"
stamped = "2026-08-06T20:19:49-05:00"
area = "dsp"
touches = ["mods/spreadsheet/Pecto.cpp"]
attested = """2026-08-06: shipped in v2.8.0. Diagnosed from a real crash report; tools/check-audio-stack.sh guards the class going forward.
2026-08-05 FIXED (spreadsheet 2.8.3.93), hardware confirmation owed.
EVIDENCE, from /mnt/crash.log (schema 2, see er-301/docs/CRASH_REPORT_FORMAT.md). Reports 18 and 19
are the same fault with byte-identical registers - Kind: data-abort, Thread: audio,
"*** STACK audio BLOWN ***", audio 2048/2048 (100%) canary=BLOWN, pc=803dad04 lr=81a5bb24
sp=803dad04 dfar=40000000 dfsr=5. NOTE pc == sp and psr=ffffffff: the saved exception context is
itself garbage, so pc/lr do NOT locate the fault - the stack overflow destroyed the frame that would
have. The BLOWN canary is the finding, not the registers.
Both crashes happened long after the last insert (140s vs last insert 118s; 236s vs 68s), so this is
a runtime overflow during use, not an insert-path bug.
Unit intersection across the two identical signatures: Player.VariSpeed + Pecto. Report 17 is a
different fault (thread=hwi, Anamnesis, dfar=0xb5) = the separate open [[anamnesis-insert-crash]].
MEASURED CAUSE: objdump of Pecto.o shows Pecto::process reserving a 1072-BYTE STACK FRAME - 52% of
the entire 2048-byte audio task stack in one unit, before its callees or the task's own frame. Next
worst in the whole catalogue is 452. The frame is five stack-local arrays at kMaxCombTaps=64:
frac float[64]=256, sA int16[64]=128, sB int16[64]=128, idx0 int32[64]=256, idx1 int32[64]=256 =
1024 bytes, which is essentially the whole frame.
This violates a rule already written down: CONTEXT.md:56 "Audio Thread: Small stack - use heap for
work buffers in process(). Put buffers in Internal struct."
FIX: all five moved into Pecto::Internal (heap). Frame 1072 -> 92 bytes, measured. NEON hints still
clean. Bonus: frac/sA/sB are read with vld1q_f32/vld1_s16, and stack-local arrays are exactly the
Cortex-A8 alignment-hint trap ([[feedback_neon_intrinsics_drumvoice]]), so this closes a latent
second hazard too.
NOT CAUSED BY THIS SESSION'S WORK: Pecto.cpp has no commits since v2.7.0 - the recent Pecto changes
were Lua UI only. Pecto has shipped since v2.3.0, so this is a LONGSTANDING overflow that was
silently corrupting whatever sat past the audio stack. It surfaces now because firmware 9.5.x added
stack canaries and crash diagnostics that finally detect it.
Both arches, pkg installed."""
verify = { kind = "manual", ref = "run the crashing patch again (Pecto + Player.VariSpeed, plus the wider set from report 19) for several minutes; no data-abort, and any new crash.log entry must not show 'STACK audio BLOWN'" }
note = """SWEEP DONE 2026-08-05 - and it CLEARED. My first note here implied the other large frames
needed the same fix; they do not, and that was an overstatement. Audited every process() frame >= 256
bytes plus every function >= 400 bytes across the shipping packages:
  Network 452, FDNTank 436, APFTank 284, DrumVoice 276, Lambda 316 - ZERO stack arrays. Their buffers
    are already class members (Network's mTapDelayTarget[kMaxNetworkTaps] and friends). The frame is
    register spill from a wide per-sample loop, which is not fixable by moving anything and is fine.
  Som 316 - 11 stack arrays but all tiny ([kNumDims], [4], [2], [16], [12]), several in inner scopes,
    ~200 bytes total.
  AlembicVoice 452 - 4 arrays of float[6] = 96 bytes.
  The genuinely huge frames - SpectrogramGraphic::draw 2064, ColmatageOverviewGraphic::bakeNoiseLUT
    2048, RaindropGraphic ctor 2048, LaretOverviewGraphic::draw 1584, buildWavetableFrames 1536,
    FilterResponseGraphic::draw 1424, SomSphereGraphic::draw 1296, analyzeSample 884 - are ALL draw
    functions, constructors, or Lua-invoked sample analysis. Those run on the UI/DRAW thread, whose
    app stack is 32768 bytes and measured 42% used in the same crash report. Verified analyzeSample
    is NOT reachable from AlembicVoice::process.
So Pecto was a genuine outlier: 1024 bytes of 64-element arrays, 2.4x the next-worst process frame.
LINT BUILT 2026-08-05: tools/check-audio-stack.sh. Sums the `sub sp, sp, #N` prologue adjustments of
every ::process() in an am335x object tree (summing, because GCC splits a large frame across two subs
when the immediate does not fit one rotation - taking only the first under-reports). FAILs over
BUDGET (512B default), warns over WARN (256B). Checks process() ONLY: draw/ctors/analyzeSample run on
the 32768-byte UI stack and a 2 KB frame there is not a finding.
VALIDATED AGAINST THE KNOWN BAD BUILD rather than assumed working ([[feedback_validate_the_instrument_first]]):
restored the pre-fix Pecto.cpp, rebuilt, and confirmed the lint FAILs with exit 1 reporting 1076
bytes; restored the fix and confirmed exit 0. Current tree: clean at 512B with 11 warnings, the
largest being Network and AlembicVoice at 452.
CONTEXT.md "Audio Thread" now carries the 2048-byte figure and points at the tool, since the rule was
already written there and still got broken."""

[[item]]
id = "scope-probe-pool-leak"
title = "Scope timebase leaked into the firmware's MiniScope via the shared FifoProbe pool"
status = "done"
stamped = "2026-08-06T20:19:49-05:00"
area = "dsp"
touches = ["mods/scope/ScopeGraphic.h"]
attested = """2026-08-06: shipped in v2.8.0, user confirmed ("scope bug is fixed").
2026-08-05 FIXED (scope 1.2.7), hardware confirmation owed. User: "when we adjust
timescale and gain on scope units the changes can leak to the built in miniscope and persist when
monitoring signals even after deleting scope unit where we made changes."
ROOT CAUSE, traced not guessed. od::AudioThread::getFifoProbe() serves from a SHARED ObjectCache
(AudioThread.cpp:104-112), and od::FifoProbe is constructed with decimate = 2
(FifoProbe.h:12). The firmware's own od::MiniScope::connectProbe (MiniScope.cpp:262-287) acquires
from that same pool and NEVER calls setDecimation - it just relies on getting a probe in the default
state. ScopeGraphic::setDecimation() mutates the pooled object (mpProbe->setDecimation(d)) to carry
the user's timebase, and disconnectProbe() released it WITHOUT restoring the default. So the next
consumer of that probe - the built-in MiniScope, i.e. all signal monitoring - inherited the unit's
timebase, and it persisted after the unit was deleted because the dirty probe simply sat in the pool.
FIX: restore setDecimation(2) and reset() the buffer before releaseFifoProbe, so the probe goes back
in the state the pool promises. Named constant kPoolDefaultDecimation with the reasoning in-comment,
since the coupling is invisible from this file alone.
ON THE "GAIN" HALF of the report: ScopeGraphic::mGain is a plain member consumed only at draw time
and CANNOT leak. The single decimation leak explains both symptoms - MiniScope's trigger threshold
comes from an EWMA over the probe contents, so at 32x the intended decimation the window covers 32x
more time, the trigger re-acquires differently and the trace's apparent scale changes. Worth
re-checking on hardware that the gain symptom is gone once the timebase leak is; if any gain
weirdness survives, it is a SEPARATE bug and this note should not be trusted to cover it.
AUDIT: ScopeGraphic.h is the ONLY file in habitat that touches the probe pool - Spectrogram does not
use FifoProbe at all - so no other unit can leak this way.
Both arches, graphic-virtual lint OK, pkg installed."""
verify = { kind = "manual", ref = "set a Scope unit to an extreme timebase and gain, delete the unit, then monitor any signal with the built-in scope: the display must be back to its normal timebase, and must stay normal across further inserts/deletes" }
note = """Class of bug worth remembering: habitat code that borrows a POOLED firmware object must hand
it back in the state the pool promises. The firmware consumer never re-initialises what it did not
set. See also [[feedback_package_trig_lut]] for the other package/firmware boundary hazard."""

