[[item]]
id = "biome-expo-envelopes"
title = "Biome: simple exponential envelopes - Expo D and Expo AD with expo-variation controls"
status = "done"
stamped = "2026-08-06T20:23:54-05:00"
attested = """2026-08-07: shipped in v2.8.0 (Expo D + Expo AD in biome) and confirmed good by the user. Time controls later moved to the built-in ADSR map at 2.2.1.18.
2026-07-22 (biome 2.2.1.6): implemented per planning/biome-expo-envelopes.md. C++
ExpoEnvelope.h/.cpp = two no-arg od::Object classes (ExpoD, ExpoAD, namespace stolmine) sharing the
inline rational-bend shaper x/(1+k(1-x)); k baked per block from a bipolar [-1,1] Curve inlet via
expf (no per-sample libm); state machine IDLE/ATTACK/DECAY, >0.5f rising-edge trigger, compute-then-
advance so phase 0 = peak. All controls are audio-rate GainBias inlets with mod gain 0 default
(Trigger/Attack/Decay/Curve(s)/Level); time on slewTimes map + octaveScaling; bare descriptions.
SWIG bound, toc entries (Expo D 'ED', Expo AD 'EA'), both arches build, ExpoEnvelope.o NEON-clean (0
suspect), graphic-virtual lint OK, Lua parses (luac -p), linux pkg installed to emu. REMAINING: emu
audition (fire triggers, sweep Curve linear<->expo, AD attack+decay, retrigger) + am335x hardware
sanity. Chosen defaults (open questions resolved): 2 curve controls for AD, bipolar curve, Level
kept, no EOC out, retrigger restarts (may click on retrigger mid-decay - acceptable v1).
2.2.1.18 (user, 2026-08-05): "make sure expo d and ad time controls are uniform with built in ADSR
increments and scaling." Time controls moved from Encoder.getMap("slewTimes") to
Encoder.getMap("ADSR") - the built-in envelope map, bilinear: 0..0.99 s in 0.01 s steps (100 entries,
fine where envelopes actually live) then 1..10 s in 0.0909 s steps (100 entries for long tails).
Replaces the octave map, which gave only 19 stops across 0.003..786 s.
`scaling = app.octaveScaling` REMOVED, and this is correctness rather than cosmetics: Fader::scale
takes log2(value) under octaveScaling and refreshScaling takes log2(map->min()), so it CANNOT
represent a map whose minimum is 0 - which is exactly why the built-in ADSR uses the default
linearScaling with this map. It only affects how the fader BAR is drawn, not the DSP or CV maths.
Net: gains a true 0 s (instant) and ~10 ms resolution through the musical range; loses dial access
above 10 s, matching ADSR's own ceiling (the time INLETS are unclamped, so CV can still exceed it).
Defaults land on map entries exactly - attack 0.01 = entry 1, decay 0.2 = entry 20 - and were left
alone as voicing choices. gainMap untouched: it is the mod-gain dial, not a time increment.
2.2.1.7 (user): all curve controls DEFAULT TO FULLY EXPONENTIAL (+1.0 = k~3.95, fast-drop/slow-tail
decay), not linear - envelopes start fully expo out of the box; the linear/log side is dialled in.
2.2.1.8 (user, anti-pop): adopted tomf Strike's principle (~/repos/er-301-custom-units/mods/strike)
- ALWAYS RAMP, NEVER STEP. Expo D no longer jumps 0->peak (that instant step was the pop); it now has
a fixed 2ms shaped onset rise (kExpoDeclickRise). BOTH units' attack now ramps from the CURRENT env
level (mStartEnv=mCurrentEnv at trigger) to peak, so retriggering mid-envelope glides up instead of
popping. Added mCurrentEnv/mStartEnv state. Both arches, NEON-clean, installed."""
area = "dsp"
touches = ["mods/biome/ExpoEnvelope.*", "mods/biome/assets/ExpoD.lua", "mods/biome/assets/ExpoAD.lua"]
verify = { kind = "manual", ref = "in emu: gate-triggered Expo D (decay-only) and Expo AD (attack-decay) envelope units in biome; each has a curve/expo-variation control that morphs the segment shape (e.g. linear <-> exponential); both arches build; am335x sanity" }
note = """User, 2026-07-22. Two SIMPLE exponential envelope units for the biome package:
- Expo D: decay-only (gate/trig -> jump to peak -> exponential decay to 0).
- Expo AD: attack-decay (gate/trig -> exponential attack to peak -> exponential decay).
Each with an EXPO-VARIATION control that shapes the curve (morph the segment contour,
linear <-> exponential). Keep them SIMPLE and cheap; trigger/gate in, envelope out,
time control(s) + the expo-variation control(s). Standard habitat conventions apply
(mod gain default 0 per [[mod-gain-default-zero]], both-arches build, no branding).
PLAN: planning/biome-expo-envelopes.md (2026-07-22) - signal model (linear phase ->
variable-curvature shaper), the rational-bend curve function (one divide, no per-sample
libm - preferred over powf for am335x), control lists, conventions, build steps, and 5
open questions (AD curve-control count, bipolar curve, Level control, EOC out, retrigger
behavior)."""

