note = """Found by the DMC wrapper audit 2026-08-17. Not a mismapping; the surface just hides what the DSP does.

ModSequencer.lua:67-90 labels four dials Step 1 through Step 4. DMC modulations/mini_sequencer.h:141-151 sets steps 0-3 from those four parameters AND steps 4-7 to their inversions, then calls set_num_steps(8). So the user sets four values and hears an eight-step pattern whose second half is the mirror image, with nothing on the surface hinting the pattern is twice as long.

FIX is naming or documentation rather than routing: label them Step 1/5 .. Step 4/8, or state the mirroring in the unit description."""

[[item]]
id = "control-expansion-coverage-sweep"
title = "Sweep: controls that carry sub-controls on SHIFT but do not expand on ENTER"
attested = "Verified 2026-08-18 by er-301/tests/emu/95-control-expansion-coverage.test, which asserts unit.views[key] CONTENTS for all nine controls across 8 units. Proven to discriminate: the same test fails against the pre-change build spreadsheet-2.8.5.26 (at the Larets mix contents assertion) and passes against 2.8.6.1. Both arches build; graphic-virtual and audio-stack lints clean; full emu suite 62 of 63, sole failure being the unrelated pre-existing breccia-libcore-require-emu. NOT hardware-tested."
