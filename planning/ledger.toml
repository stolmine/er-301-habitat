attested = """2026-08-06: shipped in v2.8.0, spot-checked on hardware ("spot checks come back quite nice").
2026-08-05 (spreadsheet 2.8.3.83): SHIPPED, emu-installed, user audition owed.
Scope narrowed by the user: sequential/random only (Brownian dropped), and "the only
intelligence I want on the step control is that it should never pick the same step twice
in a row". Implementation: od::Option mStepMode (1=random, 2=sequential, default
sequential) per [[feedback_option_vs_parameter]], enableSerialization in the C++ ctor +
Lua. The advance picks an OFFSET in [1, wrapLen-1] from the current step rather than an
absolute index, so an immediate repeat is structurally impossible and the choice stays
uniform over the other wrapLen-1 steps; wrapLen==1 falls through to the sequential
advance (no other step exists). Verified offline over 200k advances at every wrapLen
1-16: 0 repeats, visit min/max spread 0.97-1.00, no out-of-range step. Reset still
forces step 0 in both modes. Both arches build, Larets.o 0 NEON suspect hints,
graphic-virtual lint OK, linux pkg installed to emu."""
