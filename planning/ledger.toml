note = "Branch fabula-am335x. APFTank.h is a Dattorro/Griesinger figure-8 recirculating-allpass tank reverb (mono-in stereo-out, ER network + Brownian-modulated tank delays + cross-coupled feedback governed by house::spiralFastSaturate). am335x adaptation, in order: (1) hybrid-float pass on the per-sample loop (Cortex-A8 has no DP-NEON; state/intermediates/feedback taps -> float, block-rate coeff intermediates stay double, cast-once-before-loop to dodge the float->double promotion trap; mFeedback_L/R members -> float); (2) pow2 delay buffers + &-mask replacing ~26 int-modulo reads/sample (sound-identical); (3) zipper fix (0.2.0.17): per-sample one-pole slew (~25ms, kBaseSlew=0.000833) on the 4 tank Size bases + fractional predelay tap (linear interp) + ER level, so Pre/Size/Early glide Doppler-style instead of stepping at block rate. Per feedback_doppler_basedelay_smoother (Pecto combSize) + feedback_cortex_a8_no_double_in_hot_loops. Both arches build clean, NEON-hint scan clean. OPEN: high-Size distortion (user: 'maybe aliasing') - Spiral governor already on the feedback taps (densityA=1.0), so re-audition post-zipper to decide saturation-softening vs interp-quality/excursion-cap. Later: reduce Brownian-walk update rate; NEON L/R 2-lane SoA after classical wins measured."

