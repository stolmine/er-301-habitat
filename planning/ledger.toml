note = "Fabula's fabula-diffusion-makeup shipped a STATIC, param-driven makeup gain (kDiffMakeup, wetMix = mix * (1 + kDiffMakeup*diffusion), up to ~+5.6dB) rather than a dynamic AGC: the perceived level lost to diffusion (and the multi-tap signed sum) is a deterministic function of the diffusion knob, so a static makeup compensates it exactly with NO tail pumping (a real envelope-tracked AGC would fight the reverb's natural decay). Notate this as a portable model: (1) the loss mechanism (signed multi-tap sum + allpass diffusion drops coherent level as density rises), (2) the makeup formula + where it folds into the wet gain, (3) the static-vs-dynamic rationale, (4) interaction caveats (Freeze makeup kFreezeMakeup, SR/2 tank, normalize before makeup). Main port target = Network (tap-based); also applies to Petrichor/Larets/Pecto multi-tap sums. See [[project_fabula_am335x]], [[feedback_multitap_weighted_feedback]]."

