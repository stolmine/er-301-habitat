(A) Trad-synth poly: several IDENTICAL voices playing one loaded sample, like tomf's Polygon series. Standard poly voice-allocation.

(B) Drum-machine style: an overview ply that traverses a LIST, letting the user load a SEPARATE sample per voice/pad. A voice-selection parameter is SEPARATE from list navigation, and is mappable to v/oct, index, or nearest - like the VariSpeed player's slice param. Stretch: if the user loads a MULTI (selects several samples at once), they are auto-mapped across the pads up to the voice limit.

