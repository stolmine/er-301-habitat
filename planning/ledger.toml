stamped = "2026-08-13T23:51:41-05:00"
area = "ui"
verify = { kind = "manual", ref = "insert PSR fresh: default output swings +/-5 V not +/-10 V; negative level inverts; existing saved patches keep their previous value; both arches build and lints clean" }
note = "User report 2026-08-12: PSR outputs FULL SCALE by default. Confirmed in source: PingableScaledRandom.cpp:47 does mHeldValue = r * scale + offset with r bipolar -1..+1 and mScale defaulting to 1.0 (PingableScaledRandom.h:19, Lua initialBias 1.0), so a fresh insert swings +/-10 V. FINDING THAT SHAPES THE FIX: PSR already HAS a level control, it is just called Scale and has the wrong default and map. Adding a second multiplier called Level would be redundant and confusing. So the fix is almost certainly to give the EXISTING Scale the Constant Random treatment rather than add a control: biasMap Encoder.getMap('[-1,1]') and initialBias 0.5, matching the built-in oscillator Level convention that ConstantRandom.lua adopted verbatim (every core oscillator - Sine, SingleCycle, AliasingTriangle, AliasingSaw - uses [-1,1] at 0.5; 0.5 = +/-5 V which is what a modulation source is expected to swing, 1.0 is still reachable, and bipolar additionally allows a NEGATIVE level = inverted random, which a 0-1 map forbids). DECISIONS FOR THE USER: (a) re-map Scale in place vs add a separate Level and leave Scale as a pre-quantize gain; (b) whether to rename Scale to Level for catalog consistency, which is a cosmetic break. Note the default change only affects NEW instances - saved patches serialize the bias, so existing ones grandfather at 1.0. Same family as mix-control-standards and mod-gain-default-zero."

[[item]]
id = "bletchley-static-when-settled"
title = "Bletchley Park (biome): interesting only while Scan MOVES, static once it settles - single-cycle window has no internal structure"
status = "todo"
stamped = "2026-08-13T23:51:41-05:00"
area = "dsp"
verify = { kind = "manual", ref = "park Scan at a fixed position and the output should still evolve rather than sitting on one static timbre; sweeping Scan should reach materially more of the loaded file than 4 KB" }
note = "User report 2026-08-12: 'the interest always comes from moving the data slider, when it settles the interest fades. perhaps our window is too small to hit interesting loops there?' MECHANISM CONFIRMED in CodescanOsc.cpp: windowSize is hardcoded 256 bytes and mPhase 0..1 maps across exactly that window, so the unit is a SINGLE-CYCLE WAVETABLE oscillator reading 256 signed bytes. A settled Scan is therefore one fixed single-cycle waveform looping at f0 - static timbre BY DEFINITION, ~9 ms per cycle at 110 Hz. The interest while moving is the wavetable morphing as the 256-byte read offset slides. So the diagnosis is right in spirit: at 256 bytes the window IS exactly one cycle, leaving no room for structure longer than a cycle. TRAP TO AVOID, this is the obvious first implementation and it is WRONG: simply enlarging windowSize while keeping 'phase 0..1 maps across the window' does not add richness, it DROPS THE PITCH - a 4096-byte window at the same phase rate is a 16x longer cycle, i.e. 4 octaves down. Window length and cycle length have to be decoupled first. Candidate directions: (1) treat the window as N consecutive 256-byte single-cycles and have the oscillator advance/morph through sub-tables over time, which is wavetable scanning and adds motion at a fixed Scan; (2) a slow internal drift/auto-scan on the scan position so it never fully settles - cheapest fix, directly targets the symptom, could be a Drift control; (3) both. SECOND, SEPARATE LIMITATION found while reading: scanRange is hardcoded 4096 bytes from a randomized mRegionStart (seeded per file load, CodescanOsc.cpp:104), so Scan only ever explores 4 KB of the loaded file - about 0.4% of a 1 MB binary - and the rest is unreachable until reload. Worth a coarse/fine two-tier scan over the whole file."

