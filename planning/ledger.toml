[[item]]
id = "libmvec-linux-vectorize-guard"
title = "Package .so files failed to load on linux: -ftree-vectorize emitted libmvec calls"
status = "done"
stamped = "2026-08-20T15:56:12-05:00"
area = "infra"
verify = { kind = "manual", ref = "no package .so has an undefined _ZGV* symbol; every unit inserts in the emulator" }
attested = """Fixed 2026-08-18/19. Verified with `nm -D --undefined-only` on every built .so: zero _ZGV* symbols remain. The all-units emu sweeps pass for all seven packages.

THE BUG: mod.mk applied -fno-tree-vectorize only under `ifeq ($(ARCH),am335x)`. On linux, -O3 -ftree-vectorize -ffast-math let GCC vectorize loops calling sin/cos/exp into libmvec (_ZGVbN2v_sin, _ZGVbN4v_sinf), which a package .so does not link against. The module then fails to load with 'undefined symbol' the instant a unit is inserted, so the unit is dead in the emulator while the source looks perfect.

FOUND THREE TIMES, which is why the sweep was worth building: first in kryos while building the Spectral Freeze sine LUT, then pre-emptively in biome when that unit moved there, and finally by the new all-units sweep, which had EVERY scope unit dead for this reason and nobody had noticed.

FIX: the guard is now `ifneq ($(filter $(ARCH),am335x linux),)` in catchall, mi, peaks, scope, house, porcelain and zaum. spreadsheet, biome and anamnesis already had it. On am335x this remains the top-priority NEON-safety rule; on linux it also keeps emu codegen in parity with hardware.

TRAP worth remembering: editing mod.mk does NOT invalidate existing object files, so a CFLAGS change needs the object directory removed by hand - and NOT via `make <pkg>-clean`, which deletes the whole testing/<arch> tree rather than just that package."""

