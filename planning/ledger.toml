note = """LOW PRIORITY / far future if ever. Rauschen defines process() (and ctor/dtor)
out-of-line in Rauschen.cpp, so its derived vtable emits with strong linkage in a
single .o (GCC key-function rule) instead of COMDAT. Per feedback_no_out_of_line_virtuals
this is the crash-on-insert anti-pattern (DrumCubeGraphic, Visadhara Phase 2) and Rauschen
is explicitly on that memory's "silently at risk" migration list. It loads today on
linker/firmware-rebuild luck; a future firmware vtable-slot shift could hard-fault it on
insert. Fix = move Internal struct + ctor + dtor + process() (and the CA algo block,
already backed by the header-only CellularEngine.h) fully into Rauschen.h and delete
Rauschen.cpp, mirroring Visadhara (the canonical all-inline pattern). Migration is
mechanical but process() is large. Same latent risk applies to the sibling units in that
memory's list (DrumVoice/Ngoma, Helicase, JF, Pecto, Petrichor, Etcher, Parfait, Impasto,
Tomograph, Excel, Ballot, Larets, Blanda, Colmatage, catchall/Alembic); batch them if the
ABI ever actually shifts. Enforced-adjacent: tools/check-graphic-virtual-defs.sh (currently
graphic-virtuals only; extend to od::Object virtuals -- process/serialize/deserialize -- to
flag these). Do NOT do pre-emptively; only when touching Rauschen substantially or when a
firmware rebuild surfaces the fault."""

