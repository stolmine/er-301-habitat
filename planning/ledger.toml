CONSTRAINTS, all learned the hard way: no runtime sinf/cosf from a package .so on am335x - use a
precomputed LUT ([[feedback_package_trig_lut]]); no out-of-line virtuals on the od::* subclass
([[feedback_no_out_of_line_virtuals]], tools/check-graphic-virtual-defs.sh); keep the heavy work
