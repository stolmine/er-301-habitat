note = "User call 2026-08-12: rename to avoid scuffles with Mutable proper over branding, following VCV's Audible Instruments precedent (which ships the same DSP under functional names). This EXTENDS the already-done branding-attribution-policy - generic externally, precise internally - which swept other packages but evidently not mi. NAMES NEEDING CHANGE (product names): Plaits, Clouds, Rings, Grids, Warps, Marbles T, Marbles X. ALREADY GENERIC, leave alone: Stratos (habitat's name for the extracted Clouds reverb engine), Commotio (habitat's name for the Elements exciter section), Kryos. Audible Instruments mapping for reference: Braids=Macro Oscillator, Plaits=Macro Oscillator 2, Clouds=Texture Synthesizer, Rings=Resonator, Elements=Modal Synthesizer, Warps=Meta Modulator, Marbles=Random Sampler, Grids=Topographic Drum Generator, Tides=Tidal Modulator, Stages=Segment Generator. CARE REQUIRED: (a) the toc moduleName is what patches serialize against, so changing the TITLE is safe but changing moduleName breaks saved patches - rename titles only, or provide an alias; (b) keywords should keep the old names as search terms so users can still find them, which is a usability point NOT a branding one - confirm that reading is acceptable; (c) attribution to Emilie Gillet must stay explicit and must never use the deadname (CONTEXT.md); (d) sweep control descriptions and the README too, not just titles. Pairs with tooling-keyword-metadata-audit. RE-RAISED by user 2026-08-13 (unprompted, second time), so treat as wanted rather than speculative; RESOLVED 2026-08-13 by user on (b): product names MAY remain as search keywords - 'as long as we do not use them -as- branding'. Operational rule: a product name is allowed where it functions as an INDEX or as factual provenance (toc keywords, attribution lines naming the original engine), and forbidden where it functions as the unit's IDENTITY (toc title, unit title, control descriptions, header text, release-note headlines). So Plaits stays findable by typing 'plaits' while the unit reads 'Macro Oscillator 2'."

[[item]]
id = "lane-shear-sorter"
title = "Lane-shear sorter: filterbank pixel sorting - independently permute correlated frequency lanes in time"
status = "wip"
stamped = "2026-08-13T23:51:41-05:00"
area = "dsp"
verify = { kind = "manual", ref = "listening verdict on the pure-shear falsification renders FIRST; if it reads, then per-band segmentation + RMS-keyed rank emission, both arches, three lints, emu smoke, hardware CPU" }
note = "Design: planning/lane-shear-sorter.md (user's design, 2026-08-13). THE INSIGHT BOTH EARLIER ATTEMPTS MISSED: pixel sorting's signature comes from independently permuting many parallel HIGHLY CORRELATED lanes - adjacent rows are nearly identical, so differential displacement shears a vertical edge into a ragged one. Sediment aligned interval boundaries across every lane so everything displaced together (no tear); Millefiori violated the permutation invariant outright (repitching changes the values, and a sort never does). Note the spectral-sort doc already contained the right shape as its time-axis option; the MVP shipped the wrong half. FAITHFUL MAPPING: lanes = 8-24 frequency bands via FILTERBANK not FFT (narrowband within a band means splices at band-local zero crossings, so the click problem evaporates and no phase management is needed); sort axis = time over ~10-30 ms segments; key = segment RMS; intervals CONTENT-DERIVED AND PER BAND with sub-threshold regions passing through untouched, because the alternation between melted and intact is what makes it legible; permutation only, no gain/pitch/repetition. Latency bounded by max interval length, so fixed lookahead and cap intervals. Granular is the right substrate but the scheduler must be a SORT not a cloud. TWO VARIANTS: streaming (fixed per-band delay L, emit in rank order from a running window, no interval detection) and imprinting (derive mask+rank from input B, apply the permutation to A - order transfer, not spectral transfer). FALSIFICATION RUN 2026-08-13 (tools/shear-proto/shear.py, pure per-band circular rotation, no sorting): permutation exact (0.00e+00 deviation); filterbank reconstructs at -329 dB using DIFFERENCES OF LOWPASSES, which telescope - independent Butterworth bandpasses do NOT sum flat, measured -27 dB, and that matters because untouched regions cannot be untouched if the bank colors them. REAL FINDING: differentially shifting bands combs their overlapping skirts, scaling with crossover count and cured by steeper filters - at 16 bands, order 2 gives -5.31 dB median but order 8 gives -0.88 dB and order 12 gives -0.47 dB. ORDER 8 IS THE KNEE; habitat's existing LR4 (Impasto) is 4th order and marginal at 16+ bands. Could NOT establish the perceptual dislocation numerically (an 80%-energy transient-width metric came out 0.97-1.07x source and is useless) - that verdict is a listening one on the renders. DENSE-COLLAGE CORRECTION 2026-08-13 (user): the target material is a dense collage, NOT hits. The first falsification used sparse percussive hits with silence between, the wrong regime - a pixel-sorted image is dense, and the smear comes from continuously present correlated content. Re-run on synthesized dense collage with 100% band occupancy in all 16 bands. LOAD-BEARING FINDING: an ABSOLUTE RMS threshold does not work on dense material - runs never close (median 190 segments = 3.8 s against a 500 ms cap), so every interval hits the cap and the structure degenerates into exactly the uniform grid the design rejects. A RELATIVE mask fixes it: band RMS vs a ~1 s local moving average at ~1.2x gives 20% melted with runs of 6-12 segments (120-250 ms) - content-derived, inside any sane lookahead, and long enough for the sort to have something to permute. Spectral flux also bounds well but leaves ~2 elements per run, too few for a rank ordering to read. Coloration on dense material matches the sparse case (16 bands: -2.54 dB at order 4, -0.79 dB at order 8)."

[[item]]
id = "breccia-slice-glitch"
title = "Breccia: port Network's per-tap glitch effects as PER-SLICE glitch effects"
attested = "Closed 2026-08-20, and overshot the original scope. Network's 5 tap effects became FOURTEEN per-slice effects plus a two-axis macro: Glitch sets density, World morphs four weight vectors that all sum to 0.60 so character changes without density changing. Verify criteria met: Glitch=0 is bit-identical to the plain slicer, proven by tools/breccia-invariant-test across 5 scenarios including poisoned-heap construction, and effects remain mutex, at most one per slice. Shipped in spreadsheet 2.8.6.1 and hardware-tested by the user throughout."
status = "done"
stamped = "2026-08-20T15:56:12-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Glitch at 0 is bit-identical to the plain shuffler; raising it introduces at most one effect per slice; the pattern holds between shuffles and re-rolls on the gate; both arches, three lints, emu smoke, hardware CPU" }
note = "User goal 2026-08-13. Source: mods/spreadsheet/Network.h, which already ships this machinery for delay taps. PORT MAP - the item becomes a SLICE instead of a tap, and all five effects arguably suit slices better than taps: NETWORK_TAP_MUTE -> slice plays silence; STUTTER -> slice repeats a sub-fragment (play the first 1/k of the slice k times); CRUSH -> bitcrush and/or decimate, Network picks one of 3 sub-modes by hash with bit depth from powf(2, 12 - p*9.5) and a separate decimate factor; SCRUB -> modulate read position within the slice (tape-scrub wobble); REVERSE -> play the slice backwards (Network does this with mTapReadAdvance = -1). ARCHITECTURE TO COPY (Network.h:862-905): a single Glitch macro 0..1 scales per-effect probabilities against fixed kMaxMute/kMaxStutter/kMaxCrush/kMaxScrub/kMaxReverse ceilings; cumulative thresholds in 0..65535 unsigned space; per-item mode chosen from a hashed LCG (mGlitchLcg XOR item*2654435761 then LCG-stepped, taking bits 16-31); modes are MUTUALLY EXCLUSIVE per item, at most one effect each. Sub-parameters come from further independent hashes with different XOR masks so they decorrelate. RESEED POLICY: Network reseeds mGlitchLcg on walker wrap so the pattern holds for a cycle then shuffles. For Breccia the natural hook is the SHUFFLE GATE - the same gate that reorders slices re-rolls the glitch assignment - which keeps the control surface at Size + Shuffle + Glitch. Consider a separate reseed later if they want to decouple. CAUTION: feedback_runtime_branched_dsp_dispatch - a runtime switch on a per-item mode inside a per-sample loop has hung A8 before; Network gets away with it by hoisting the mode decision to block rate and keeping the per-sample work branch-light. Follow that structure, and check the objdump for what lands in the sample loop the way Breccia's own build was checked. Glitch=0 must be a bit-identical bypass. BUILT 2026-08-13 in spreadsheet 2.8.5.8. Five effects ported from Network's per-tap glitch as PER-SLICE: MUTE (gain 0), STUTTER (2-7 repeats of the slice head), CRUSH (3-12 bit reduction and/or 2-31x decimation, one of 3 sub-modes by hash), SCRUB (read-position wobble inside the slice), REVERSE. One Glitch macro 0..1 scales probabilities against fixed ceilings summing to ~0.95; cumulative thresholds in 16-bit space; hashed LCG picks AT MOST ONE effect per slice. Hashed on PLAYBACK POSITION not source slice, so effects land at consistent points in the loop; re-rolls on the SHUFFLE GATE, keeping the surface at Size + Shuffle + Glitch. TWO DIVERGENCES FROM NETWORK, both forced by objdump: (1) coefficients computed LAZILY for the slice being entered, O(1), not all N up front - the bulk assigner was O(N) with a powf inside and reachable from the sample loop, so at 1024 slices it put a thousand-iteration burst into one sample slot; also removed ~28 KB of arrays. (2) per-sample path is BRANCHLESS coefficient application, not a mode switch, per feedback_runtime_branched_dsp_dispatch. THREE libm calls found and removed from the sample loop by audit: powf (integer shift for bit depth), floorf in the crush quantizer (magic-number rounding 1.5*2^23), and two double floor() in the stutter wrap and scrub phase (truncation + wrapped accumulator). Final: NO libm in the sample path. Also fixed a clamp that bit at Glitch=0 and would have broken the bypass. CAVEAT: bit-identity at Glitch=0 is established BY CONSTRUCTION (each coefficient takes its identity value and every term degenerates), not by an empirical A/B - worth a null test. PROCESS NOTE: the am335x build check had been grepping ' error' while gcc emits colourized 'error:', so a FAILING ARM build reported 0 errors; use exit codes."
links = { depends_on = ["units-buffer-shuffler"] }

[[item]]
id = "dross-trash-compressor"
title = "Dross: character 'trash' compressor - feedback detector, no threshold/ratio, vinyl grit"
status = "todo"
stamped = "2026-08-14T01:13:42-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Squash + Mix alone behave as a usable compressor with Grit/Wow/Dropout at 0; each of those three is a bit-identical bypass at 0 by null test; no libm in the sample loop by objdump; both arches, three lints, emu smoke, hardware CPU and a drum-loop listening pass" }
note = "User request 2026-08-14: a 'trash' compressor, 'perhaps based on Goodhertz Vulf'. Design note: planning/dross-trash-compressor.md. FILLS THE LARGEST DYNAMICS GAP - Impasto (3-band) plus the firmware Limiter is the entire dynamics story against nine reverbs; aw-batch2-ports would bring Airwindows Dynamics3 but that is a clean broadband comp, nothing in catalog or backlog is a CHARACTER compressor. LINEAGE (researched, correcting the 'drum machine' recollection): the Boss SP-303 Dr. Sample SAMPLER (2001) and its 'Vinyl Sim' effect, carried into SP-404/505. Goodhertz: 'an unknown Japanese DSP engineer engineered a radically weird compression algorithm for the Boss SP-303'; obscure among beatmakers (Dilla, Madlib) until Jack Stratton found it on a forum and had Devin Kerr and Rob Stenson rebuild it. Reported signature is DUCKING - drums pull the whole program in and out - plus squashed lo-fi tightness. CLEAN-ROOM: Vulf is proprietary with no source; built from the published manual and the documented hardware character only, same posture as port-gplv3-cleanroom. FOUR MECHANISMS TAKEN, all cheap on A8: (1) FEEDBACK DETECTOR reading the OUTPUT, no threshold and no ratio at all - the manual states there is no traditional fixed attack time and describes 'complex interaction of signal dynamics and feedback'; a feedback loop self-softens its knee so ratio is meaningless. (2) REFERENCE LEVEL instead of threshold (Vulf's Digital Ref Level, -36..0 dB, default -18) - translates unusually well to the 301 which has no 0 dBFS convention; changes character not just amount because it also sets how hard the grit stage is driven. (3) UNDERSAMPLED UNSMOOTHED GAIN REDUCTION - recompute gain once per 8-16 samples and hold it flat, for gritty snapped transients at NEGATIVE CPU cost. This is a HYPOTHESIS about why the 2001 original sounds broken, not a documented fact - phase 1 must falsify or confirm it offline before anything is built. (4) WOW/FLUTTER at record rates (~0.555 Hz for 33 1/3 rpm plus flutter partials) on a short interpolated delay - this is what makes it read as a record rather than as one more comp. DROPPED from Vulf: HQ mode, stereo phase, external sidechain and listen, pre/post trims, meters, and two of three lo-fi types until one earns an option slot. TWO ADDITIONS BEYOND VULF (we are not cloning): Grit TRACKS gain reduction so the loudest hits are the dirtiest; and DROPOUT - GR past a settable depth collapses the gain briefly and recovers, the reported ducking taken past its limit. SURFACE (spreadsheet, beside Impasto and Parfait): Squash (CV; sub Attack x, Release x, Tilt) / Ref / Grit (sub Flavor, Noise, Track) / Wow (sub Speed 33-45-78, Flutter) / Dropout (sub Depth, Hold) / Mix. Squash+Mix alone must be a usable compressor - that is the 'useful' half of the brief. DSP: env from the output through a one-pole with asymmetric rise/fall, Attack/Release as unitless multipliers on a fixed base pair; program dependence from a DUAL-STAGE RELEASE whose slow stage coefficient depends on the fast stage's excursion; gain law -k*log2(env/ref) via log2_poly/exp2_poly; apply through tanh_poly so deep GR also distorts. REUSE (most of it is already in-tree): mods/spreadsheet/MultibandCompressor.{h,cpp} detector and gain computer collapsed to one band (closest relative); util/neon_math.h log2_poly/exp2_poly/tanh_poly; er-301/mods/core/objects/Limiter.{h,cpp} three NEON waveshapers; core EnvelopeFollower for envelope state; mods/house/atoms/Lacquer.h for the downsample-shell -> aliasing -> smoothing grit pattern; Larets FX_DOWNSAMPLE/FX_BITCRUSH and Breccia's newer libm-audited crush. Genuinely new: the feedback loop, the undersampled detector, the wow/flutter delay, the dropout gate. CAUTIONS: feedback_runtime_branched_dsp_dispatch - Grit flavor and Dropout state must not become runtime switches inside the sample loop, hoist to block rate and check the objdump as Breccia's build was checked; no libm in the sample loop, audit BEFORE shipping rather than after (Breccia found powf, floorf and two double floor after the fact); the three bypasses need EMPIRICAL null tests, not by-construction claims (Breccia's bit-identity is still owed an A/B); a feedback detector with an undersampled gain update CAN OSCILLATE, sweep update rate against release floor before pinning control ranges; stereo per biome-discont-mix-left-only and drywet-crossfade-audit - bind Mix on both instances, decide the link question explicitly (Vulf links by default), equal-power crossfade if the wet path decorrelates; am335x build greps must use exit codes, gcc emits colourized 'error:'. PHASES: 1 offline python model to falsify mechanism 3 and fix the gain law and release constants - nothing is built until that render convinces; 2 core unit Squash/Ref/Mix; 3 Grit; 4 Wow; 5 Dropout; 6 hardware CPU, insert/delete, serialization round-trip, drum-loop listening pass."

[[item]]
id = "gesso-glue-compressor"
title = "Gesso: SSL-G-style glue bus compressor on an Airwindows Pressure6 engine (MIT)"
status = "todo"
stamped = "2026-08-14T01:13:42-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Phase-1 port A/Bs against Pressure6 offline at matched settings; Auto release holds a drum bus without breathing where a fixed 0.1s detent does not; Sag=0 is an exact bypass; stereo link verified on BOTH instances; no libm in the sample loop by objdump; both arches, three lints, emu smoke, hardware CPU" }
note = "User request 2026-08-14, second of the dynamics pair, following dross-trash-compressor. Design note: planning/gesso-glue-compressor.md. GAP: dynamics is the collection's thinnest category - Impasto (3-band) plus the firmware Limiter against nine reverbs. Dross is the character comp; Gesso is the useful one, and they SHARE detector infrastructure so building both costs less than either twice. SURVEY (~/repos/airwindows, Airwindopedia.txt 6946 lines + LinuxVST sources): there is NO SSL G clone in the catalogue. Logical4 is the only SSL-tied plugin ('it's going to be in the SSL style: there's a sparkliness') but the provenance is thin - the Rock SSL impulse convolution the pedia cites at line 743 lived in the OLD PAID Logical; Logical4's source has NO convolution, so what survives is voicing not measurement - and it is expensive: three cascaded ButterComp stages interpolated by Ratio, each bipolar x interleaved = 4 detectors per channel per stage (up to 24 states/channel), three 999-sample sag buffers, up to 36 pow() per sample frame, ~845 lines. Pressure6 is the one Chris built for this job ('my target was 2-buss Compressor... more like glue compressor... still a variation on Vari-Mu'), ~65 lines, TWO state variables, no buffers. ButterComp2 is the third glue candidate (genuine feedback release modulation, divisor = compfactor/(1+|lastOutput|)) - softer, holographic, Fairchild-adjacent. LICENSE: MIT, Chris Johnson, no per-plugin exceptions, credit requested. DECISION: Pressure6 as the ENGINE, SSL G as the CONTROL SURFACE, Logical4's Power Sag as the one color knob. Rejected: ButterComp2 as engine (lovelier but not what 'SSL G' means to anyone, and 4 detectors/channel costs more for a sound further from the brief); Logical4 entire (SSL claim does not survive reading the source). WHY PRESSURE6 FITS, read from the source not from the pedia: (1) it is a FEEDBACK compressor - input is pre-multiplied by muComp BEFORE the detector reads it, so the detector sees the compressed signal, same topology class as the G comp, arrived at independently; (2) the time constant is PROGRAM-DEPENDENT - muSpd chases the signal, clamped [adjSpd, 2*adjSpd] - and auto-release is the single mechanism most responsible for SSL glue; (3) stereo linked at the detector, one coefficient for both; (4) cost is trivial - one sin() per channel, ~5 divides, pow() only in per-block setup, no exp/log/tanh/sqrt in the loop. TWO CONSTRAINTS THE DESIGN MUST BREAK: adjSpd = ((A*92)+92)*overallscale is derived from the SAME KNOB as threshold, there is no independent speed control at all; and the [adjSpd, 2*adjSpd] clamp is only a 2:1 span, alive but not a real dual-stage auto release. Also B is NOT a dry/wet - at B=1 the dry coefficient is 0.01 and the wet path is a sine soft-clip; keep the behavior, do not label it Mix. SURFACE: Thresh (CV) / Ratio 2-4-10 / Attack 0.1-0.3-1-3-10-30 ms / Release 0.1-0.3-0.6-1.2 s + AUTO / Makeup (CV) / Sag / Mix (sub HPF sidechain highpass). Detents not continuous knobs - the SSL workflow, and discrete options serialize cleanly per discrete-control-standard-inventory and control-step-standards-inventory. Auto is the default Release and the reason the unit exists. THE ONE PIECE OF REAL DESIGN OWED is the Auto release: dual time constant, fast stage ~50-100 ms plus slow ~1-2 s, effective release crossfading toward slow as sustained GR accumulates; keep muSpd as the fast state, add a slow integrator over the GR, interpolate the release coefficient under it; fixed detents pin the interpolation and take adjSpd from the detent, which also resolves the adjSpd-tied-to-threshold constraint. Drum bus is the honest test. FROM LOGICAL4 take ONLY the Power Sag: d[n] = |in| * (intensity - sumOfControls*0.0033002236853241) with a 499-sample boxcar (control += d[g]/offsetA; control -= d[g+offsetA]/offsetA) - a supply droop that deepens as the comp works harder; two adds and a multiply once 1/offsetA is precomputed, one FLOAT ring per channel (499 floats, not the source's 1000 doubles). PORTING CAUTIONS: every Airwindows plugin is DOUBLE throughout and A8 VFP is slow at doubles - use the hybrid-float pattern from fabula-am335x, floats for audio, double only where the recursion needs it (muComp/muSpd are the candidates, measure don't assume); DELETE the 32-bit float dither block that ends every Proc.cpp (frexpf + pow(2,expon+62) per sample per channel, pure VST housekeeping) but KEEP the 1.18e-23 denormal guard; do NOT port processDoubleReplacing, every file contains the identical algorithm twice; pow(x,2) -> x*x in the sag code; STEREO LINK is at the detector with shared muComp/muSpd state, but a 301 stereo unit is two instances so the link must be explicit (shared detector or link path) - getting this wrong is exactly biome-discont-mix-left-only, decide up front and test BOTH instances; feedback_runtime_branched_dsp_dispatch - Ratio/Attack/Release are options, resolve to coefficients at block rate, never switch on them inside the sample loop; no libm in the sample loop, sin() goes to sine_poly from util/neon_math.h, audit the objdump BEFORE shipping (Breccia found three after the fact); drywet-crossfade-audit - Mix is a CORRELATED wet path so LINEAR crossfade is correct here and equal-power would be wrong, noted so the audit does not 'fix' it; am335x build greps must use exit codes, gcc emits colourized 'error:'. ATTRIBUTION: MIT with credit requested - Pressure6-derived engine and Logical4-derived sag both named in the unit description, package README and release note per readme-airwindows-attribution; the SSL G reference is described as a CONTROL SURFACE influence, not an emulation claim. PHASES: 1 engine port mono, floats, dither gone, sine_poly, A/B against the plugin offline before anything is added; 2 decouple speed from threshold, add Ratio/Attack/Release detents, Thresh and Makeup; 3 Auto release dual time constant + drum bus listening pass; 4 Sag with exact bypass at 0; 5 sidechain HPF and Mix; 6 stereo link decided and tested; 7 hardware CPU, insert/delete, serialization round-trip of every option control, listening pass."

[[item]]
id = "diptych-mid-side"
title = "Mid Side: stereo-only mid/side splitter with a processing branch per side"
status = "todo"
stamped = "2026-08-14T01:13:42-05:00"
area = "units"
verify = { kind = "manual", ref = "Branches empty and both faders at unity, output is BIT-IDENTICAL to input by null test; refuses to load in a mono chain; Side fader reads as width and reaches mono at zero; branch contents and fader positions survive a serialization round-trip; emu smoke plus hardware insert/delete" }
note = "User request 2026-08-14. Design note: planning/diptych-mid-side.md. FILLS THE STEREO/IMAGING GAP - currently a total blank in the collection and the firmware has nothing either; identified as one of the three biggest holes in the 2026-08-13 gap review. Package biome, with the utility and mixing units; Fade Mixer is the closest precedent as the existing branch-meter unit. THE UNIT: M/S encode in, decode out, a branch in each leg. M=(L+R)*0.5, S=(L-R)*0.5, return L=M+S, R=M-S. Two BranchMeter controls, mid and side, whose FADERS ARE THE M AND S GAINS - so WIDTH COMES FREE (side down is narrower, up is wider, fully down is mono) and no separate Width control is needed. That is the whole surface. IMPLEMENTATION: probably NO C++ AT ALL - four adds and two gains, buildable from app.Sum plus app.ConstantGain(-1) in Lua, the way planning/fdn-reverb-design.md describes Erbe's butterflies being built from app.Sum. No DSP object, no SWIG binding, no NEON, no am335x port risk. A trivial C++ atom is the fallback only if native-object overhead measures badly on hardware. STEREO-ONLY, two mechanisms both needed: channelCount = 2 in mods/biome/assets/toc.lua the way 'Stereo Mix' does it in er-301/xroot/builtins/toc.lua, AND a runtime guard in onLoadGraph following er-301/mods/core/assets/Delay/SpreadDelayUnit.lua:21 ('can only load into a stereo chain'). THE ONE REAL UNKNOWN, and the obvious mental model is WRONG: an ER-301 Branch is a SOURCE sub-chain, NOT an insert. Read er-301/xroot/Unit/init.lua:226 and er-301/xroot/Chain/Branch.lua - addMonoBranch's leftDestination is where the branch OUTPUT lands inside the parent, and the outObject/outletName pair is used ONLY by Branch:getOutput for the meter's scope. THERE IS NO PARAMETER THAT FEEDS THE BRANCH'S INPUT: a branch's input is a Chain input set through Chain:setInputSource(i, src), and the only caller in the whole tree is Chain/InputControl.lua:74, the user picking a source from the picker. FadeMixer's addMonoBranch('ch1', gain1, 'In', gain1, 'Out') is a SOURCE for a mixer channel - nothing flows out to it. So 'M goes out to the branch, gets processed, comes back' needs a mechanism, and there are three candidates in preference order: (1) PRE-WIRE the branch input to the unit's own sub-output - expose Mid and Side as unit outputs via the multi-out framework (docs/multi-output-units-author-guide.md, args.subOutLabels) then at graph-load call branch:setInputSource(1, Source.Internal('local', self, 3)); Source.Internal (er-301/xroot/Source/Internal.lua) wraps any object with getOutput/getInstanceKey/getOutputDisplayName and a Unit has all three; if this works the round trip is seamless and the user sees an ordinary branch - UNTESTED, THIS IS THE SPIKE. (2) same exposure but MANUAL wiring - user picks 'mid' as the mid branch's input; certainly works, costs one picker action per branch, needs documenting. (3) direct pChain:setInput - Chain.init already does self.pChain:setInput(0, outlet) with a raw outlet so the C++ side accepts one, but it bypasses the Source abstraction and serialization almost certainly will not round-trip; last resort. VANILLA CAVEAT for 1 and 2: Out1/Out2 are L/R so Mid and Side are sub-outs 3 and 4, and the author guide is explicit that vanilla's getOutputSource(i) is hardcoded to stereo and sub-outs 3+ are INVISIBLE there - which makes per-branch processing a STOLMINE-FORK FEATURE. On vanilla the unit still loads and still passes audio, the branches just have nothing to select. Decide whether that is acceptable or whether biome must stay vanilla-clean BEFORE building. PHASES: 1 spike the branch feed (candidate 1, in isolation, before any unit work - everything else is trivial and this is the only thing that can fail; if all three candidates fail the unit degrades to a plain M/S width utility with two faders and no branches, still worth having, but say so and re-ledger); 2 matrix plus stereo guard, native objects, null test at unity; 3 the two BranchMeters bound to the M and S gain parameters, pattern from mods/stolmine/assets/FadeMixer.lua:80; 4 hardware - insert/delete, serialization round-trip, CPU, and a listening check that the Side fader reads as width."

[[item]]
id = "sill-window-comparator"
title = "Window Comparator: two windows + logic section on the multi-out framework (Compare 2 reference)"
status = "todo"
stamped = "2026-08-14T01:13:42-05:00"
area = "units"
verify = { kind = "manual", ref = "Truth table verified for both comparators including the NEGATIVE-SIZE never-active case and the FF toggle; all 8 sub-outs reachable and cycling via M6 with preset save/restart/reload surviving; each of the three B-side branches normals to A when unpatched; Smooth edge mode measurably beats Hard on the ring-modulator patch; vanilla loads with sub-outs 3+ dropping silently; hardware am335x pass" }
note = "User request 2026-08-14, third of the utility set. Design note: planning/sill-window-comparator.md. FILLS THE LOGIC/COMPARATOR GAP - no gate logic, no comparator, no window detector exists in the collection OR in the firmware, so a patch needing one currently cannot get one; named after a window sill and a geological sill, which puts it beside Breccia and Sediment. Package biome with the CV utilities (Gridlock, Integrator, Quantoffset, PSR); biome's naming is otherwise functional so 'Window Comparator' is the fallback name. REFERENCE, from the Compare 2 user manual rev C 2018-06-18 (joranalogue.com), read in full: a window comparator fires when the input is BETWEEN two levels rather than above one. Per comparator: SHIFT offsets the window centre -5..+5 V, 0 V centred; SIZE sets the distance between edges 'from very small (a few mV) to 10 V maximum'; Shift and Size CV inputs are ADDED to the knob settings and both accept negative CV - and critically 'in the case of the size parameter, this can cause the window to become negative, which simply means the comparator output will never become active', which is a FEATURE not a degenerate case because it is what lets the CV inputs act as extra gate inputs; signal input takes CV or audio; OUT is +5 V inside the window, NOT is its logical inverse. NORMALISATION: signal AND CV inputs normalled left to right 'so by default the same signal is sent to both comparators' and 'both comparators can be voltage controlled together', with the right side patchable for full independence. LOGIC SECTION from both comparators: AND only when both active, OR when one or both, XOR only when one, and rising edges of XOR toggle a flip-flop FF. LEDS, which the manual calls 'Compare 2's most striking feature': blue below the window, red above, white inside, and OFF rather than white when the size is negative and the signal is inside that negative window. SEVEN DOCUMENTED PATCHES, which are the real spec: complex rhythm generator (LFO in, gates at different points of the cycle); dual PWM at audio rate (triangle in, pulse whose width is shift/size, 'the frequency can transition between fundamental and +1 octave', phase modulation by modulating shift with a narrow window); frequency multiplier/divider (same signal both sides, XOR gives fundamental/+1/+2 octaves, FF gives -1/0/+1); digital ring modulator (two frequencies, XOR as audio out, PWM-able); dynamic depth oscillator sync (XOR into a VCO's FM in); chaotic envelope looper (EG out to input, FF back to EG gate, envelope oscillates between two boundary levels, modulate a window param for chaos); logic function array (shift at max, size centred, edges land at +2.5 and +7.5 V to pass +5 V gates reliably, and because the CV inputs double as gate inputs 'a total of 6 gate input signals can be processed'). FOUR OF THE SEVEN ARE AUDIO-RATE, which drives the aliasing decision below. WHY MULTI-OUT: eight outputs - outA notA outB notB and or xor ff - all from shared internal state; passes the author guide's 'derivable at destination' test since AND cannot be reconstructed from outA downstream and the logic section IS the relationship between the two comparators. Against docs/multi-output-units-author-guide.md: subOutLabels {'outA','notA','outB','notB','and','or','xor','ff'} all within the 6-char limit; SUB-OUT 1 IS PRIMARY and auto-wires so it must be the best default, outA; EIGHT IS NEAR THE PRACTICAL CEILING (guide: 'if your design calls for >=10 sub-outs, look hard at whether the unit should instead be a sub-chain') - eight is inside it, the M6 cycler will be slightly tedious, but it is the module's actual output set and dropping any one loses a documented patch; CPU is Category A/B throughout (comparisons and booleans on state already held) so gate the four LOGIC outs on Outlet::isConnected() and leave the four comparator outs ungated then measure, since the guide warns the branch can cost as much as the work for cheap Category A; NO sinf/cosf in the DSP so the am335x package-trig bug does not apply, but if the visualizer needs trig use the kLutCos/kLutSin pattern from mods/spreadsheet/FilterResponseGraphic.h; VANILLA - sub-outs 3+ are invisible on stock firmware so six of the eight outputs are stolmine-only, the unit still loads and outA still works, describe it as a stolmine-first unit. NORMALLING USES THE CASCADE MASK, NOT SOURCE REBINDING: the author guide already blesses this exact pattern ('Just-Friends-style right-to-left normalling') - each frame Lua walks the sub-chains, computes a presence mask with getInputSource(1) ~= nil, pushes it to C++ as a parameter, and the DSP falls through to the neighbour for unpatched cells. The guide is emphatic on two points that apply directly: DO NOT rebind empty cells with chain:setInputSource(j, ...) because it mutates inlet ownership on the audio thread and makes the engine-visible source structure a lie; and use getInputSource(1) ~= nil NOT branch:length() > 0, since the latter is true when a unit was added but nothing patched into it. So comparator B's input, shift and size each get a branch and each falls through to A's when unpatched - no Link control needed, the normalling IS the link, exactly as on the hardware. CONTROLS: Shift A / Size A / Shift B / Size B (all bipolar with CV branches, B normalled to A), In B (mono branch normalled to the chain input), Edge option Hard/Smooth. Per the guide's control-polarity section Shift and Size are naturally bipolar so declare them bipolar directly rather than unipolar-plus-toggle. DO NOT CLAMP SIZE AT ZERO - negative size means the window never opens, the manual leans on it, it is how the CV inputs double as gate inputs and what the logic-function-array patch depends on; a well-meaning clamp would silently delete a documented feature. THE CUSTOM CONTROL - A WINDOW SCOPE, the direct translation of the manual's 'most striking feature': one ply (two if it wants room) showing the input trace, THE TWO WINDOWS DRAWN AS HORIZONTAL BANDS across it so shift and size are visible as geometry rather than numbers, the trace coloured by state against window A (below/inside/above, the three-colour LED made continuous rather than instantaneous), and a row of eight indicators along the bottom lit per active sub-out. The bands answer what the hardware LED cannot: where the window sits relative to the signal and how close it is to catching - which is the whole skill of using a window comparator and is invisible on the hardware. Follow project_bias_indication's convention for the band edges during encoder interaction; docs/graphics-authoring-guide.md for primitives. ALIASING IS THE ONE GENUINE DSP PROBLEM: Compare 2 is analogue so its edges land wherever they land; ours are quantised to the sample grid, and four of the seven documented patches are audio-rate (dual PWM, frequency multiplier, digital ring modulator, oscillator sync). Hard edges will alias badly and the ring modulator is exactly where quantised edge timing becomes inharmonic hash. So Edge is not garnish: HARD is naive comparison, correct and cheapest for CV-rate use which is the common case and therefore the default; SMOOTH is BLEP-corrected edges with the transition placed at the sub-sample crossing found by linear interpolation between the two straddling samples - the same problem and solution as helicase-sync-polyblep. DSP is trivial: lower = shift - size*0.5, upper = shift + size*0.5, a = (in > lowerA) && (in < upperA) which yields never-true for negative size BY CONSTRUCTION; and/or/xor from a and b; FF toggles on rising xor. No libm; resolve Edge to a function choice at block rate per feedback_runtime_branched_dsp_dispatch; one bit of state for the flip-flop and one for the XOR edge detector. PIN THE VOLTAGE CONVENTION BEFORE WRITING ANY OF IT - the manual's numbers are in volts (-5..+5 shift, 10 V max size, +5 V gates, +2.5/+7.5 V edges in the logic-array patch) and the 301 has its own internal scaling; read what the firmware's Offset unit and app.Comparator actually use and match it rather than assuming 1.0 means 10 V, because getting this wrong makes every number in the manual useless as a starting point. PHASES: 1 DSP atom, eight outlets, hard edges, verified against a written truth table including negative size and the FF toggle before any UI exists; 2 multi-out wrapper with the guide's full stolmine-emu checklist (M6 cycling, subscribe to a non-primary sub-out, preset save/restart/reload); 3 normalling via the cascade mask, each of the three branches tested patched and unpatched; 4 Smooth edge mode, A/B the ring-modulator patch against Hard as the falsification; 5 window scope; 6 vanilla and hardware checklists including the preset-drops-sub-out-3 case. ATTRIBUTION: nothing is ported, a window comparator is a standard building block which the manual itself says is 'common in general electronics, but rarely found in modular synths'; the debt is to the ARRANGEMENT (two windows, complementary outputs, that logic set, left-to-right normalling) and to the patch ideas, so credit Joranalogue's Compare 2 as the design reference in the unit description and release note. No clean-room concern, no code involved."

[[item]]
id = "nacre-quadrature-width"
title = "Nacre: quadrature stereo width + image rotation + frequency shift on one Hilbert pair"
status = "todo"
stamped = "2026-08-14T01:13:42-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Width=0 and Shift=0 is bit-identical to input; L+R == 2M EXACTLY at every Width setting with Shift at 0; Rotate at 0.1 Hz visibly rotates a goniometer trace with no change in mono sum level; Shift mode matches a known-good frequency shifter; NO sinf/cosf in the package binary by objdump; stereo-only guard; both arches, three lints, emu smoke, hardware am335x pass" }
note = "User request 2026-08-14 after the stereo-width survey. Design note: planning/nacre-quadrature-width.md. Named for mother-of-pearl, whose colour comes from PHASE INTERFERENCE between thin layers rather than pigment - which is exactly the mechanism - and which sits with Breccia, Sediment and Window Comparator. Package spreadsheet with the effects; biome is the alternative since the frequency-shifter face is a utility, but the unit as a whole is a creative stereo effect. CORRECTS THE RECORD: the 2026-08-13 gap review called stereo/imaging 'a total blank' and diptych-mid-side repeats it - that is WRONG. There is no user-facing width UNIT but there is real width DSP in the tree: Sujet's Space (mods/zaum/atoms/STFTSpectral.h) is a sophisticated spectral decorrelator - fixed-seed white-phase table smoothed by 6 boxcar passes so ADJACENT BINS GET CORRELATED OFFSETS (the anti-metallic trick), BQI frequency weighting peaking at 600 Hz per Okano/Beranek/Hidaka, applied anti-symmetrically to L/R, weighted by spectral PROMINENCE so tonal peaks stay frontal while noise bins spread, magnitude untouched; er-301/mods/core/objects/Spread.{h,cpp} is a widener object that exists in the firmware and is NEVER EXPOSED AS A UNIT; Filament (mods/house/atoms/Filament.h) already does asymmetric allpass decorrelation with Fibonacci delays 5/13 on L against 8/21 on R; Fabula's APFTank, Galactic, Network and Anamnesis all have structural or geometric width. The gap is REACHABILITY, not technique, and Nacre is deliberately a technique the tree does not already have. THE PRIMITIVE: an IIR Hilbert transformer pair - two parallel chains of first-order allpass sections with a one-sample delay on one branch, outputs 90 degrees apart across the band; published coefficient sets exist, 8-12 sections total gives usable accuracy; call the outputs I and Q. THREE THINGS FALL OUT OF IT, which is the whole argument for one unit rather than three: (1) QUADRATURE WIDTH - Q is decorrelated from I at every frequency with NO COMB NOTCHES, unlike a Haas delay or a complementary comb which achieve decorrelation by putting notches somewhere; (2) SINGLE-SIDEBAND FREQUENCY SHIFT - out = I*cos(2pi f t) - Q*sin(2pi f t), the frequency shifter currently buried inside biome-utility-dsp-units; (3) IMAGE ROTATION - the same shift at a fraction of a Hz applied anti-symmetrically to L and R makes the image rotate continuously. THE STRUCTURAL IDEA - INJECT WIDTH INTO S ONLY: work in mid/side, M passes untouched, S' = S + width*H(M), out L = M + S', out R = M - S'. CONSEQUENCE WORTH STATING PLAINLY: the mono sum is L+R = 2M EXACTLY at every width setting, because anything added to S vanishes when the channels sum - so Nacre is mathematically mono-compatible BY CONSTRUCTION, not by careful tuning, the same trick that makes the Lauridsen comb mono-safe applied to a quadrature source instead of a delay. It also handles both cases with one path: a mono source has S=0 so S'=width*H(M) synthesises width from nothing, a stereo source keeps its own S and gets quadrature energy on top. No mode switch. CONTROLS: Width (0..1, CV, quadrature injection into S, 0 = bit-identical bypass) / Shift (bipolar, CV) / Range option (Drift +-2 Hz, Shift +-500 Hz, Wide +-5 kHz) / Mode option (Rotate = anti-symmetric L +f R -f, Shift = common both +f) / Bass (mono-below crossover) / Mix (linear). Shift and Range are ONE IDEA AT TWO SCALES - sub-Hz is image rotation, hundreds of Hz is a frequency shifter - and Mode decides anti-symmetric versus common. One mechanism, two well-known musical behaviours, no redundant DSP. BASS EARNS ITS PLACE TWICE: the Hilbert approximation degrades near DC so quadrature width at the very bottom is unreliable anyway, and a mono-below crossover turns that limitation into the feature everyone wants; it also absorbs the multiband-width idea from the survey without spawning a fourth unit. CAUTIONS: THE AM335X PACKAGE-TRIG BUG - the SSB modulator needs sine and cosine and docs/multi-output-units-author-guide.md documents that package-side sinf/cosf MISCOMPUTE on am335x at the package/firmware call boundary, silently and geometrically; do NOT call libm, use a COUPLED-FORM (magic circle) QUADRATURE OSCILLATOR which is two MACs per sample, needs no libm at all and is cheaper than a LUT lookup, with the kLutCos/kLutSin pattern from mods/spreadsheet/FilterResponseGraphic.h as the fallback if amplitude drift in the recursion matters - it needs periodic renormalisation either way. STATE THE USABLE BAND - the Hilbert pair holds 90 degrees only over a designed range, degrading at DC and Nyquist; pick the coefficient set deliberately, document the band, do not pretend the corners work. THIS IS AN INTERNAL-STEREO UNIT (Pattern B in planning/larets-stereo.md), not two mono instances - M/S needs both channels inside one object, and getting it wrong is biome-discont-mix-left-only again. STEREO-ONLY: channelCount = 2 in toc.lua plus the onLoadGraph guard, same as diptych-mid-side and SpreadDelayUnit. drywet-crossfade-audit: the wet path is CORRELATED with the dry (built from the same M) so LINEAR crossfade is correct and equal-power would be wrong - noted so the audit does not 'fix' it. feedback_runtime_branched_dsp_dispatch: Range and Mode resolve to coefficients at block rate, never switched inside the sample loop. OVERLAPS biome-utility-dsp-units, which lists a frequency shifter among its four utilities - Nacre's Shift face covers it; NOT marked as superseding because that item also covers the simple allpass, dome filter and bitcrush/downsample, but when Nacre ships, STRIKE the frequency shifter from that item's scope rather than building it twice. scope-goniometer is the honest prerequisite - width and mono compatibility cannot be tuned by ear alone; Nacre is testable without it since the mono-sum identity is numerical, but a user cannot USE it well without a correlation display. PHASES: 1 Hilbert pair, coefficient set chosen, band documented, I/Q phase error measured offline across the band before any unit exists; 2 Width in M/S with the bit-identity and L+R==2M tests as the GATE - nothing else proceeds until the mono-sum identity holds exactly; 3 quadrature oscillator with no libm, coupled form with renormalisation, then Shift/Mode/Range; 4 Bass crossover; 5 Mix, stereo guard, serialization of both options; 6 hardware am335x CPU plus a specific audit that no sinf/cosf reached the package binary, since the trig bug is SILENT ON EMU and only appears on hardware. NOT LEDGERED, from the same survey and deliberately left out of this unit: LAURIDSEN COMPLEMENTARY COMB (L = M + d(M), R = M - d(M), sum exactly 2M, the cheapest honest mono-to-stereo widener at one delay line, different character from quadrature - comb coloration per channel rather than diffuse phase - so a genuinely different unit not a variant); and VELVET-NOISE DECORRELATION FIR (two short sparse +-1 sequences per channel, already ranked and deferred as 'exotic' in planning/spatial-glitch-impl/02-field.md)."

[[item]]
id = "strata-channel-strip"
title = "Channel Strip: 7-section strip on the house atom bin, with a reusable SectionGate control"
status = "todo"
stamped = "2026-08-14T01:13:42-05:00"
area = "units"
verify = { kind = "manual", ref = "All seven sections bypassed is BIT-IDENTICAL to input by null test; true bypass shows a measurable A8 CPU difference between all-active and all-bypassed; shift toggles a section's bypass and Enter opens its params; seven engage flags plus every section param survive a serialization round-trip; no per-sample libm beyond the audited bounded-range sines; both arches, three lints, emu smoke, hardware pass" }
note = "User request 2026-08-14: a channel strip on sub-controls, top level all bypass gates with parameters underneath, nonlinearity throughout, Airwindows as the parts source. Design note: planning/strata-channel-strip.md. NAME (user direction 2026-08-14: units outside spreadsheet take descriptive factual names, poetic ones stay in spreadsheet) - Channel Strip, replacing the working title Strata; matches how house already names units. Package HOUSE: the atoms are already there and this is the composition consumer that house-atom-library and house-harness-patterns were staged for. THE ARGUMENT FOR BUILDING IT: house-atom-library is ledgered 'component-only by default (no Lua unit/toc) UNTIL STANDALONE VALUE EXISTS' and Channel Strip is that value. Concretely, CAPACITOR2, POINT AND DISTANCE2 ARE ALREADY VENDORED, ALREADY A8-TUNED, AND SHIP TO NOBODY - all three are gated behind Filament and Carriage which are parked (built into the .so, absent from toc.lua) and house-suppress-customs-optimize-ports directs the house originals stay suppressed. Three atoms of idle capital; recomposing them is cheaper than any new port and is the only route by which that work reaches a user. Six of the ten strip-relevant atoms are already in mods/house/atoms/: Console0Channel, Console0Buss, Capacitor2, Spiral, ChromeOxide, Distance2, plus Point, ChainMix, AllpassMono. NAMING TRAP for anyone reading the tree: mods/house/atoms/RotCoat.h, Carriage.h, Filament.h and Lacquer.h are HABITAT ORIGINALS whose names coincide with or evoke Airwindows plugins - they are NOT ports, do not go looking for airwindows/plugins/.../RotCoat expecting a match. SEVEN SECTIONS, order following CStrip's own stated reasoning (its lowpass sits last, after 'all processing like the compressor that might produce hash'): 1 Gate (Pop3's gate, headline Threshold), 2 Filter (Capacitor2 HP+LP, Cutoff), 3 EQ (SmoothEQ3 or BiquadStack, Tilt/Mid), 4 Comp (Pop3's compressor, Compress), 5 Drive (Channel9 Density/Spiral + slew, Drive), 6 Punch (Point + Distance2, Transient), 7 Out (ClipOnly2/ClipSoftly, Level). Each bypass is a TRUE BYPASS NOT UNITY GAIN - CStrip does exactly this with engageX flags and it means an unused section costs nothing; resolve engage at block rate, a whole-section skip is a block-level branch which is fine, but nothing switches per-sample inside a section (feedback_runtime_branched_dsp_dispatch). WHY THESE PARTS: POP3 is the standout of the survey - 148 lines of file but TWENTY-TWO LINES of actual algorithm, 8 params, ~32 bytes of state, no arrays, only two CONDITIONAL sines; it is the ConsoleX dynamics section and habitat currently has NO COMPRESSOR OR GATE ATOM AT ALL; the gain multiplier lives in the LINEAR domain (over threshold it leaky-integrates toward compThresh/|x|, an infinite-ratio target; under it one-poles back to 1.0), ratio is a plain LINEAR CROSSFADE not a dB slope, the gate is PHASE-BASED with the sin skipped entirely once phase passes pi/2, and the gate triggers off the UNCOMPRESSED signal independent of the compressor; it has NO MAKEUP GAIN (ConsoleX supplies it externally) so Channel Strip's Out section covers that. CHANNEL9 is the requested nonlinearity and is remarkably cheap - 171 lines, three controls, no buffers; the saturation crossfades two curves, sin(x*1.5708) (old Density, fat) and sin(x*1.2533*|x*1.2533|)/|x*1.2533| (Spiral, clean), dry->Spiral over 0-100% then Spiral->Density over 100-200%; its highpass carries a Capacitor2-style DIELECTRIC COEFFICIENT so the corner rides instantaneous level and deepens with Drive; its slew clipper is Slew3-style, not a raw first difference but a 3-tap golden-ratio predictor limiting ACCELERATION so steady HF passes. THE CONSOLE MODELS ARE LITERALLY THREE NUMBERS EACH - Neve 0.005832/0.33362176/28811, API 0.004096/0.59969536/27216, SSL 0.004913/0.84934656/23011, Teac 0.009216/0.149/18544, Mackie 0.011449/0.092/19748 (iirAmount / slew threshold / cutoff Hz) - a five-entry lookup table is the whole model distinction, which maps onto an OptionControl perfectly BUT SEE THE 48 kHz PROBLEM. EQ: habitat has no EQ atom at all; two candidates both with ZERO TRANSCENDENTALS IN THE SAMPLE LOOP - SmoothEQ3 is the cheapest steep EQ in the AW repo (3 params, 2 biquads + 2 one-poles per channel, ~34 flops/sample/ch, ~254 bytes state, Q fixed at exactly 1.0 so the coefficient math drops the K/Q divides entirely), and BiquadStack is the SSL-parametric kernel Chris wrote while 'trying to work out what was so special about SSL channel strips' (Butterworth Q ladder used as BANDPASSES rather than for rolloff, giving 'a little region of intensity' with phase-interference 'moats' at the edges rather than a narrowing spike, and a beautifully cheap nonlinearity dis = fabs(a0*(1.0 + out*nonlin)) clamped to 1.0 - b0 modulated by instantaneous level, saturating by CLAMPING, no tanh). Start with SmoothEQ3 for cost; BiquadStack is the upgrade if a sweepable parametric is wanted. CLIPONLY2 is free - zero params, ZERO TRANSCENDENTALS, ZERO DIVISIONS, ~15 lines, and Chris marks the block in-source as liftable; unclipped samples pass BIT-IDENTICAL and all the work synthesizes a soft ramp in and out of an otherwise pure hard clip, with hardness = 0.7390851332151606, the fixed point of x == cos(x). CLIPSOFTLY is its counterpart, touches every sample 'making them bigger, fatter, tubier', dragging output toward the PREVIOUS sample as input goes over unity which is what kills clip glare - ship both as an Out-section option; use ClipOnly2 NOT ClipOnly, v1 has no sample-rate compensation. NOT TAKEN: CStrip and CStrip2 whole (~700 and ~562 lines of one-copy DSP, both bundling decisions we would rather make ourselves). Chris's claim about CStrip checks out in source - it is literal ButterComp, four independent compressors per channel via pos/neg split and A/B flip, and the pedia notes the interleaving the original ButterComp didn't actually use 'the one in CStrip does'. Worth reading, not worth porting whole when Pop3 does a comparable job in 22 lines. If the CStrip gate is ever wanted specifically, lift from DYNAMICS, which is that gate standalone in far less source. UI - THE SECTIONGATE CONTROL: the request was 'top level all gates, parameters on shift'; the shape is right but the two gestures should SWAP because the house already assigns them. Habitat's established idiom for section->parameters is the ENTER-KEY EXPANSION VIEW (Impasto lo = {lo, loThreshold, loRatio, loAttack, loRelease}; Parfait the same with eight controls per band across 34 controls and 8 views; Breccia, Pecto and Vitrail all follow it), while SHIFT IS ALREADY TAKEN by the param-mode sub-display toggle in DensityControl and MixControl where shift swaps the sub-graphic for a row of three readouts. So: ENTER opens a section's parameter board (the idiom users know), SHIFT-PRESS toggles that section's bypass (one gesture, instant, no collision), and the ENCODER on each top-level control drives that section's headline parameter so the top row is playable rather than pure switchgear. THE DELIVERABLE IS A REUSABLE SectionGate ViewControl - extends GainBias, draws section name and an on/off indicator, binds shift to the engage parameter; nothing in the tree does this yet and once it exists any future multi-section unit gets it free, which is worth as much as the strip. Views follow Breccia's SHARED-VISUALIZER pattern: every expansion view includes one common display control so entering any section shows that display plus the section's params; for a strip it should carry gain reduction and level, and Impasto already has GR visualization to borrow. PORTABILITY, applies to everything on the list: READ THE DOUBLE COPY (every Proc.cpp contains the algorithm twice and AW has already commented the dither out of the double version); DELETE EVERY DITHER BLOCK (VST float-buss conditioning, pointless on a modular buss, and it accounts for the ONLY per-sample pow and frexpf in nearly every plugin - same free win already recorded in aw-batch2-ports and gesso-glue-compressor); EVERYTHING IS DOUBLE and Cortex-A8 NEON is single-precision only so doubles fall to the non-pipelined scalar VFPv3 unit - highest-value change, and it is the pass habitat already ran on its own atoms (c918309: Console0Channel/Buss and ChromeOxide, f64 ops 60->16 / 63->16 / 368->89, tone-identical to 1 LSB; 709c38a for Lacquer) - float is safe EXCEPT the lowest-frequency biquads, so compute coefficients in double at setup and run recursions in float; BOUNDED-RANGE SINES ARE POLYNOMIAL-REPLACEABLE (ClipSoftly, Channel9, CStrip's EQ and Pop3 all call sin/cos on explicitly clamped [0,pi/2] or [-pi/2,pi/2] domains and mods/house/atoms/Spiral.h already has spiralFastSaturate, 5th-order Taylor, ~20x faster, 0.45% error) - note per-sample double sin() is NOT a correctness problem on am335x, aw-batch2-ports established Galactic already ships four per sample on hardware and the package-trig bug is sinf/cosf-specific, so this is a CPU decision not a correctness one; DENORMALS - AW guards only the INPUT (fabs(x)<1.18e-23) and internal IIR/envelope state is unprotected almost everywhere, set FZ in FPSCR globally, and Pop3 specifically needs 'if (popGate < 1e-20) popGate = 0.0;' because popGate *= (1-gateRelease) decays toward denormals in silence and the <0.0 clamp does not catch positive denormals; pow(x,2) -> x*x; gate the setup blocks on parameter change since the whole SmoothEQ/ConsoleX family recomputes coefficients every block regardless. THE 48 kHz PROBLEM, SPECIFIC AND IT MATTERS: AW is calibrated at 44.1 kHz and the ER-301 runs 48. CHANNEL9'S ULTRASONIC BIQUADS ARE GATED ON 'if (biquad[0] < 0.49999)' - at 48 kHz Neve (0.600) and API (0.567) fall outside and get NO BIQUAD AT ALL, only SSL, Teac and Mackie filter (at 44.1 kHz only Teac and Mackie do). So shipping the five-model table naively means the model distinction partly collapses to just iirAmount and threshold, and the defining ultrasonic character of the two most-wanted models SILENTLY VANISHES. Either re-derive the cutoffs for 48 kHz or oversample the Drive section, and DECIDE THIS BEFORE the model list is exposed as an OptionControl or the labels will be lying. Also: CStrip's lowpass coefficient ignores sample rate entirely (iirAmountC = kHz*0.0188 + 0.7, ~9% high at 48 kHz); CStrip's gate release is a fixed per-sample decrement, unscaled; CStrip2's LowCap/HiCap are raw normalised coefficients with no frequency mapping; CStrip's divisor /= compscale can push the comp coefficient above 1.0 at high rates (mild at 48 kHz, compscale ~1.088, but clamp it). Only the first genuinely bites Channel Strip as specified but the pattern is the point - check every constant for sample-rate assumptions before trusting it. RELATIONSHIP TO THE OTHER DYNAMICS ITEMS: gesso-glue-compressor is a dedicated glue bus compressor on a Pressure6 engine while Channel Strip's Comp is Pop3, a cheaper strip-internal compressor with a gate attached - not redundant, one is a bus tool with an SSL surface and the other a channel-strip stage; build Gesso first if only one gets built since it fills the standalone-compressor gap Channel Strip does not. aw-batch2-ports is the plan of record for AW porting mechanics and its cross-cutting findings should not be re-derived. PHASES: 1 SectionGate control built and proven against a throwaway two-section unit BEFORE the strip exists (Enter opens params, shift toggles bypass, true bypass verified as CPU savings); 2 skeleton plus Out, seven sections wired all bypassed with ClipOnly2 on the end, null test that everything-bypassed is bit-identical to input; 3 Pop3 Comp and Gate with the denormal fix, habitat's first dynamics atom; 4 Drive/Channel9 AFTER the 48 kHz cutoff question is settled and the model table re-derived; 5 Filter and EQ - Capacitor2 (its HP side needs RESTORING, the habitat port kept LP only) and SmoothEQ3; 6 Punch, Point and Distance2 un-parked from Carriage; 7 hardware A8 CPU with all sections active and with all bypassed, the difference being the real test of the bypass design, plus serialization round-trip of seven engage flags and every section param. ATTRIBUTION: MIT throughout with credit requested - Pop3, Channel9, SmoothEQ3/BiquadStack, ClipOnly2, ClipSoftly and Capacitor2 all named in the unit description, package README and release note per readme-airwindows-attribution; the console model names are Chris's own labels for voicings, not emulation claims, and should be described that way."

[[item]]
id = "peaks-cleanup-sweep"
title = "Peaks cleanup sweep: land the five label/routing defects in one release, with a preset-breakage policy"
status = "todo"
stamped = "2026-08-14T01:32:20-05:00"
area = "units"
verify = { kind = "manual", ref = "All five child items closed in one release; every peaks unit's visible label matches what its DSP parameter does, verified control-by-control against source; High Hat exposes its four params; WSMLFO_SHAPE_NOISE reachable on both WSM LFO and PLO; a pre-sweep preset loaded post-sweep either sounds identical or its divergence is documented in the release note" }
note = "User request 2026-08-14. UMBRELLA over five already-ledgered defects - this item adds coordination and a policy decision, NOT new findings; do not duplicate the children. Children: peaks-taplfo-rate-sets-level, peaks-fmlfo-wsmlfo-swapped-labels, peaks-wsm-plo-wrong-preset-table, peaks-bytebeats-formula-speed-backwards, peaks-highhat-no-controls. Also coordinate with peaks-refinements (Tap LFO clock frequency-counter display, PLO continuous phase-increment, step-position viz) so the package is opened once. ALL FIVE VERIFIED AGAINST SOURCE 2026-08-14 - the earlier reference audit was doc-derived, this is a code read: (1) Tap LFO - peaks/modulations/lfo.h:89-90, in the sync_ branch parameter[0] feeds set_level() and set_rate() is only reached in the else branch at :96, so in sync mode rate is never settable; TapLfo.lua:68 labels it 'Rate'. (2) FM LFO - lfo.h:192-193 maps parameter[2]->set_fm_rate and parameter[3]->set_fm_depth while FmLfo.lua:69,75 label them 'FM Amount' and 'FM Rate'; WSM LFO is the identical inversion at lfo.h:310-311 vs WsmLfo.lua:69,75. Note PLO labels the same pair CORRECTLY as 'WSM Rate'/'WSM Depth', which is the tell. (3) ByteBeats - bytebeats.h:50-57 maps parameter[0]->set_frequency and parameter[3]->set_p2, and bytebeats.cc:62-66 confirms frequency_ drives 'bytepitch = (65535 - frequency_) >> 11' while 'equation_index_ = p2_ >> 13' selects the equation; ByteBeats.lua:57,75 label them 'Formula' and 'Speed'. (4) High Hat - high_hat.h:52-69 Configure() calls set_frequency, set_decay, set_frequency_randomness and set_decay_randomness from parameter[0..3], and HighHat.lua:18-24 creates NO ParameterAdapters at all, so all four sit at the 32768 default and ~50% pitch/decay randomisation is permanently on; expanded = {'gate'} only. (5) THE ONE THAT WAS PREVIOUSLY UNCONFIRMED IS NOW CONFIRMED - lfo.cc:423-432 defines wsmlfo_presets[7][2] whose index 6 is { WSMLFO_SHAPE_NOISE, -32767 }, but WsmLfo::set_shape_parameter_preset at lfo.cc:434-438 indexes the plain `presets` table instead; LFO_SHAPE_NOISE (4) cast to WsmLfoShape lands on WSMLFO_SHAPE_SQUARE (4), and WSMLFO_SHAPE_NOISE (5) is unreachable. wsmlfo_presets is dead code. Plo::set_shape_parameter_preset repeats it at lfo.cc:626-630. Update peaks-wsm-plo-wrong-preset-table's note to drop the 'NOT independently confirmed' caveat. NEGATIVE RESULT THAT BOUNDS THE SWEEP: all 14 toc units were checked for DSP parameters that reach no view, and apart from High Hat every unit exposes 4/4 - Bass Drum, Snare Drum, FM Drum, Bouncing Ball, Mini Sequencer, Mod Sequencer, Number Station, Randomised Envelope, Tap LFO, FM LFO, WSM LFO, PLO, ByteBeats. High Hat is 1/5. So the sweep is exactly these five defects and no more; do not go looking for a sixth. THE POLICY DECISION, which is why this umbrella exists: the defects split cleanly into a SAFE half and a BREAKING half, and the split is not where it first appears. NON-BREAKING: exposing High Hat's four params (no existing parameter data to preserve) and making WSMLFO_SHAPE_NOISE reachable (adds a slot, existing slots unchanged). ALSO NON-BREAKING, and this is the key move - for FM LFO, WSM LFO and ByteBeats the honest fix is to SWAP THE LUA LABELS, not the routing. The DSP keeps doing exactly what it does, saved presets keep sounding identical, and the UI stops lying. Swapping the ROUTING instead would silently invert every existing preset. Prefer relabelling. THE ONE GENUINE FUNCTIONAL LOSS IS TAP LFO: no relabel fixes it, because in sync mode set_rate is never called at all - so either relabel parameter[0] to 'Level' (honest, non-breaking, but sync-mode rate stays unreachable) or restore rate control as a NEW control alongside (breaking only if the clock ratio was previously fixed and users relied on it). Recommend: relabel to 'Level' in this sweep, and treat restoring a sync-mode rate/ratio control as a separate scoped change under peaks-refinements, where the clock frequency-counter display work already lives. SEQUENCING: do the two non-breaking additions and the three relabels together in one release; state plainly in the release note that three labels changed meaning and that no saved preset's SOUND changes as a result. Every label, button and description moves together per feedback_ui_labels - the description strings are as wrong as the button text and are easy to miss."
links = { depends_on = ["peaks-taplfo-rate-sets-level", "peaks-fmlfo-wsmlfo-swapped-labels", "peaks-wsm-plo-wrong-preset-table", "peaks-bytebeats-formula-speed-backwards", "peaks-highhat-no-controls"] }

[[item]]
id = "assay-audio-listener"
title = "Audio Analyzer: audio analysis to CV (env, pitch, centroid, flatness, transient) on the multi-out framework"
status = "todo"
stamped = "2026-08-14T01:32:20-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Phase 1 ships standalone as env+trig with no FFT; the isConnected() gate shows a measurable A8 CPU difference between pitch/cent/flat patched and unpatched; pitch tracks a swept sine within a documented tolerance and holds rather than thrashing in silence and on low confidence; octave errors checked against a detuned pad and a drum loop; latency skew between time-domain and STFT outputs documented and the trigger Delay sub-param aligns them; multi-out picker checklist and serialization round-trip; hardware am335x pass" }
note = "User picked this from four proposals 2026-08-14 as the one they liked most. Design note: planning/assay-audio-listener.md. NAME (user direction 2026-08-14: units outside spreadsheet take descriptive factual names, poetic ones stay in spreadsheet) - Audio Analyzer, replacing the working title Assay; matches how biome already names units; sits with Breccia, Sediment, Window Comparator, Channel Strip. Package biome, with the CV utilities and next to Spectral Follower. WHAT IT IS: one unit that listens to audio and emits five control signals - env (amplitude envelope, PRIMARY), pitch (fundamental as V/oct), cent (spectral centroid, brightness), flat (spectral flatness, tonal vs noisy), trig (transient). Window Comparator turns voltages into gates; Audio Analyzer turns AUDIO into voltages, so a patch can respond to what is actually sounding rather than only to what was deliberately patched. NOTHING IN THE COLLECTION OR FIRMWARE DOES THIS: mods/biome/SpectralFollower.h is a single band-limited envelope (one biquad BPF, one envelope, four params) and the firmware's Envelope Follower is one broadband envelope; there is NO PITCH DETECTOR ANYWHERE IN THE TREE - grepped for autocorrelation, YIN and pitch-detection naming across mods/ and the firmware, nothing. WHY MULTI-OUT AND WHY AFFORDABLE: passes the guide's 'derivable at destination' test easily (you cannot reconstruct spectral flatness from an envelope downstream), and ONE STFT FEEDS PITCH, CENTROID AND FLATNESS - given a magnitude spectrum, centroid is sum(f*mag)/sum(mag) and flatness is a geometric-over-arithmetic mean ratio, both single reductions over bins, i.e. the guide's Category A free byproducts; only the transform is expensive, and envelope and transient run entirely in the time domain and never touch it. SO THE GATING RULE MATTERS MORE HERE THAN IN ANY OTHER PROPOSED UNIT: if none of pitch/cent/flat is connected, SKIP THE FFT ENTIRELY - a textbook Category C gate, meaning a patch using Audio Analyzer only as an envelope follower pays almost nothing. pffft is already vendored (spreadsheet, mi, biome) and an STFT already runs on hardware in Spectral Freeze, so the transform is proven not new. Labels within the 6-char limit: {'env','pitch','cent','flat','trig'}; five is comfortable for the M6 cycler; PRIMARY IS env because it is the most universally useful default and the one thing vanilla can reach. THE LATENCY TRAP, which will otherwise be discovered as a bug: THE FIVE OUTPUTS DO NOT SHARE A LATENCY. env and trig are time-domain and effectively instantaneous; pitch, cent and flat are STFT-derived and lag by at least a hop, plausibly 256-1024 samples. Using trig to sample-and-hold pitch will latch the pitch of the PREVIOUS note unless the trigger is delayed to match. Two honest options - document the skew and let the user compensate, or delay env/trig to align - and delaying is friendlier but destroys the unit as a fast transient detector. RECOMMEND: do not delay, document the skew, expose a Delay sub-param on the trigger so the user can align when they want to. PITCH DETECTION is the hard part and decides whether the unit is any good: zero-crossing is cheap and falls apart on anything harmonic (no); autocorrelation/YIN is the accurate choice but wants its own buffer and cost and shares no work with the other outputs; FFT-BASED WITH HARMONIC PRODUCT SPECTRUM reuses the transform centroid and flatness already need - peak bin plus parabolic interpolation for sub-bin resolution, HPS to suppress the octave errors that are the classic failure mode. Take the FFT route because sharing the transform IS the cost argument for the unit. TWO BEHAVIOURS THAT DECIDE WHETHER IT FEELS GOOD: (1) SILENCE MUST NOT PRODUCE GARBAGE - below an input gate, HOLD the last valid pitch rather than emitting whatever the noise floor peaks at; a pitch output that thrashes between notes is worse than one that freezes. (2) LOW CONFIDENCE SHOULD HOLD, NOT LIE - when the spectrum is too flat or noisy for a fundamental to mean anything, hold; rather than spend a sixth sub-out on a confidence signal, fold confidence into the hold behaviour, and note that flat is already a serviceable confidence proxy the user can patch. CONTROLS: Attack / Release (envelope ballistics), Sens (transient threshold), Range (pitch search range, constrains octave errors), Smooth (shared slew on the CV outputs), Gate (input threshold below which pitch and spectral outputs hold). Sub-params: trigger Delay (see the latency trap), FFT Size if it proves worth exposing. CAUTIONS: VANILLA - sub-outs 3+ are invisible on stock firmware so cent, flat and trig are stolmine-only while env works everywhere and pitch resolves on a stereo chain; THIS IS THE THIRD STOLMINE-FIRST UNIT PROPOSED IN TWO DAYS (diptych-mid-side, sill-window-comparator, this) and the accumulation is worth a deliberate decision about biome's vanilla posture rather than drifting into it. PACKAGE TRIG BUG - pffft builds its own twiddle tables at setup rather than calling sinf/cosf per sample and Spectral Freeze already ships it on hardware, so this is settled, but audit the objdump anyway because the bug is silent on emu. LOG FOR FLATNESS - geometric mean needs a log per bin, use log2_poly from util/neon_math.h not libm. feedback_runtime_branched_dsp_dispatch - the FFT-connected gate is a block-rate decision, never a per-sample branch. CV OUTPUT CONVENTION - pitch must be V/oct in whatever scaling the firmware actually uses; pin it against the core 'V/oct to Hertz' unit rather than assuming, same caution as sill-window-comparator. PHASES: 1 TIME-DOMAIN HALF - envelope with Attack/Release, transient with Sens, two sub-outs, no FFT, works on vanilla, useful on its own and a real shipping increment; 2 STFT plus centroid and flatness behind the isConnected() gate, proving the gate saves what it should by measuring CPU with and without those outputs patched; 3 PITCH - HPS with parabolic interpolation, hold-on-silence and hold-on-low-confidence, tested against a swept sine, a square, a detuned pad and a drum loop (the last two are where octave errors appear); 4 trigger Delay sub-param; 5 hardware A8 CPU in both gated and ungated states, multi-out picker checklist, serialization round-trip. RELATED: spectral-sort-unit, units-spectral-processing and a soothe-style resonance suppressor all want a per-bin spectral analysis stage - IF MORE THAN ONE IS BUILT, THE STFT FRONT END SHOULD BECOME A SHARED ATOM rather than being written three times. Sujet's mods/zaum/atoms/STFTSpectral.h already computes a localRef[k] +-8-bin spectral boxcar and a prominence ratio against it - more sophisticated than anything Audio Analyzer needs, and the obvious donor if a tonality or prominence output is ever wanted."

[[item]]
id = "stft-frontend-atom"
title = "Shared STFT front end atom: one analysis/resynthesis stage for the six units that now want one"
status = "todo"
stamped = "2026-08-14T01:32:20-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Round trip with no processing is bit-transparent, or its noise floor is measured and documented; at least two consumer units build against it unmodified; A8 CPU of the bare round trip measured at each supported size" }
note = "Identified 2026-08-14 while ledgering the spectral batch - this is a structural item, not a unit. SIX LEDGERED THINGS NOW WANT A PER-BIN STFT ANALYSIS/RESYNTHESIS STAGE: assay-audio-listener (analysis only, no resynth), anneal-resonance-suppressor, spectral-cross-synthesis, spectral-sort-unit (design doc exists, planning/spectral-sort-unit.md), units-spectral-processing (Spectral Mask + Spectral Gate), and kryos-spectral-freeze-rebuild (already built its own). Writing the transform six times is the failure mode this item exists to prevent. WHAT EXISTS TO BUILD ON: pffft is vendored three times over (mods/spreadsheet/pffft.{c,h} plus pffft_stubs.c, mods/mi/pffft.h, and biome gained a .c rule for vendored pffft in 2.2.4.1); mods/zaum/atoms/STFTSpectral.h is the most developed analysis/resynthesis code in the tree (Sujet - windowing, hop, phase handling, per-bin state, plus a localRef spectral boxcar and prominence weighting); mods/biome SpectralFreeze rebuilt an STFT phase vocoder from scratch at 2.2.4.1 with a 32-frame magnitude history and phase regenerated from a per-bin unit-complex rotation derived as cur * conj(prev), so there is NO TRIG IN ITS SYNTHESIS LOOP - that trick is worth preserving in any shared atom. THE ACCEPTANCE TEST THAT GATES EVERYTHING DOWNSTREAM: analysis followed immediately by resynthesis with no processing must be bit-transparent, or its noise floor must be measured and documented. Every consumer unit's 'depth/morph = 0 is a bit-identical bypass' claim rests on this; if the round trip is not clean, nothing built on top of it can be. Prove it FIRST, before any consumer's detector exists. SCOPE QUESTION TO SETTLE EARLY: whether the atom is one C++ class with a processing callback, or a pair of analyse/synthesise calls the unit drives itself. The latter suits Audio Analyzer, which analyses but never resynthesises. Prefer the split. Also settle which FFT sizes are supported and whether size is a runtime or compile-time choice - Spectral Freeze and Sujet made different calls here and reconciling them is part of the work. PACKAGE: whichever package the first two consumers land in; do NOT copy it between packages, that is the thing being prevented. If consumers straddle packages, that is an argument for a shared source directory, and habitat has no precedent for one - raise it rather than silently duplicating."

[[item]]
id = "anneal-resonance-suppressor"
title = "Anneal: dynamic resonance suppression (soothe-style), self-keyed against a local spectral average"
status = "todo"
stamped = "2026-08-14T01:32:20-05:00"
area = "dsp"
verify = { kind = "manual", ref = "STFT round trip transparent before any detector exists; Depth=0 is a bit-identical bypass; Delta mode audibly isolates only the ducked material; a resonant peak in a sustained source is reduced while the surrounding material measurably is not; no libm in the loop; A8 CPU measured; hardware pass" }
note = "User request 2026-08-14: 'something like soothe2'. Design note: planning/anneal-resonance-suppressor.md. Named Anneal - heating a metal to relieve internal stress and remove hardness without changing what it is. Package spreadsheet with the other spectral and multiband work. WHAT SOOTHE DOES: per-bin dynamic EQ keyed to SPECTRAL PROMINENCE - for each bin compare its magnitude against a local average of its NEIGHBOURS, and duck wherever a bin sticks out of its own neighbourhood, with attack and release. Resonances (the ringing, honking, sibilant peaks a static EQ can only remove by also removing the note) stick out transiently, so they get ducked only while ringing; everything else passes. Controls that matter: Depth, Sharpness (how narrow a peak must be to count), Selectivity/Bias (which part of the spectrum is scrutinised), speed, and a DELTA LISTEN which on this kind of unit is not a luxury - you cannot tune it without hearing what is being removed. THE DETECTOR ALREADY EXISTS IN THIS REPO, which is why the unit is cheap: mods/zaum/atoms/STFTSpectral.h (Sujet's Space) already computes per bin localRef[k] = a +-8-bin boxcar of the spectrum, ratio = bloomState[k]/(localRef[k]+eps), and promW = clamp(1 - (ratio-1)*kPromSlope). That IS soothe's detector, written, debugged and shipping on hardware; Sujet uses promW to decide how much decorrelation phase a bin receives (tonal peaks frontal, noise diffuse), and POINTING THE SAME RATIO AT A GAIN REDUCTION INSTEAD OF A PHASE OFFSET GIVES THE EFFECT. So the novel work is not the detector - it is per-bin attack/release on the gain (Sujet's use is instantaneous), a Sharpness control over the boxcar width (Sujet's +-8 bins is fixed), and resynthesis, which Spectral Freeze already does. VERIFY the line-level details before relying on them; the summary came from a survey pass, not a line-by-line read. DESIGN NOTES: SHARPNESS IS THE BOXCAR WIDTH - a narrow reference window makes only very narrow peaks look prominent, a wide one flags broad emphases too, and exposing the window width is the cheapest and most legible way to give the control soothe calls Sharpness. REDUCTION MUST BE SMOOTH ACROSS BINS - ducking single bins hard produces the classic warbling phasey spectral residue, so smooth the gain curve across neighbouring bins before applying; Sujet's own anti-metallic trick is instructive, it smooths its phase table with 6 boxcar passes so adjacent bins get CORRELATED values, and the same reasoning applies to gain. DELTA LISTEN IS A FIRST-CLASS CONTROL not a debug aid - it is how the unit gets tuned, so ship it as a Mode option (Process/Delta), not buried. BIAS/TILT OVER FREQUENCY - resonance suppression is almost always wanted more in the upper-mid than the bass where 'prominent bin' just means 'the bass note', so tilt the DETECTOR not the audio; Sujet's mFreqWeight BQI curve is a ready-made shape to start from even though its motivation differs. CONTROLS: Depth (max gain reduction, CV) / Sharp (reference-window width in bins) / Tilt (detector frequency bias, bipolar) / Speed (per-bin attack/release, one knob two coefficients) / Mode (Process/Delta) / Mix (linear). CAUTIONS: latency is STFT hop latency and unlike Audio Analyzer this is an INSERT effect so the latency is in the audio path, document it; log2_poly/exp2_poly from util/neon_math.h for dB-domain work, no libm in the loop; DEPTH=0 MUST BE A BIT-IDENTICAL BYPASS which for an STFT unit means the analysis/resynthesis round trip must be transparent on its own - test that FIRST before any detector exists, because if the round trip is not clean nothing built on it will be; feedback_runtime_branched_dsp_dispatch for the Mode option. RELATIONSHIP TO units-spectral-processing (Spectral Mask + Spectral Gate): those are SIDECHAIN-KEYED or CROSSOVER-KEYED per-band processors while Anneal is SELF-KEYED against a local spectral average - genuinely different effects that happen to share a front end, which is the argument for stft-frontend-atom. PHASES: 1 round-trip transparency, STFT in and out with no processing, prove bit-transparency or measure and document the floor before anything else; 2 detector - port Sujet's localRef/ratio, expose Sharp, and ship Delta mode IMMEDIATELY so the detector can be heard while being tuned; 3 gain reduction with per-bin attack/release and cross-bin smoothing; 4 Tilt, Depth, Mix; 5 hardware A8 CPU - an STFT insert is the most expensive thing in this batch and needs a real number early."

[[item]]
id = "spectral-cross-synthesis"
title = "Palimpsest: spectral cross-synthesis - vocoder, spectral morph and formant shift on one control"
status = "todo"
stamped = "2026-08-14T01:32:20-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Morph=0 is a bit-identical bypass of the carrier; Bands at its wide end reads as a classic banded vocoder and at its narrow end as spectral morphing; both inputs analysed on the same frame boundary (verified by a null test on identical inputs); modulator silence means no shaping rather than gain to zero; A8 CPU measured; hardware pass" }
note = "User request 2026-08-14 from the four-idea batch. Design note: planning/palimpsest-cross-synthesis.md. Named Palimpsest - a manuscript scraped and overwritten where the earlier text still shows through; sits with Fabula, Sujet, Anamnesis in the literary register rather than the mineral one. Package spreadsheet. WHAT IT IS: impose the spectral envelope of one signal on the fine structure of another. Classic vocoding is ONE SETTING of that; the general case is more interesting - A's envelope on B's structure (the vocoder, speech shapes a pad); MORPH between the two envelopes rather than taking one outright; FORMANT SHIFT, moving A's envelope up or down the spectrum before applying it, decoupling perceived size from pitch; and envelope-from-A structure-from-A at the morph extreme so the control sweeps continuously from untouched to fully spoken. THERE IS NO VOCODER ANYWHERE IN THE COLLECTION - Warps has one and it is DELIBERATELY EXCLUDED (the reference audit records the vocoder region above 0.7 was cut from the port, and mi-clouds-warps-improvements carries restoring it as an open item), so the capability is absent by decision not oversight, and a dedicated unit is the better answer than reopening Warps. MECHANISM: two STFTs, or one run over two inputs. Per bin take the magnitude envelope of the modulator (smoothed across bins - THIS SMOOTHING IS THE FORMANT EXTRACTION), divide by the carrier's own smoothed envelope, apply the ratio as a gain to the carrier's bins; the carrier keeps its phase and fine structure and acquires the modulator's gross spectral shape. TWO DETAILS DECIDE VOCODER-VS-MUD: (1) ENVELOPE SMOOTHING WIDTH IS THE BAND COUNT - a wide kernel is a few fat bands and reads as a classic 8-band vocoder, a narrow one tracks individual partials and reads as spectral morphing; one control, two familiar effects, same code, the same structural trick that makes Nacre's Shift/Range work. (2) THE CARRIER MUST BE SPECTRALLY DENSE or there is nothing to shape - noisy or bright carriers work, sine waves do not; a documentation problem rather than a DSP one, but the first thing every user will get wrong. THE SECOND INPUT: the ER-301 gives a unit one chain input, so the modulator arrives as a MONO BRANCH following Warps.lua:49-53 which does exactly this for its Modulator inlet (ConstantGain, hardSet Gain 1.0, setClampInDecibels(-59.9), addMonoBranch('mod', mod, 'In', mod, 'Out')) - proven pattern, already in the tree. CONTROLS: Morph (0 = carrier untouched, 1 = fully shaped, CV) / Bands (envelope smoothing width, vocoder at one end and morph at the other) / Shift (formant shift of the modulator envelope, bipolar) / Speed (per-bin envelope attack/release) / Mix (linear), plus the mod branch as its own control. CAUTIONS: FREEZE THE MODULATOR is nearly free once the machinery exists and is a genuinely distinct effect - worth a Hold sub-param, but only after the basic unit works; latency is STFT hop latency in the audio path and BOTH INPUTS MUST BE ANALYSED ON THE SAME FRAME BOUNDARY or the result smears; MODULATOR SILENCE SHOULD MEAN 'NO SHAPING' NOT 'GAIN TO ZERO' - decide explicitly rather than letting the division decide it, and guard the divide; Morph=0 must be a bit-identical bypass of the carrier, which again depends on a transparent STFT round trip, see anneal-resonance-suppressor phase 1 and stft-frontend-atom. PHASES: 1 round-trip transparency (shared with Anneal, or inherited from the shared atom if that lands first); 2 modulator branch and dual analysis on aligned frames; 3 envelope extraction and transfer, Bands and Morph - this is the unit; 4 formant shift; 5 Speed, Mix, optional Hold; 6 hardware - two analyses is roughly twice Anneal's cost, get a number early."

[[item]]
id = "gyre-feedback-matrix"
title = "Gyre: an N-by-N feedback matrix as a playable instrument (no-input-mixer in a unit)"
status = "todo"
stamped = "2026-08-14T01:32:20-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Feasibility spike first - if the control surface cannot make self-oscillation playable rather than merely loud, close the item rather than shipping it; thereafter: it self-oscillates and can be steered without clipping into noise, coupling changes are click-free, and a panic/mute path always recovers silence; A8 CPU measured" }
note = "User request 2026-08-14 from the four-idea batch, and FLAGGED AT PROPOSAL TIME AS THE LEAST CERTAIN OF THE FOUR - it lives or dies on whether the control surface makes the chaos playable rather than just loud. Ledgered without a design note deliberately; the note should be written AFTER the feasibility spike, not before, because the spike may kill it. PACKAGE: spreadsheet (it is an instrument/effect, and spreadsheet is where those live). The poetic name Gyre is therefore allowed under the 2026-08-14 naming direction - but if the feasibility spike lands it in biome or house instead, rename it descriptively. WHAT IT IS: an N-by-N routing matrix where every output can feed back into every input, with saturation and filtering in each path, patchable into self-oscillation - the no-input-mixer instrument as a unit. It is an INSTRUMENT not a processor: you play it by adjusting coupling, and the material is the feedback itself. In the register of Anamnesis and Network rather than of the utility units. WHY IT MIGHT WORK HERE: habitat has the pieces - saturators throughout mods/house/atoms (Spiral with spiralFastSaturate, Console0Channel/Buss), an SoA NEON filter bank pattern (feedback_neon_soa_svf_bank, used by fdn-reverb's design), and Householder/Hadamard matrix machinery already designed in planning/fdn-reverb-design.md; an FDN IS a feedback matrix, so the difference from fdn-reverb is entirely one of control surface and intent, and that overlap should be examined before building - it may be that Gyre is a mode of the FDN rather than a separate unit. THE UI PRECEDENT: Vitrail's 50-mode ModeSelector (mods/spreadsheet/assets/Vitrail.lua, routing organised as 2 halves x 5 families x 5 pairs with discreteJumpStep=5) shows how a large routing space can be made navigable by giving it structure and letting Shift jump between families. A matrix needs the same treatment or it is unusable. THE HARD PROBLEMS, all control-surface rather than DSP: keeping self-oscillation in a musically useful region instead of pinned at clip; making coupling changes click-free when the system is already ringing; giving the user a reliable way back to silence (a panic/mute that always works, since a feedback instrument that cannot be stopped is not an instrument); and displaying the state of the matrix legibly enough to steer. PHASES: 0 FEASIBILITY SPIKE - a fixed 4x4 with hard-coded coupling, no UI, driven offline, purely to answer whether the sound is worth a unit and whether it can be steered; if not, close the item. Everything else waits on that."

[[item]]
id = "facet-macro-controller"
title = "Macro Controller: one normalled macro into eight derived outputs (Cold Mac / Ladik J-011 reference)"
status = "todo"
stamped = "2026-08-14T19:34:43-05:00"
area = "units"
verify = { kind = "manual", ref = "The Survey -> X -> Y cascade normalling works before any output exists: patching X peels it off Survey, patching Y peels it off X, verified with the presence mask; each of eight outputs matches its documented transfer function against a Survey sweep; the integrator resets on gate and clips rather than railing; CPU measured with all eight patched and with only the primary patched; multi-out picker checklist and serialization round-trip; hardware pass" }
note = "User request 2026-08-14: a multi-out macro controller like Ladik joystick math or Mannequins Cold Mac. Design note: planning/facet-macro-controller.md. NAME (user direction 2026-08-14: units outside spreadsheet take descriptive factual names, poetic ones stay in spreadsheet) - Macro Controller, replacing the working title Facet; matches how biome already names units. Package biome with the CV utilities. THE TWO REFERENCES: Ladik J-011 Joystick Math (4 HP) is the simple one - two inputs X and Y, outputs X+Y, -X-Y, X-Y, Y-X, plus positive-only and negative-only rectification of Y; works at audio rate; usable as a standalone inverter or rectifier; a bag of two-input arithmetic and it claims nothing more. MANNEQUINS COLD MAC IS THE ONE WORTH STUDYING, AND ITS DESIGN IDEA IS NOT THE MATHS. Its blocks are ordinary - a crossfader, an analogue max (OR), an analogue min (AND), a fullwave rectifier (SLOPE), a wrap-around wavefolder (CREASE: '+5 if <= 0, -5 if > 0'), a slew-based envelope follower (FOLLOW), an integrator (LOCATION, 'rate of change proportional to the input voltage'), and an AC-coupled summing VCA (MAC = (SURVEY+5)/10 * (LEFT+RIGHT+OR1+AND1+SLOPE+CREASE)). WHAT MAKES IT A MACRO CONTROLLER IS THE NORMALLING - from the whimsicalraps technical map, the summed SURVEY value 'is then normalled into these jacks: LEFT/RIGHT Crossfader Block: FADE Input; OR/AND: OR2 Input (which is normalled to AND2 Input); SLOPE/CREASE: SLOPE Input (which is normalled to CREASE Input)', plus -5V into LEFT, +5V into RIGHT, OR1 into AND1, SLOPE into CREASE, and inserting any cable breaks that normal. So ONE KNOB DRIVES EIGHT OUTPUTS AT ONCE each through a different transfer function, and patching any input peels that block off the macro and makes it an independent utility; the panel graphs are literally the transfer functions with SURVEY on the X axis. THAT is the thing to build - a bag of math functions is the part that is easy and matters least. THE DERIVABILITY QUESTION, ANSWERED HONESTLY, because the multi-out guide is explicit that 'if outputs are independent and could just as well be parallel mono units, don't make them multi-out': the COMBINATORIAL outputs mostly ARE derivable downstream (Fold and Rectify already exist as core units; Offset, Slew Limiter and biome's Integrator exist; only MIN and MAX have no existing unit anywhere), and the STATEFUL outputs are not derivable from each other but ARE derivable from the input given those units. So the justification is NEITHER of those - it is that ALL EIGHT DERIVATIONS SHARE ONE CONTROL SOURCE, and reconstructing that downstream means patching one CV into eight separate units and keeping them in sync, which is the guide's own quadrature-LFO reasoning ('reconstructing exact phase lock requires the same internal state') in a different key. The macro relationship is the product; the maths is the packaging. WRITE THIS DOWN because if the normalling gets dropped during implementation the unit loses its reason to exist and becomes eight utilities in a trenchcoat. SHAPE - INPUTS: Survey (the macro; knob plus CV branch; bipolar), X (the chain input, NORMALLED TO SURVEY when nothing is patched), Y (a mono branch, NORMALLED TO X when nothing is patched). That cascade is Cold Mac's scheme reduced to what the ER-301 can express - a unit has one chain input so the second operand arrives as a branch following Warps.lua:49-53. Presence detection uses the guide's CASCADE MASK (getInputSource(1) ~= nil, pushed to C++ as a parameter, DSP falls through to the neighbour), NOT source rebinding which the guide forbids; same mechanism as sill-window-comparator and a second consumer for it. EIGHT SUB-OUTS, all labels within the 6-char limit: sum (X+Y, PRIMARY, auto-wires on insert), diff (X-Y), max (Cold Mac's OR), min (Cold Mac's AND), abs (|X|, SLOPE), fold (wrap fold, CREASE), slew (slews toward |X|, FOLLOW), intg (integrates X with rate proportional to X, clipped, LOCATION). Eight sits just under the guide's 'reconsider at >=10'. Gate the two stateful outputs and fold on Outlet::isConnected(); leave the four cheap combinatorial ones ungated where the branch would cost as much as the work. CONTROLS: Survey (CV), Y (branch), Time (slew and integrate rate, split into two sub-params), Fold (threshold), Offset, and RESET (gate) for the integrator - THE INTEGRATOR RESET IS NOT OPTIONAL, an integrator with no reset rails and stays there and the unit then looks broken; biome's existing Integrator has one, match it. DEFERRED: MAC itself, the AC-coupled summing VCA across all blocks at gain (SURVEY+5)/10 - it is Cold Mac's namesake and what makes it an audio mixer as well as a CV utility, left out because it would be a ninth output and because sum covers part of it; revisit once the unit exists, and if it goes in it should REPLACE an output rather than extend the count. CAUTIONS: VOLTAGE CONVENTION - Cold Mac's constants are in volts (+-5 V rails, CREASE wrapping by +-5), pin the 301's scaling against the core Offset and Rectify units before transcribing any number, exactly as sill-window-comparator requires. AUDIO RATE IS A FEATURE NOT AN ACCIDENT - Ladik notes J-011 'works in the audio range', and min/max/abs/fold at audio rate are waveshapers (rectification, folding, and a min/max pair behaving like a crude ring modulator); their hard corners WILL alias, but unlike Window Comparator I would NOT add a BLEP mode - these are shaping functions rather than gate edges, the aliasing is part of the character, and the cost is real; document it rather than fixing it. VANILLA - sub-outs 3+ are invisible on stock firmware so six of eight outputs are stolmine-only, and this is the FOURTH stolmine-first unit in two days (diptych-mid-side, sill-window-comparator, assay-audio-listener, this); biome has been vanilla-clean until now and this is no longer drift, it needs a decision. feedback_runtime_branched_dsp_dispatch - the cascade mask and the isConnected gates are block-rate decisions. PHASES: 1 CASCADE NORMALLING FIRST, not last - Survey -> X -> Y fall-through with the presence mask, proven with two dummy outputs; if the normalling is not right the unit has no point, so it must not be the last thing built; 2 the six combinatorial outputs, trivial maths where the real work is the voltage convention and the transfer-function documentation; 3 slew and integrator with Reset and clipping; 4 hardware - multi-out picker checklist, serialization of branch contents and every control, CPU with all eight patched and with only the primary patched."

[[item]]
id = "ochre-character-eq"
title = "Parametric EQ: characterful four-band EQ on a shared parametric-band atom (SSL 611 reference)"
status = "todo"
stamped = "2026-08-14T19:34:43-05:00"
area = "dsp"
verify = { kind = "manual", ref = "The log-symmetric claim actually measured - +-3 dB points at a constant octave interval from centre across gain settings; all gains at zero is a bit-identical bypass; shelves measure 6 dB/octave; Colour switches Q law, gain range and drive together; no zipper noise on a Freq sweep; A8 CPU with four bands active; Channel Strip's EQ section retrofitted onto the same atom" }
note = "User request 2026-08-14: characterful EQ, stated interest in the SSL 611. Design note: planning/ochre-character-eq.md. NAME (user direction 2026-08-14: units outside spreadsheet take descriptive factual names, poetic ones stay in spreadsheet) - Parametric EQ, replacing the working title Ochre; matches how house already names units, and distinguishes it from biome's one-knob Tilt EQ and the firmware's EQ3. WHAT THE 611 IS: the equaliser section of the SL 4000 E console channel strip (the 611E module), reissued in 500 series. Four bands: LF 30-450 Hz shelf switchable to bell; LMF 200 Hz - 2.5 kHz parametric with Q; HMF 600 Hz - 7 kHz parametric with Q; HF 1.5-16 kHz shelf switchable to bell. TWO CIRCUITS, SWITCHABLE, KNOWN BY KNOB COLOUR: BROWN (02) is the original, standard on all E-series consoles before summer 1985, +-15 dB, good-natured - a desk tech quoted in Tape Op's review puts it on drums for 'girth and harmonic structure that sounds great'. BLACK (242) was developed in 1983 for the first SSL installed at AIR Studios in conjunction with George Martin, +-18 dB, more powerful and precise and said to tend toward harshness; the same tech puts it 'on vocals and guitars when you need them to punch through a mix'. ATTRIBUTION WARNING: the 242 is frequently credited to George Massenburg in forum lore, but the sources found here consistently credit GEORGE MARTIN / AIR - do not repeat the Massenburg claim in any user-facing text without better evidence. TWO PUBLISHED BEHAVIOURAL FACTS MATTER MORE THAN THE RANGES: (1) THE MID BANDS ARE LOGARITHMICALLY SYMMETRIC - SSL's own wording is that the two parametric mid sections ensure 'that the +-3 dB up/down points retain the same musical interval from the centre frequency regardless of frequency and amplitude settings', i.e. constant bandwidth IN OCTAVES held ACROSS GAIN, which is NOT the proportional-Q behaviour often attributed to this EQ; getting this right is most of what makes it feel like an SSL rather than a generic parametric. (2) THE SHELVES ARE 6 dB/OCTAVE with a fixed-Q bell as the alternative - gentle first-order-ish shelves, not the steeper shelves most digital EQs default to; cheap to implement and a large part of the sound. WHAT THIS CAN HONESTLY BE: there are no public schematics, so this is a BEHAVIOURAL DESIGN INFORMED BY PUBLISHED SPECIFICATION, not a circuit emulation, and nothing user-facing should claim otherwise - same posture as dross-trash-compressor and gesso-glue-compressor. Faithful because published or measurable: band layout, ranges and shape switching; 6 dB/oct shelves; the log-symmetric Q law; the +-15 vs +-18 dB difference, which is a real behavioural difference not just a number since the Black's extra range changes how hard people push it; and a per-band level-dependent nonlinearity, which is where 'characterful' actually lives. THE CHARACTER, CONCRETELY - three things separate a characterful EQ from a set of biquads and none is expensive: THE Q LAW (log-symmetric constant-octave bandwidth for Brown, a proportional-Q law for Black where Q tightens as gain increases - the best candidate for what the colour switch should DO in our version, and a coefficient decision not new DSP); BAND INTERACTION (analogue EQ bands are not independent, they load each other so the composite curve is not the sum of the individual curves, whereas cascaded digital biquads are independent BY CONSTRUCTION which is exactly why they sound 'clean' in the pejorative sense - deliberately introducing interaction via a shared feedback path or band coefficients that read neighbouring band gains is the least obvious and most valuable move available here); and LEVEL-DEPENDENT NONLINEARITY, for which Airwindows BiquadStack is the ready-made answer since it was written for precisely this purpose - Chris's own note says he built it 'when I started really trying to work out what was so special about SSL channel strips, so I could use similar parametric bands in ConsoleX' - a Butterworth Q ladder (1.93185165 / 0.70710678 / 0.51763809) used as BANDPASSES rather than for steep rolloff, giving 'not a narrowing spike as a normal resonant filter would be, instead a little region of intensity' with 'moats' at the edges from phase interference, and a nonlinearity of dis = fabs(a0*(1.0 + out*nonlin)) clamped to 1.0 (b0 modulated by instantaneous level, saturating by CLAMPING) with NO TANH AND NO TRANSCENDENTALS IN THE SAMPLE LOOP AT ALL. MIT; the single-band kernel is the file to lift. BUILD IT AS AN ATOM FIRST: habitat has NO EQ ATOM AT ALL, only biome's one-knob Tilt EQ and the firmware's EQ3, while strata-channel-strip needs an EQ section and currently names SmoothEQ3 or BiquadStack as candidates. So build ONE PARAMETRIC-BAND ATOM and let both consume it - Parametric EQ is the standalone four-band unit and Channel Strip's EQ section is the same atom instantiated three or four times. That is the house-atom-library pattern (components by default, with a composition that gives them standalone value) applied properly rather than duplicating an EQ. IF ONLY ONE GETS BUILT, BUILD THE ATOM AND OCHRE; Channel Strip is a much larger job and would inherit the EQ for free. CONTROLS: four bands each with Freq, Gain and (mids) Q, plus Colour (option: Brown/Black - Q law, gain range, drive character), LF shape and HF shape (option: Shelf/Bell each), Drive (nonlinearity amount, shared), Mix (linear). That is a lot of controls and it is the same problem Parfait solved with 34 controls across 8 views - use the same structure, four top-level band controls with Enter opening each band's expansion, and IF strata-channel-strip's SectionGate control lands first use it here too, since a band IS a section and shift-to-bypass per band is exactly right for an EQ. CAUTIONS: COEFFICIENTS IN DOUBLE, RECURSION IN FLOAT - the aw-batch2-ports finding and the Channel Strip note both land here, float is safe except for the lowest-frequency biquads and LF reaching 30 Hz is exactly that case. Gain=0 on every band must be a BIT-IDENTICAL BYPASS - subtractive EQ designs get this for free, check rather than assume. SAMPLE RATE - any constant lifted from Airwindows is 44.1 kHz-calibrated, and see the 48 kHz findings in strata-channel-strip where Channel9's ultrasonic biquads bypass entirely at 48 kHz for two of five models; that class of bug is easy to inherit. DO NOT CLAIM EMULATION - describe Parametric EQ as SSL-informed, name the reference, and let the Colour labels be Brown and Black rather than borrowed model numbers. feedback_runtime_branched_dsp_dispatch for Colour and the two shape options, coefficient decisions at block rate. ZIPPER NOISE on Freq sweeps is the classic EQ failure - smooth COEFFICIENTS not parameters, and check on a sweep before shipping. OPEN QUESTION - WHICH PACKAGE: house is the recommendation since the AW atom bin lives there, BiquadStack would be ported there, and strata-channel-strip (the other consumer) is a house unit, and keeping an atom with its consumers in one package avoids the cross-package sharing problem already flagged in stft-frontend-atom. THE TENSION is that house-suppress-customs-optimize-ports directs house to keep and optimise the PORTS while suppressing the house ORIGINALS; Parametric EQ is BiquadStack-derived rather than an original in the RotCoat sense so this reads as within the directive, but it is a judgement call worth confirming rather than assuming. The alternative is spreadsheet next to Impasto, Parfait and Gesso, at the cost of splitting the atom from Channel Strip. PHASES: 1 the parametric band atom - one band with Freq, Gain, Q, both Q laws and the level-dependent nonlinearity, verified against a swept measurement with the LOG-SYMMETRIC CLAIM ACTUALLY CHECKED (+-3 dB points at a constant octave interval across gain settings); 2 Parametric EQ four-band - band layout, ranges, shelf/bell switching, 6 dB/oct shelves, null test at all gains zero; 3 Colour, switching Q law, gain range and drive character together; 4 BAND INTERACTION, the experimental part - A/B against independent cascaded bands and keep it only if it earns itself; 5 hardware A8 CPU with all four bands active, zipper check on sweeps, serialization of every option; 6 retrofit Channel Strip's EQ section onto the atom. PHASES 1-3 DONE 2026-08-20 (parametric-band-atom + parametric-eq-unit): band atom, four-band unit, and Colour all built and measured in house 0.1.1.1. REMAINING: phase 4 band interaction (the experimental part - A/B against independent cascaded bands and keep only if it earns itself) and phase 5 hardware CPU + zipper check on freq sweeps."

[[item]]
id = "poly-voice-allocator-atom"
title = "Polyphonic voice-allocation atom: the layer habitat has none of, wanted by three ledgered items"
status = "todo"
stamped = "2026-08-14T19:34:43-05:00"
area = "dsp"
verify = { kind = "manual", ref = "N voices allocate, steal and release correctly against an overlapping gate sequence, tested with a sine source before any real engine exists; stealing is inaudible (oldest-released first, then quietest, always faded, never cut); release tails outlive subsequent note onsets; per-voice state is heap-resident with the audio stack budget intact per tools/check-audio-stack.sh; CPU measured at each voice count" }
note = "Identified 2026-08-14 while scoping vulgate-gm-poly-voice. STRUCTURAL ITEM, NOT A UNIT - the same pattern as stft-frontend-atom and ochre-character-eq's band atom. A CODE SURVEY OF HABITAT AND THE FIRMWARE FOUND NO POLYPHONY ANYWHERE: no voice allocator, no voice manager, no note-on/note-off routing, no stealing, no voice pool, in EITHER tree. Also no multisample support (no keymaps, no velocity layers, no SF2 or DLS handling; sample attachment is strictly one sample per unit) and NO CARD STREAMING (every player loads the whole file into RAM via SampleLoader, which processes one load at a time; SampleFifo exists but is for RECORDING not playback streaming). The closest existing thing is Breccia, which runs up to 7 concurrent layers - but they are harmonic offsets from a SINGLE read position over one buffer (kMaxLayers=7, kLayerOffset[], kLayerRate[] at mods/spreadsheet/Breccia.h:168-174), not independent voices. THREE LEDGERED ITEMS WANT THIS: vulgate-gm-poly-voice, polyphonic-sample-playback ('the collection has no polyphonic sample playback at all: synth-style poly AND drum-machine per-voice sample loader'), and units-poly-sample-player (N-voice manual-grain sample playback with voice management). Building it three times is what this item prevents. WHERE POLYPHONY COMES FROM ON THIS HARDWARE, which is not obvious: the ER-301 has NO MIDI INPUT AT ALL, and a unit gets one chain input plus whatever branches it declares, so with a single pitch CV and a single gate the polyphony has to come from somewhere - (1) RELEASE TAILS, the least glamorous and most important source, since a monophonic gate sequence into a piano program still needs eight voices because each note's release outlives the next note's onset; (2) CHORD GENERATION from one CV (key, scale, shape, inversion); (3) UNISON with a detune spread; (4) MULTIPLE GATE/PITCH BRANCH PAIRS for real independent polyphony, expensive in UI terms and a later phase. Sources 1-3 work from a single CV and gate and cover most of the musical value. DESIGN REQUIREMENTS: voice stealing must be AUDIBLE-SAFE - steal the oldest RELEASED voice first, then the quietest, and always fade rather than cut, because a clicking stealer ruins any consumer; CPU scales with voice count so the polyphony control IS the CPU control and that should be legible to the user rather than hidden; the audio thread stack is 2048 bytes FOR THE ENTIRE CHAIN (CONTEXT.md) so per-voice state goes in an Internal struct on the heap, never on the stack, and tools/check-audio-stack.sh gates it. PHASE 1 IS TESTABLE WITH A SINE - build and prove allocation, stealing and release-tail behaviour before any real engine exists. NOT parked with vulgate-gm-poly-voice (2026-08-20): vulgate was only ONE of its consumers. units-poly-sample-player still wants it, so the atom keeps standing on its own merits."

[[item]]
id = "vulgate-gm-poly-voice"
title = "Vulgate: polyphonic General MIDI voice (Expert Sleepers General CV reference)"
status = "todo"
stamped = "2026-08-14T19:34:43-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Phase 0 fork decided by an actual RAM and load-time measurement on hardware, not by assumption; chord and unison produce correct note sets from one pitch CV with the tabulated detune spread matching the manual; the 16 quantiser scales match the manual's semitone sets exactly; envelope and filter scaling is neutral at mid-position per the 64-is-as-programmed convention; sample-set licence recorded in the package README and release note; CPU measured at each voice count; a multi-part arrangement plays without stealing artefacts" }
rev = 2
note = "USER DECISION 2026-08-14: SAMPLE-BASED (Route A) is what is wanted - 'we want a sample based version, may not be possible.' Route B (synthesised) is now a FALLBACK ONLY, taken solely if the phase-0 hardware measurement rules Route A out, and 'not possible' is an acceptable outcome to report rather than something to quietly substitute around. Phase 0 is unchanged and still runs first: measure RAM and load time on hardware with a trimmed soundfont. || User request 2026-08-14: 'a general midi voice, preferably poly', referencing EXPERT SLEEPERS GENERAL CV. Design note: planning/vulgate-gm-poly-voice.md. Named Vulgate - the common, standard, universally-available version of the text, which is exactly what General MIDI is, cheesiness included; sits with Fabula, Sujet, Anamnesis and Palimpsest. Package spreadsheet with the other voices (Ngoma, Visadhara, JF). BLOCKED IN PRACTICE ON poly-voice-allocator-atom - do not start before that exists. THE REFERENCE (General CV user manual v1.4, read directly): 12 HP, 'a combination of a powerful General MIDI synthesizer, a multi-channel CV-to-MIDI converter, and a host processor capable of generating huge amounts of MIDI data'; 128 GM programs, five drum kits, 16 voices of polyphony, stereo reverb and chorus, four-band EQ. THE RELEVANT MODE IS CV TO MIDI, which 'essentially takes a pitch CV and a gate and generates a MIDI note to send to the synthesizer engine', and its 18-parameter list is the spec worth copying: Program 0-127 ('a new sound choice only takes effect when a new note starts'), Unison Voices 1-8, Unison Detune 0-16, Reverb 0-127, Chorus 0-127, Manual Gate 0-1 ('useful for creating drones'), Sustain 0-1 (notes hold past gate-low), Quantizer Enable/Scale/Key (16 scales), Mod Wheel 0-127, Transpose +-36 semitones (applied BEFORE quantisation), Attack/Decay/Release Scale 0-127 with 64 = as programmed, Cutoff/Resonance Scale 0-127 with 64 = as programmed, Velocity 1-127. TWO DETAILS WORTH KEEPING: the UNISON DETUNE SPREAD IS TABULATED not computed - 2 voices are -1/2d,+1/2d; 3 are 0,-d,+d; 4 are -1/2d,+1/2d,-1 1/2d,+1 1/2d; and so on to 8, with odd counts centring a voice and even counts straddling - cheap to copy exactly. And PITCH IS SAMPLED ONLY AT GATE-HIGH in CV To MIDI mode, whereas VCO MODE differs precisely: 'the Pitch CV controls the sound's pitch continuously, not just when a note is triggered' (via pitch bends), changing Program switches immediately rather than at the next note, and there is no Sustain - a clean two-mode split worth reproducing. The 16 quantiser scales are listed explicitly in the manual with their semitone sets (Chromatic, Major, Minor, Triad, Minor Triad, Root+Fifth, Triad+6, Minor Triad+6, Triad+7, Minor Triad+7, 5+6, 5+7, Pentatonic, Pentatonic Minor, Natural Minor, Harmonic Minor) - TRANSCRIBE RATHER THAN INVENT. THE FORK, A PHASE-0 DECISION THAT CHANGES THE ENTIRE PROJECT and must be made deliberately rather than drifted into: ROUTE A, SAMPLED (a real ROMpler) - preprocess a freely-licensed soundfont offline into a habitat-native format via a NEW TOOL, load into RAM, play back multisampled with keymaps; faithful to what GM actually sounds like which is most of the appeal; requires a new offline tool, a keymap/multisample format, a licence-clean sound set (GeneralUser GS, MuseScore_General and FluidR3 are the usual free candidates - CHECK EACH LICENCE PROPERLY, DO NOT ASSUME) and a RAM budget that has NEVER BEEN MEASURED on this hardware; the no-streaming constraint is the real risk and a trimmed mono set at reduced sample rate is the only plausible shape. ROUTE B, SYNTHESISED - a small parametric engine plus a 128-entry program table setting oscillator type, filter, envelope and sends per program; vastly cheaper, no licensing, no RAM question, no new tooling, but it will NOT sound like GM, it will sound like a synth pretending, which is either charming or pointless depending on intent. RECOMMENDATION: MEASURE FIRST THEN CHOOSE - phase 0 is a RAM and load-time measurement with a trimmed soundfont on actual hardware; if a usable set fits take Route A, because the whole point of GM is the specific familiar slightly cheap sound of it and Route B cannot deliver that; if it does not fit, Route B is a real fallback rather than a consolation, and THE VOICE-ALLOCATION LAYER IS IDENTICAL EITHER WAY. CONTROLS - front: Program, Voices (polyphony count), Chord (shape), Detune, Mix; the pitch CV is the chain input and Gate is a branch. Expansion views following Parfait's structure: Program -> Transpose, Velocity, Mod Wheel; Voices -> unison count, stealing mode, Sustain, Manual Gate; Chord -> Key, Scale, Inversion, quantiser enable; Envelope -> Attack/Decay/Release scale and Cutoff/Resonance scale, all CENTRED so mid-position is 'as programmed' per the manual's 64 convention. REVERB AND CHORUS SENDS ARE DELIBERATELY DROPPED - the ER-301 has actual reverbs and a send to an internal one would be worse than routing to Fabula. CAUTIONS: SCOPE - this is the largest thing proposed in this batch by a wide margin and it has a hard prerequisite that does not exist yet. SAMPLE LICENSING is a genuine gate not a formality; whatever set is chosen, its licence goes in the package README and the release note, same discipline as readme-airwindows-attribution. 'GENERAL MIDI' IS A SPECIFICATION published by the MIDI Association - program numbering and the drum map can be implemented freely; what cannot be freely lifted is any PARTICULAR VENDOR'S sound set, so name the soundfont used. Voice stealing must be audible-safe (see poly-voice-allocator-atom). CPU scales with voice count so the polyphony control is also the CPU control - make that legible rather than hiding it. PHASES: 0 decide the fork by measurement, nothing else starts first; 1 voice-allocation atom (see poly-voice-allocator-atom); 2 voice engine per the phase-0 decision; 3 chord and unison from one CV with the tabulated detune spread and the 16 transcribed scales; 4 envelope and filter scaling centred at 'as programmed'; 5 VCO mode as the continuous-pitch variant; 6 hardware - CPU at each voice count, serialization, and a listening pass on the thing GM is actually for, playing a multi-part arrangement. PARKED 2026-08-20 (user): skipped for now. Nothing is blocked on it."
