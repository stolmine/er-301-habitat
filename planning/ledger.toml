# Fragment: port the Open303 acid-bassline emulation as an ER-301 voice.
# Append via: scripts/dev ledger-append <this file>

[[item]]
id = "open303-port"
title = "Port Open303 (MIT-licensed acid bassline emulation) as an ER-301 mono voice unit"
attested = """2026-08-10 PHASE 1+2 LANDED, emu-verified; hardware CPU% and listening pass owed.
Ships as MORDANT in biome 2.2.3.1 (user call: biome, not catchall->spreadsheet). Vendored engine
under mods/biome/open303/, attribution preserved, LICENSE-Open303.txt carried.
FIDELITY, A/B vs the pristine upstream engine built from ~/repos/Open303: raw correlation reads low
purely because the halfband cascade adds a fixed group delay the elliptic IIR did not (22 output
samples at 4x, 14 at 2x). Aligned for that lag, correlation is 0.9997 (4x) and 0.9995 (2x); on
spectral bins within 60 dB of peak the median difference is -0.32 dB; the first 8 harmonics match
within 0.1 dB.
FOOTPRINT, the point of the exercise: sizeof(MipMappedWaveTable) 213,472 -> 33,296 B and
sizeof(Open303) 431,800 -> 67,952 B. The voice now sits in a quarter of the 256 KB L2 instead of
overflowing it by 175 KB.
CPU (x86, ns/sample): upstream 171.5, port 4x 194.2, port 2x 120.4. Stated honestly - the 4x tier is
SLOWER than upstream on x86, because a 63-tap halfband cascade is ~51 MACs against the elliptic's
~12, and x86 has fast doubles and enough cache to hide 385 KB of tables. The shipping am335x tier is
2x, faster than upstream even on the arch that flatters upstream most.
THREE PLAN ITEMS DIED ON CONTACT WITH THE SOURCE, all struck through in place in the doc:
 - B3 (derive square from saw) WITHDRAWN: the 303 square is -tanh(70*saw + 4.37) circular-shifted,
   band-limited by FFT AFTER the nonlinearity, not a saw-minus-saw difference. Not reachable from
   the saw's levels at runtime. Costs nothing - B2 alone clears L2.
 - C's approx-coeffs item is a NO-OP: setCutoff already calls calculateCoefficientsApprox4.
 - the elliptic decimator is RETIRED ON BOTH TIERS, not just at 2x: a 12th-order Direct Form II IIR
   with a06=308 against b00=1.4e-4 is ill-conditioned in single precision, and keeping it in double
   would put a double IIR on the per-oversampled-sample path. Replaced by O3Halfband, a 63-tap
   Kaiser(9.0) polyphase halfband (DC gain 1.000000, -103 dB stopband, -68.5 dB worst alias-band
   rejection), one stage at 2x and two cascaded at 4x.
TWO BUGS FOUND AND FIXED IN MY OWN PORT WORK, both recorded because both were silent:
 - mPrevOsc/mOsBuf, the new out-of-loop oscillator state, were never initialized. The resonant
   ladder took a garbage interpolation step and diverged from sample 0 with sign-alternating growth.
   It looked fine in the first smoke test only because that heap happened to hold benign values.
 - the am335x oversampling tier never engaged: o3_config.h tested `defined(am335x)`, and nothing in
   this build defines that macro, so hardware silently took the heavier 4x path. The tier is now set
   explicitly in mod.mk (-DO3_OVERSAMPLING=2 under ARCH=am335x) and verified on the compile line.
VERIFY: both arches build clean; all three lints clean (libbiome.so 0 safe / 0 suspect NEON hints,
no out-of-line virtuals, Mordant::process() frame 52 B against a 512 B budget); emu insert smoke
test er-301/tests/emu/91-mordant-insert-smoke.test passes - install, register, insert, 360 frames of
audio+draw, clean removal.
OWED: am335x hardware CPU% + insert; the Phase 3 listening pass against reference recordings; the
Phase 4 Devil Fish aux controls. NOTE the wavetables are still generated at construction with
double sin/cos via the FFT - feedback_package_trig_lut is confirmed for sinf/cosf only, so the
double path is probably fine, but it is unverified on hardware and a wrong table would be silent
in the emu.

2026-08-11 DEVICE DEFECTS FIXED + HOT-SPOT PASS (biome 2.2.3.3).
(1) EXTREMELY QUIET: Level mapped 0..1 -> -60..0 dB, so the default bias 0.5 sat at -30 dB (measured
peak 0.033). User confirmed independently that Level 1.0 sounded normal. Level is now a linear
0..1 output gain (peak 0.525 at default). Note the voice exceeds full scale with resonance up -
peak 1.055 at Level 0.5 / Resonance 0.7 - that is the instrument being loud, not a bug.
(2) SLIDE KILLED THE NOTE: a rising gate with Slide high called slideToNote(), which never touches
the amp envelope because upstream only slid mid-legato. With a modular gate falling between steps
the envelope had already released -> silence (measured peak 0.0000). Slide now selects glide vs jump
and a note sounds on every rising edge; triggerNote() took a `glide` arg that skips the slew-limiter
force-set. Measured glide 55->110 Hz: 143/158/172/186/196/206/212/215 Hz monotonic.
HOT SPOTS, four applied: setNoteNumber's double exp() ran EVERY sample (now change-guarded); the
live TB_303 coefficient branch used bare double literals (31 f64 ops/sample incl vdiv.f64, now
f-suffixed); a 12th- and an 8th-order polynomial were computed then DISCARDED per sample in TB_303
mode (now early-return); nine double members on the per-sample path retyped to o3Float. Plus a
latent UB fixed: O3Halfband::mPos was a signed int advanced 2x per output and never reset,
overflowing after ~2 h - the anamnesis field::hash01 UB class. Now unsigned.
VERIFIED: A/B vs pre-opt corr 0.999998, -53 dBr; x86 2x tier 120.4 -> 91.6 ns/sample (24% faster),
4x 194.2 -> 155.9 (now beats upstream's 171.5). Both arches clean, three lints clean, emu smoke ok.
INVESTIGATED, NOT A PROBLEM: the approx4 "valid to pi/4" warning belongs to the polynomials that are
dead in TB_303 mode; a Goertzel probe of the live fit puts a commanded 20 kHz at 19,930 Hz (6 cents)
with no instability at the 2x tier. NEON NO-GO now evidenced, not estimated: the budget is serial
feedback recursions with a one-sample dependency; the only SIMD-able kernel is under 10% of cost.
STILL OWED: am335x hardware CPU% + insert, and the Phase 3 listening pass.

Closed 2026-08-20. Shipped as Mordant in biome 2.2.3.3; engine vendored at mods/biome/open303 as real .cpp objects so the DSP is not compiled inside the SWIG TU at -Os. Hardware-tested by the user during development, which produced two fixes: Level was mapped to -60..0 dB and became linear gain, and Slide killed the note until triggerNote gained a glide argument. NOT DONE from the original verify: a rigorous A/B against an Open303 reference render, and a CPU number. Refile if either is still wanted."""
status = "done"

stamped = "2026-08-20T15:56:12-05:00"
area = "dsp"
verify = { kind = "manual", ref = "emu audition A/B vs an Open303 reference render; bench-verify on am335x for CPU load + NEON/AAPCS stability" }
note = "Plan of record: planning/open303-port.md (supersedes open303-port-scoping.md; part of the port-mit-direct backlog). MIT confirmed (License.txt, (c) 2009 Robin Schmidt; attribution kept). Voice = rosic::Open303 with the internal AcidSequencer stripped (run it OFF), driven by ER-301 trig / V-oct / accent / slide inlets. Target: am335x-shippable spreadsheet flagship alongside Ngoma; prototype in catchall, promote after listening. Engine audit: the port is NOT free - ~385KB double wavetables (8 mip-gathers/sample, blows 256KB L2), per-sample pow2 on cutoff, 4x oversampling. Optimization plan (see doc): float + pull the oscillator OUT of the 4x loop + shrinking mip pyramid + derive square from one saw table (-> ~30KB tables) + fast exp2 + approx filter coeffs + 2x(am335x)/4x(CM4) tiers. User-facing name stays generic (no Roland/303). REVISED 2026-08-10 (user): ships in BIOME, not catchall->spreadsheet; Phases 1+2 merged since the am335x target was chosen up front. Two plan items died on source verification - B3 (derive square from saw) WITHDRAWN, the 303 square is a tanh-shaped saw band-limited after the nonlinearity, not a saw difference; and C's approx-coeffs item is a NO-OP, setCutoff already calls calculateCoefficientsApprox4. Target still holds: B2 (shrinking mip pyramid) alone takes the tables 385KB -> ~33KB."

# Fragment: anamnesis viz optimization. Append via scripts/dev ledger-append.

[[item]]
id = "anamnesis-viz-opt"
title = "Anamnesis viz: shared per-frame field cache + bounded metaball build (CM4/am335x perf)"
status = "todo"
stamped = "2026-08-13T23:51:41-05:00"
area = "ui"
attested = """2026-08-07 OPTIMIZED (anamnesis 0.2.0.86), hardware CPU% owed. Anamnesis inserted for
the first time after [hab:anamnesis-insert-crash] and immediately pinned the CPU.
THE HEADLINE WAS A BUILD-CONFIG BUG, not an algorithm one, and it is worth remembering: anamnesis
shipped NO .cpp files, so every line of its DSP compiled inside the SWIG wrapper TU at CFLAGS.swig =
CFLAGS.size = -Os, with NO -ffast-math - while every other package's DSP lives in .cpp files built at
CFLAGS.speed = -O3 -ftree-vectorize -ffast-math. Verified directly in mod.mk. A header-only unit
silently opts its own DSP out of the speed profile.
FIX: process()/spawnDrop()/buildFieldFrame() and the draw BODY moved to a new Anamnesis.cpp at the
speed profile (the DrumVoice/Pecto/ConstantRandom pattern - out-of-line process() on an od::Object is
established and safe). CRITICALLY the graphic's virtual draw() STAYS INLINE as a one-liner delegating
to a non-virtual drawImpl(), so the od::Graphic key-function rule is not tripped
([[feedback_no_out_of_line_virtuals]]); check-graphic-virtual-defs.sh confirms.
MEASURED FIRST, per doctrine: am335x disassembly + an LD_PRELOAD libm counter showed ~21.5 sinf calls
PER SAMPLE (12 tap LFOs + 8 FDN LFOs + spiralSat) plus 2 floorf. Viz: buildFieldFrame ~26% and the
per-ply fill lambda ~40% of the offline profile, at 119M noise::sample calls - nearly all of it
per-cell 3-octave fbm computed even where the field is zero.
CHANGES: LFO sines to quadrant-folded poly with the phase accumulators kept BIT-IDENTICAL; crusher
floorf to an exact branch-lite floor (0 mismatches over 8M probes); viz bump-splat with a 4.5-sigma
cutoff and fbm evaluated only where bumps != 0 (algebraically exact, f = bumps*(1+g*nz)); zero-cell
skip in the fill loop.
A ROTATOR RECURRENCE WAS TRIED AND REJECTED - it was MORE accurate than the shipped float phase
accumulator, so trajectories drifted (-23 dB A/B). Faithful beat correct, which is the right call for
a character unit.
TWO REAL BUGS FOUND EN ROUTE: (1) isfinitef used the `v == v` idiom, which -ffast-math COMPILES AWAY -
moving to the speed profile would have silently deleted the NaN firewall; now bit-based. (2) hash01
had signed-overflow UB that gcc -O3 provably exploited. Also added -fno-tree-vectorize on linux,
which fixed a real _ZGVbN4v_expf dlopen failure.
CHARACTER PRESERVED, proven not asserted: audio A/B over 4 setting sets x 30 s at matched flags gives
correlation 1.000000000, diff floor -84..-96 dBr, 88% of samples bit-identical. Viz A/B over 1072
worst-case frames (Density=1, Diffusion=1) changes 20 pixels of 17.5M, max delta 2 of 15 grey levels.
GAINS (x86 proxy): per-sample libm calls 5.16M -> 0.12M per 5 s; field build 849 -> 112 us (7.6x);
6-ply draw 3342 -> 864 us (3.9x). The x86 proxy UNDERVALUES the DSP win - glibc sinf is nearly free
there, newlib on Cortex-A8 costs ~100+ cycles/call at ~1M calls/s.
Both arches, all three lints clean. OWED: hardware CPU% before/after, and at 96 kHz where it doubles.
NOT DONE: NEON 3-pass gather on the 12 taps + 8 FDN reads (the Pecto pattern) - the next lever if
hardware still shows heat, but doctrine says measure on device first.
ROUND TWO 2026-08-07 (anamnesis 0.2.0.87). Hardware after round one: the machine went from
COMPLETELY UNRESPONSIVE to just over 100% CPU with the animation running - real, not yet usable.
That device reading satisfied the measure-before-NEON doctrine, so NEON was authorized.
THE MEASUREMENT THAT MATTERED: a libm call counter over 10 s worst-case (Density=1, Diffusion=1)
showed 62.4M expf + 3.3M sinf, overwhelmingly in the DRAW PATH (band rippleEval crest trains at
~7k evals/frame x ~6 expf each, plus flow at 3.5k sinf/frame) rather than the audio path. After:
5.8M expf + 1.6M sinf, and the draw path is now libm-FREE (objdump-confirmed; the only remaining
libm sites in drawImpl/buildFieldFrame are the one-time Perlin bake cold path). newlib transcendentals
cost ~100+ cycles each on A8, which is why this is the device-transferable number.
1. OFFSCREEN VIZ GATE, the item I pointed the agent at ([[viz-offscreen-gate-all]]): Anamnesis had
   NONE, so the field build and sim ran every frame even with the ply off screen. Fabula vizPing
   heartbeat pattern (256 blocks). Audio never reads sim state, so zero audio effect BY CONSTRUCTION,
   verified with bit-identical dumps. The real prize is that it makes the DEVICE the instrument:
   on-screen vs navigated-away CPU% now gives the true DSP/viz split on hardware, which no x86 proxy
   can provide. Gated runs measure ZERO libm.
2. Draw-path fast kernels (fastSin/fastExpNeg) via TEMPLATED TWINS so the exact and fast variants
   share one formula source - audio-thread physics keeps exact libm, draw uses fast. floorf -> bit-
   exact int-floor.
3. NEON 3-pass tap+FDN gather (Pecto pattern). First build emitted 2 quad [sp :64] spills - the
   documented AlembicVoice trap - fixed by constructing vdupq constants in-loop. Verified 0 suspect
   hints per-.o AND across the whole .so, which is the scan that catches spills across calls.
4. LATENT OOB FIXED, present in SHIPPED code: [[feedback_multitap_idx_wrap_ulp]] - rp + len can round
   to exactly len, giving a one-past-buffer read. Guarded in all paths.
CHARACTER: audio is bit-identical to the round-one validated output for 5.8 s, then diverges - and
the divergence IS the OOB fix recirculating, not an algorithm change. Sparse diffs at -68..-93 dBr,
corr 0.9999999+, clock case zero diffs over 30 s. Viz: 99.89% of pixels identical over 1072
worst-case frames, 98% of changes a single grey step.
Both arches, all lints clean (neon 0/0 whole-.so, audio-stack clean, graphic-virtuals clean).
OWED: on-screen vs off-screen hardware CPU% - the gate now gives that directly.
REMAINING BIGGEST COST: the exact bubble-physics libm on the audio thread (~0.5-8% depending on
Density). Deliberately left exact. The fast kernels sit behind a one-line template switch, but
flipping it changes chaotic trajectories and needs the user's explicit sign-off - not a call to make
silently on a character unit.
ROUND THREE 2026-08-07 (anamnesis 0.2.0.88) - THE STRUCTURAL FIX. Device split from round two made
the target unambiguous: offscreen 30% mono (the DSP, accepted by the user), on-screen still at
encoder-capture levels, so the viz was carrying ~70%+ alone. Per
[[feedback_viz_encoder_capture_architectural]] that is a draw-path STRUCTURE problem, and two rounds
of making the per-ply work cheaper had taken it from unusable to smoother-but-unusable. So the
structure went.
THE CHANGE: the 6 plies no longer rasterize independently. buildStripRaster() composites the whole
258x64 pond ONCE per UI frame into a member byte plane plus a written-pixel bitmask (18576 bytes,
CLASS MEMBER per the stack rule - verified at atoms/Anamnesis.h:552, not a local); each ply's
drawImpl is then a masked blit of its window, 181 instructions on am335x. Frame detection needs no
framework hook: a draw whose ply index <= the previous one starts a new frame, which holds for any
visible subset including a single scrolled-to ply.
THE INSIGHT THAT MATTERED, and it is one the x86 bench structurally could NOT surface because the
bench stub's framebuffer was never virtual: every od::FrameBuffer call is a VIRTUAL DISPATCH in the
firmware. Compositing on plain bytes removes every readPixel virtual call outright and drops pixel
writes to one per UNIQUE painted pixel - the old path re-wrote overlaps and paid a readPixel besides.
Hot raster loops are call-free in the objdump.
Dedupe the per-ply structure had been hiding: one z-sort, one drop cache, one band control grid (was
~19% duplicated), one marching-squares walk (was 6 overlapping windows). Two volume cuts the strip
form made natural: per-drop inner-radius skip (a mature ring is a thin annulus; evals down 39% worst
case) and exact per-cell fill classification.
Bonus correctness: the strip is now sim-coherent per frame. The old per-ply draws could see the audio
thread mutate drops/bubbles mid-frame, which could tear at seams. Now impossible.
SAME PICTURE: 14 pixels of 17.5M changed vs round two, 13 of them by one grey step, 10 of 1072
worst-case frames affected at <=2 px - and that delta is the bounded inner-skip; the structural port
itself is pixel-exact. Audio bit-identical (the draw path never touches it).
Both arches, all three lints clean including the whole-.so NEON scan; draw() still inline delegating
to drawImpl so the key-function rule holds; buildStripRaster is non-virtual out-of-line.
AGENT'S PROJECTION, unverified on hardware: viz ~15-30% of the core, total ~45-60% with the accepted
30% DSP, which should clear capture. Its judgement on the wider question I asked - a 6-ply all-over
viz is NOT fundamentally over budget; it is now literally one 256-wide 4-bit scene per frame, and the
floor is the framework's per-pixel virtual interface.
REMAINING LEVERS IF HARDWARE STILL CAPTURES, in order: halve the strip rebuild rate (~27fps - a
RICHNESS change, needs user sign-off), single-pass multi-threshold marching squares (~0.5%, measured
marginal), and direct MainFrameBuffer plane writes bypassing the virtual API (layout-coupled to
firmware source, documented as a last resort).
OWED: hardware on-screen CPU%.
ROUND FOUR 2026-08-07 (anamnesis 0.2.0.89) - TIME SLICING. Hardware after round three: viz runs at
almost full framerate, but encoder capture PERSISTS. The user pointed at the Perlin screensaver as
the place this was solved architecturally before, which was the right instinct - the answer was
already written down in [[feedback_viz_encoder_capture_architectural]] and I had not applied its
third move.
THE KEY LINE: "draw and encoder dispatch share the same thread. A single long draw() call blocks
input events until it returns... If one frame's draw takes multiple frames' worth of time, encoders
queue and feel captured, REGARDLESS OF TOTAL MHz CONSUMED."
That is exactly the state round three left us in, and round three arguably made this axis WORSE even
while cutting total cycles: consolidating six per-ply rasterizations into one strip build meant the
FIRST ply's draw did 100% of the work synchronously and the other five were near-free blits. Total
cycles down, worst-case single-draw duration not down. Smooth framerate, captured encoder - the exact
signature the memory describes.
FIX (memory's move 3, time slicing): buildStripRaster now rebuilds only 1/kStripSlices (=4) of the
columns per frame. The raster is a persistent member, so un-rebuilt columns keep last frame's pixels
until their slice comes up. Implementation is small because the column-major layout and the single
srPix choke point made it cheap: StripR carries the active [c0,c1); srPix rejects out-of-slice
columns; the two big column loops (streamlines, metaball fill) are clamped so the WORK is skipped
rather than just the writes; and the memsets are slice-scoped, which is the load-bearing detail - a
full clear would wipe the persisted columns every frame.
Verified: slice width 65, all 258 columns covered in exactly 4 frames with no gap; both arches; all
three lints clean.
THE DELETION SYMPTOM the user also reported ("deletion is unreliable, no hang, seems to compete for
resources") is very likely the SAME root cause and should be re-tested with this: unit deletion runs
on the app/UI thread, and a draw path that monopolises that thread starves it. If deletion becomes
reliable without any deletion-specific change, that confirms it.
OWED: hardware - encoder feel, whether the 4-frame stagger is visible as a shear/wipe across the
pond (Colmatage accepts exactly this tradeoff), and whether deletion is now reliable. kStripSlices is
one constant if 4 is the wrong number in either direction.
ROUND FIVE 2026-08-07 (anamnesis 0.2.0.90) - THE DELETE CRASH, and a rebuild storm.
DELETE CRASH ROOT-CAUSED from /mnt/crash.log report 21: Kind data-abort, Thread **busy**,
"*** STACK busy BLOWN ***", busy 4096/4096 (100%) canary=BLOWN. Heap fine (19 KB of 20 MB).
The frames: buildStripRaster 1804 bytes CALLS ensureFieldFrame -> buildFieldFrame 2484 bytes =
**4288 bytes of chain on a 4096-byte stack**.
THE RULE THIS TEACHES, and it was not written down anywhere: a redraw can run on the `busy` task
while the Busy spinner is up during insert/delete. So DRAW-PATH frames must fit the BUSY stack
(4096), not the app stack (32768). On the app thread the same chain was comfortable (42% of 32768);
on the busy thread it blew instantly. That is why the crash was specific to deletion.
FIX: every large draw-path local moved to class members (the Pecto pointer-alias pattern) - the
bubble/point/sub-bump arrays in buildFieldFrame and the drop/column arrays in buildStripRaster.
Measured: buildFieldFrame 2484 -> under 200, buildStripRaster 1804 -> 404. Chain now ~600 bytes.
SECOND BUG FOUND WHILE THERE, and it may be the 140% itself: the round-three frame-start detector was
`if (plyIndex <= mStripLastPly) buildStripRaster()`. That is ORDER-DEPENDENT. If the framework walks
plies descending (5,4,3,2,1,0) every single draw satisfies `<=` and rebuilds - SIX rebuilds per
frame, which costs more than having no cache at all and would swamp the time-slicing win. Replaced
with a seen-mask (rebuild when a ply repeats), which cannot fail on any draw order or visible subset.
I have NOT confirmed the framework's draw order, so this is a latent-risk fix rather than a proven
one - but the user's 140%-with-viz reading is consistent with it firing.
OWED: re-measure on 0.2.0.90. If 140% drops sharply, the descending-order rebuild storm was the
cause and the earlier optimisation rounds were being masked by it.
ROUND SIX 2026-08-07 (anamnesis 0.2.0.91) - THE SLICING WAS INCOMPLETE, which is why it barely moved.
User after 0.2.0.90: deletion works great (busy-stack fix CONFIRMED), encoder capture and slowdown
persist.
MY ROUND-FOUR TIME SLICING ONLY CLAMPED TWO LOOPS - the streamline fill and the metaball cell fill.
The two genuinely expensive loops were still running FULL WIDTH every frame:
 (a) the band CONTROL GRID: gCount=68 grid points x nd drops x TWO rippleEvalFast each. Round two
     measured this family at ~7k evals/frame. Untouched by the slice.
 (b) the MARCHING-SQUARES walk over GW-1 cell columns. Untouched by the slice.
So the slice was cutting the cheap half and leaving the expensive half at 100%. Both are now clamped
to the active column range (with a 1-2 cell margin so contours and streamlines still join across
slice seams). cY*/cB* are members, so out-of-slice control points keep last frame's values.
NEON ASSESSMENT, since the user asked me to try it - CONTRAINDICATED on the hot kernel, and worth
recording so it is not attempted again: rippleEvalT is branch-heavy with an EARLY-OUT CULL
("if (age >= kImpactT && r2 > rhi*rhi) return out" - ahead of the wavefront) plus a second divergent
branch for the impact/plop path. Most evaluations take the cull. Going 4-wide would compute all four
lanes including the ones the cull would have skipped, so NEON could be SLOWER than scalar here. The
viable NEON target in this viz is the metaball CELL FILL (contiguous columns, no per-pixel branch)
and secondarily the masked blit - not the ripple kernel. Deferred until 0.2.0.91 is measured, because
4x on work that should not be running is the wrong trade.
OWED: measure 0.2.0.91. The unsliced expensive loops are the strongest explanation yet for why three
rounds of optimisation kept failing to move the encoder.
ROUND SEVEN 2026-08-07 (anamnesis 0.2.0.92) - USABLE, and the mechanisms are banked.
User verdict: usable at last, deletion solid, "incredible strides as it was not working there
either". Remaining and ACCEPTED as the current state: the UI thread still chugs, the viz does not
always run at full rate, encoder capture returns on some settings, bubbles update sluggishly (a
direct consequence of column slicing - a bubble only redraws when its column's slice comes up). The
unit is now understood to be a CM4 target rather than am335x.
ROLLING SLICE (the user's own suggestion, and it was the right one): the static 4-way split parked
its boundaries at the same four columns forever, reading as two fixed vertical tears. The window now
advances by sw every frame and WRAPS (build runs as two ranges when it straddles the end). Because
4*65=260 against a 258-wide strip the boundaries precess 2px per cycle for free. Verified: all 258
columns rebuilt within 40 frames, seams never park.
NOVEL MECHANISMS BANKED TO MEMORY, as requested - both are reusable well beyond this unit:
 - feedback_draw_path_busy_stack: draw-path call chains must fit the 4096-byte `busy` stack, not the
   32768-byte app stack, because a redraw is serviced on `busy` while the spinner is up during
   insert/delete. Presents as a DELETE-ONLY crash with everything else healthy. Includes the
   objdump recipe and the pointer-alias fix.
 - feedback_strip_raster_rolling_slice: the shared strip raster + rolling time slice + mask-blit
   pattern, the order-independent frame-start detector, the "scope the clears" and "slice the loops
   that actually cost" traps, and the finding that od::FrameBuffer calls are VIRTUAL - which is why
   an x86 bench with a non-virtual stub could not see the dominant cost for three rounds.
STILL OPEN if this is picked up again: NEON on the metaball cell fill and the masked blit (both
branch-free and contiguous; the ripple kernel is contraindicated, see round six); bubble update rate
under slicing; and whether kStripSlices=4 is the right tradeoff between per-frame cost and how stale
a column may be."""
verify = { kind = "manual", ref = "emu: no encoder-capture / acceptable frame rate with all plies + bubbles + high Diffusion; responsive on CM4; am335x builds clean + check-graphic-virtual-defs.sh + (if NEON) check-neon-hints.sh" }
note = "Plan of record: planning/anamnesis-viz-optimization.md. The all-over Pond viz crawls on CM4 (fine on MBA by brute force) because it is drawn by one AnamFieldGraphic PER PLY (kVizPlies=6) and each draw() recomputes the GLOBAL work identically - 28-point drift layer, sub-bump expansion over every bubble, and the per-level metaball field build (O(cells x bumps) expf + 3-octave fbm per cell, x3 levels) - so the heavy work runs ~6x redundantly per frame. Doctrine (planning/neon-opportunities.md): architectural before NEON (Visadhara precompute cache = 50x vs NEON 4x), and NO habitat graphic uses NEON yet (compiles into the SWIG .o at -Os, :64 trap unproven). Plan: (1) shared per-frame field cache on the op keyed on vizPhase - compute the strip-wide field once, plies blit windows (mirrors the RaindropGraphic screensaver it was lifted from); (2) bound the field build to per-bump bboxes (bumps->splat, not cells->all-bumps); (3) LUT the expf + thin fbm; (4) fill only active bbox; (5) single-pass multi-threshold marching squares; (6) NEON only on a measured remaining hotspot, class-member storage + whole-.o hint scan + hardware test. Crash rails: keep every virtual inline (DrumCubeGraphic out-of-line draw crash). Item 1 alone likely fixes the crawl. DSP am335x viability (Stretch the killer) is separate. PARKED 2026-08-07 (user): Anamnesis is deferred until the move to CM4. It is understood as a CM4 target, not am335x - see the 0.2.0.92 commit body for the accepted-for-now residuals (UI thread chugs, viz does not always hit full rate, encoder capture returns on some settings, bubbles update sluggishly as a consequence of column slicing). Resume when CM4 is the platform."
[[item]]
id = "anamnesis-insert-crash"
title = "Anamnesis am335x insert: data-abort in Event_post (heap corruption from insert path)"
status = "todo"
stamped = "2026-08-13T23:51:41-05:00"
area = "dsp"
attested = """2026-08-07 ROOT-CAUSED AND FIXED (anamnesis 0.2.0.85), hardware verification owed.
THE WRITE: AnamNoise.h lut() held `int perm[512]` as a STACK LOCAL - a 2048-byte frame - in the
one-time Perlin LUT bake. On hardware the first caller is Anamnesis::process() on the 2048-byte
SYS/BIOS audio task stack, so the bake frame alone consumed the entire stack and the Fisher-Yates
fill wrote a permutation of 0..255 straight through the stack base into the audio Task_Object and
audio Event allocated just below it. The next EDMA completion ISR then walked the wrecked pend queue
and aborted in Event_post.
PROVEN, not inferred. Verified independently of the agent that found it:
 - frame size, measured: 2048 bytes before, 36 after.
 - reachability: a relocation BFS over the .o gives process() -> field::flow() -> noise::sample() ->
   noise::lut() [clone .part.42]. Not an inlining guess.
 - THE FINGERPRINT. The RNG seed is the compile-time constant 0x1234567, so the permutation is
   FIXED, which is why three captures on three firmware builds were byte-identical. Recomputing that
   exact Fisher-Yates shows every "garbage" value in the crash reports is a member of it:
   Task.stack=0x1c(28), Task.stackSize=167, pendQ->next=157 (reports 17+20), pendQ->next=74 (the
   older 9.5.2.56 capture). And the fault address falls out arithmetically:
   157 + 0x18 (offsetof Event_PendElem.matchingEvents) = 0xb5, and 74 + 0x18 = 0x62 - exactly the
   two dfar values observed, with r0 holding the permutation value each time.
FIX: `perm` is now function-local static (.bss), and the Anamnesis ctor calls a new noise::bake() so
the one-time fill happens at insert on the 32 KB app stack - the audio thread never bakes. Nothing
was stripped.
WHY EVERY PRIOR PASS MISSED IT: ASan on x86 - a 2 KB frame on an 8 MB pthread stack is legal; the
member-write audits - `perm` is in bounds OF perm, and is not a member; check-audio-stack.sh - it
only measured functions named ::process(), and the killer frame is two hops down a callee chain
(process itself is 276 bytes, exactly as it reported); the crash report's missing `audio` stack line
- enumeration died at the clobbered Task_Object before reaching it.
DISPROVEN by this: the planning doc's "843 KB footprint collision" model, and the firmware doc's
heap-exhaustion note (report 20 shows 85 KB of a 20 MB ceiling and no last-alloc-fail).
OWED: hardware verify - insert repeatedly with diagnostics armed, expect `insert-ok Anamnesis`, all
~14 stacks listed, and `audio canary=ok`."""

verify = { kind = "manual", ref = "insert Anamnesis in the emu (ASan-clean if built with -fsanitize=address) AND repeatedly on am335x hardware with crash diagnostics armed -> no Event_post data-abort / no corruption" }
note = "Full report: planning/anamnesis-insert-crash.md. HW capture fw 9.5.2.56: data-abort in ti_sysbios_knl_Event_post, dfar=0x62 dfsr=0x5 (near-null deref, NOT alignment/NEON), thread=hwi from the audio EDMA ISR, flight-recorder 'insert Anamnesis' 0.2s prior -> a stray heap WRITE from Anamnesis's insert path clobbers the audio Event pend-queue pointer. AUDIT (2026-07-12): every member-array write in the ctor (memsets + init loops: mLoopBuf/mLine/mAp/mTapBuf/mHannLut/mGrain*/mDrop*/mBub*/mBandZ/pan-tap-fdn tables) and in process() (mLoopBuf[mLoopWr] Lint<=kLoopBufLen; mTapBuf[mTapWr]; mAp[k][idx] idx<kApLen<=kApMax; mLine[i][mWr]; bubble/drop/grain spawns all slot-in-range) is BOUNDED on a correctly-sized object -- no obvious index OOB found. anamnesis is SINGLE-TU (only the SWIG wrapper .o), so the classic stale-wrapper sizeof-MISMATCH cannot apply (a stale wrapper is consistently stale). So: either a subtle path not yet found (buildFieldFrame mFcGrid verified in-bounds too) or build/state/am335x-specific. NEXT: build the .so with -fsanitize=address + LD_PRELOAD libasan, insert in headless emu (ASan names the exact store), and re-capture on hardware with the CLEAN 0.2.0.83 build (original capture's build provenance unknown). PARKED 2026-08-07 (user): Anamnesis deferred until the move to CM4. The insert data-abort and the later delete busy-stack crash are both fixed and user-confirmed on device; what remains owed is the armed-diagnostics am335x insert verification, which is moot while the target is CM4. Revisit or close when CM4 work resumes."

