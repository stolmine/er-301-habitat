links = { depends_on = ["vitrail-unit"] }
note = """User, 2026-08-05, alongside the promotion back to spreadsheet: "i want to do viz for
it." Vitrail currently ships with NO custom graphic (0 Graphic references in Vitrail.lua) - it is
plain faders, which undersells the unit now that it has pride of place in spreadsheet.
OPEN QUESTION (ask before building): WHAT should it depict? The mechanism offers several honest
candidates - (1) the two switched-capacitor clocks as drifting/beating rings or a Lissajous, which
is the actual character source; (2) a filter-response curve for the current routing pair, series
vs parallel visibly different (Tomograph FilterResponseGraphic is the in-repo reference); (3) the
routing lattice as a 5x5 A-vs-B grid with a series/parallel indicator, which makes the 50-item
list legible at a glance; (4) an aliasing/comb spectrum view.
CONSTRAINTS, all learned the hard way: no runtime sinf/cosf from a package .so on am335x - use a
precomputed LUT ([[feedback_package_trig_lut]]); no out-of-line virtuals on the od::* subclass
([[feedback_no_out_of_line_virtuals]], tools/check-graphic-virtual-defs.sh); keep the heavy work
OUT of draw() or the encoder lags ([[feedback_viz_encoder_capture_architectural]], Colmatage is
the reference, SomSphereGraphic the anti-pattern); od line()/fill() are OR/lighten-only, so
