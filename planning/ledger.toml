[[item]]
id = "aw-batch2-ports"
title = "Airwindows batch 2: 11-plugin survey + port (Dynamics3/EverySlew/Mackity first, shared fast-sin atom as the gate)"
status = "todo"
stamped = "2026-08-13T23:51:41-05:00"
area = "dsp"
verify = { kind = "manual", ref = "per unit: both arches build, three lints clean, offline A/B vs the unmodified upstream plugin, emu insert smoke test, and hardware CPU% before any optimization number is claimed" }
note = "Plan of record: planning/airwindows-batch2-port-plan.md (surveyed 2026-08-11). Batch: Mackity, Suzan, Dynamics3, TakeCare, ShortBuss, CloudCoat, SubTight, Creature, EverySlew, OrbitKick, PowerSag2. NOTE 'SubTight Redux' does not exist in the Airwindows repo - SubTight surveyed in its place, confirm intent. TWO CROSS-CUTTING FINDINGS: (1) per-sample double sin() is SAFE on am335x - Galactic already ships 4 sin/sample on hardware and feedback_package_trig_lut is sinf/cosf-specific by its own text - so the batch is a CPU question, not a correctness one; a shared fast-sin atom gates 6 of 11 and retro-improves Galactic + BrightAmbience3. (2) strip AW's per-sample 32-bit dither (frexpf + pow) from all 11, free. KEY DISTINCTION: the 2026-07-22 'hybrid float is low-value' outcome in house-ports-optimization.md was measured on GATHER-BOUND reverbs and does NOT transfer to the 8 buffer-less compute-bound plugins here, where libm and double math really are the loop; it DOES apply to CloudCoat and TakeCare. Step 0 is blocking: port ShortBuss exact, measure on hardware, swap in fast sin, measure again - size the batch off that number, not off the ~10% estimate. SubTight and Creature are the SAME algorithm (SubTight's own comment says 'modified Creature code') - one engine, two voicings. OrbitKick is a generator (a kick synth triggered by input transients), so it earns a standalone unit rather than an atom. Deferred: CloudCoat (7th AW reverb, overlaps CreamCoat), TakeCare (2.25 MB of delay lines). HOTSPOT REVIEW 2026-08-11 (pre-code, corrections verified against source, see plan doc 8b): Galactic has 2 sin/sample NOT 4 (Galactic.h:215-216 in one stereo loop; its own :53 comment is wrong and internally inconsistent), and a double sin costs ~300-500ns not 50ns (newlib fdlibm disasm vs A8 VFPLite timings), so 4 sin/sample is ~6-10% and Galactic's sin floor is ~3-5%. PHASE 2 RETROFIT JUSTIFICATION WITHDRAWN - the fast-sin atom's real customer is Creature/SubTight, where it is a FEASIBILITY GATE: Creature hits 68 sin/sample at max Depth = ~90-150% CPU (unusable), collapsing to ~10-20% with a poly. THREE BAD DEFAULTS: ShortBuss is a bit-exact IDENTITY at default (sbScale = pow((A*2)-1,3)*0.001 = 0 at A=0.5); EverySlew's default IS its max cost (stages is the loop START index, knob inverted); neither CloudCoat nor TakeCare gets undersampling relief at 48k (cycleEnd=1, derez gate open), so TakeCare re-estimated ~40-80% with a 4.7MB double working set. LANDMINES: TakeCare's Rando needs the fpd RNG the port template drops; NaN persists forever in the recursive sin-feedback units (Suzan corner needs a sweep); OrbitKick decays into denormals (emu CPU spike, not an am335x hazard). Creature/SubTight share topology but NOT the per-stage kernel - one formula source, two compile-time instantiations, never a runtime branch. STEP 0 REVISED: hardware sin-cost calibration atom FIRST (N chained sins, N=0..68, measure the slope on-device), then offline fidelity, then the ShortBuss port at A!=0.5."
links = { depends_on = ["house-atom-library"] }

[[item]]
id = "spectral-sort-unit"
title = "Spectral sort unit - pixel-sorting for audio: sample player that permutes the spectrogram along frequency or time"
status = "todo"
stamped = "2026-08-13T23:51:41-05:00"
area = "dsp"
verify = { kind = "manual", ref = "offline Python prototype settles axis/key/phase by ear FIRST; then per phase: both arches build, three lints clean, emu insert smoke test, hardware CPU%, and attach/detach/quicksave clean on hardware" }
note = "Design: planning/spectral-sort-unit.md (2026-08-11). Pixel sorting is mask -> spans -> sort by key, and it is a PERMUTATION (histogram preserved). The STFT magnitude matrix is literally the image, so every pixel-sorting control maps 1:1. TRAP: do NOT sort raw time-domain samples - that yields a monotonic ramp = a sawtooth at the span rate for any input, a waveshaper not a rearrangement. ARCHITECTURE (user calls): (a) buffered, both axes; (b) file handling follows the built-in sample players with core/assets/Player/VariSpeed.lua as the reference - attach from card/pool, slicing view, waveform, serializeSample - NOT record-into-buffer. KEY DESIGN MOVE: separate the permutation from the audio. A sort is a permutation, so the macro recomputes INDEX ARRAYS only (counting sort, no FFT, no audio touched) and resynthesis happens at playback, one inverse FFT per hop reading each bin through the permutation. That makes the macro real-time and CV-modulatable rather than a render button. MEMORY: analyzing the whole sample is DEAD once files come from the card (~385 KB/sec magnitude-only, so a 3-min sample is ~69 MB); instead a bounded ROLLING WINDOW tracks the playhead, which is better anyway because the window IS the sort span and becomes a control (short = local shimmer, long = phrase reordering). Slices are a free second span source. am335x: counting sort on quantized magnitudes (comparison-free, branch-light) NOT a comparison sort per feedback_runtime_branched_dsp_dispatch; pffft already proven on device; playback gather sized at ~1% (ESTIMATED, ~513 scattered reads per 256-sample hop). Energy conserved for free since a permutation preserves the per-frame histogram. RISK: kryos-load-hang is the one existing spectral-resynthesis unit and it hangs hardware, unexplained - resolve or hardware-test early. v1 is trigger/slice/1x playback: variable speed through STFT resynthesis is phase-vocoder time-stretch and a separate feature. Overlaps/synthesizes units-spectral-processing and units-buffer-shuffler. MVP BUILT 2026-08-12 as unit SEDIMENT in spreadsheet 2.8.5.2, frequency axis only (sorting bins within a frame needs no analysis matrix, so the rolling window turned out to be purely a time-axis feature and the MVP is far smaller than the design implies). Verified offline before hardware: pffft real packing confirmed empirically; work=NULL uses the STACK (4KB vs a 2048B audio stack) so the work buffer is heap; Hann^2 at 4x overlap sums to exactly 1.5 and the STFT/OLA replica reconstructs at -140 dBr; counting sort orders 170 dB in 96 buckets with a 0.900 dB worst inversion. Both arches, three lints, emu insert/delete smoke all clean. Fable review found and I fixed: loop-wrap ~13ms fade to -39 dB (wrap inside the gather); control law bunched (86.7% of bins in one span at macro=0.01) so threshold is now dB-linear and the crossfade saturates early; trigger faded the attack in (pre-roll added); no sample-rate compensation so 44.1k files played +1.5 semitones sharp; Options not serialized; setSample did not stop playback; per-span bucket clear was ~680KB/hop worst case. REJECTED the review's top finding (make it header-only for the out-of-line-virtual rule): four shipping units do the same with identical vtable linkage per nm, and header-only would put the DSP in the SWIG TU at -Os - the anamnesis trap. feedback_no_out_of_line_virtuals corrected to graphics-only. OWED: hardware test, listening pass on the -60 dB threshold constant, then the time axis. PARKED 2026-08-12 (user): the spectral-permutation sound is 'quite dirty' and not what was wanted; attention moved to a clean slice-based kaleidoscope unit (see spectral-kaleidoscope). Sediment stays in the tree fully built, reviewed and emu-verified at spreadsheet 2.8.5.2, never hardware-tested. Resume if the harsh spectral character turns out to be wanted on its own terms; the boiling is intrinsic to permuting FFT bins (it destroys inter-frame phase coherence), not a polish problem, so temporal coherence in the permutation is the first thing to try if it resumes. SUPPRESSED FROM THE PICKER 2026-08-12: toc entry commented out (the Plenum pattern) - the unit still builds and ships in the package, only the picker entry is withdrawn. Its emu test 92-sediment-insert-smoke.test was RETIRED at the same time because it asserted Sediment appears in the factory list, which suppression makes false; re-add it when un-suppressing."
links = { depends_on = ["units-spectral-processing", "kryos-load-hang"] }

[[item]]
id = "kaleidoscope-slicer"
title = "Kaleidoscope slicer (working name Millefiori) - shard + mirrored folds + transposition fan over a card-loaded sample"
status = "todo"
stamped = "2026-08-13T23:51:41-05:00"
area = "units"
verify = { kind = "manual", ref = "offline Python prototype settles fold semantics/mirror/Prism law by ear FIRST; then both arches build, three lints clean, emu insert smoke, attach/detach/quicksave clean on hardware, and a listening pass confirming it reads as ordered and clean rather than glitchy" }
note = "Design: planning/kaleidoscope-unit.md (2026-08-12). Meld of Manual Loops and a slice rearranger, three macros: Window (shard = Loop Start/Length), Fold (reflection count), Prism (transposition spread across folds). Source is a CARD-LOADED SAMPLE (user call) so file handling lifts verbatim from Sediment's Lua, which already implements the VariSpeed/ManualLoops pattern. CENTRAL DESIGN POINT: a kaleidoscope is NOT a shuffler - a shuffler rearranges N slices into N slots and the catalog already has that (Larets); a kaleidoscope takes ONE shard and reflects it into a symmetric pattern. So the middle macro is REFLECTION COUNT, not shuffle order. Fold semantics keep the loop PERIOD CONSTANT (raising Fold shrinks the shard to Length/N and plays it N times in the same duration) so the macro does not become an accidental tempo control; mirror comes free from playing odd folds reversed. Sequential folds for v1, not layered: one interpolated read per sample vs N voices, and layering is a different instrument (shimmer/chord) worth auditioning later. Transposition is by RESAMPLING (artifact-free, preserves wave shape); the duration mismatch is absorbed by the slot - transposed up repeats inside its slot, transposed down truncates, and do NOT time-scale to fit. Equal-power crossfades at every fold boundary and the loop wrap are mandatory for 'clean' - Sediment's 13ms loop-wrap dip is the cautionary tale. CLEAN BY CONSTRUCTION where Sediment was dirty: intact waveform per slice, so only ordering changes. Compute-light: no FFT, no transcendentals, no pffft, and therefore no exposure to the unexplained kryos-load-hang. Supersedes the direction of spectral-sort-unit (parked) and is units-buffer-shuffler with a symmetry aesthetic. PROTOTYPE VERIFIED 2026-08-12 (tools/kaleidoscope-proto/kaleido.py, all MEASURED): loop period constant at 4.000s across folds 1-8 with only the shard shrinking; mirror exact (corr of fold0 vs reversed fold1 = +1.0000 against -0.85 unreversed); Prism law accurate within 0.2 semitones out to +36 st; no clicks (boundary step 0.41 vs 0.73 typical). TWO FINDINGS FOR THE C++: mirror folds are inherently click-free because reflection makes fold f end on the sample fold f+1 starts on, so the crossfade is insurance for the transposed case only and pure-mirror is seamless for free; and the crossfade default should be 3 ms - equal-power level holds to -0.24 dB at 3 ms but dips -1.05 dB at 1 ms, too short to average a low-frequency period. MEASUREMENT CAUTION: the first click test used decaying material whose fold boundaries all landed in near-silence, so it reported clean at a 1-sample crossfade and showed no dependence on crossfade length at all; only sustained loud material made the test meaningful. Listening set at /tmp/kal_*.wav. SUPERSEDED 2026-08-13: user called the whole literal-sorting direction too clever ('trying to be too clever and leaning too hard into literal sorting'). Millefiori was DELETED, not suppressed - it was unshipped, unreleased and hours old, and its skeleton (file handling, slice playback, equal-power splices, rate ratio) was reused directly for Breccia. See units-buffer-shuffler."
links = { supersedes = ["units-buffer-shuffler"] }

