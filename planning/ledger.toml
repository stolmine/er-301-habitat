[[item]]
id = "shaper-cross-pollination"
title = "Cross-pollinate 94 Discont and Parfait shaper types, via a shared shaper atom"
status = "todo"
stamped = "2026-08-14T19:34:43-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Every shaper sounds identical before and after the atom refactor (null test per type at matched settings); new types are APPENDED to each mode list so existing presets keep their indices, verified by loading a pre-change preset; the hard-edged additions to Parfait are only reachable through the oversampled path or land after parfait-shaper-oversampling; both packages' mode name lists, buttons and descriptions updated together" }
note = "User asked 2026-08-14 whether an item existed for adding 94 Discont's saturation types to Parfait and vice versa. IT DID NOT - larets-effect-breakout is adjacent (it lists 'distortion/saturation (Parfait, 94 Discont)' as EXISTING catalog coverage) but is about breaking Larets effects into standalone units, not about cross-pollinating these two. INVENTORY, READ FROM SOURCE. 94 Discont (mods/biome/Discont.cpp:48-66, names at mods/biome/assets/Discont.lua:16-23) has 7: 0 Fold, 1 Tanh, 2 Soft (softclip), 3 Hard (hard clip), 4 Sqrt (asymmetric sqrt rectify), 5 Rect (full-wave rectify), 6 Crush (8 levels). PARFAIT (mods/spreadsheet/MultibandSaturator.cpp:116-171, names at mods/spreadsheet/assets/MultibandSaturator.lua:15-21) has 7 plus an off slot: 0 Off (passthrough), 1 Tube (asymmetric soft clip, even harmonics), 2 Diode (arctan with soft knee), 3 Fold (Tri Fold, multi-pass wavefolder), 4 Half Rect (asymmetric soft clip), 5 Crush (bit reduction with MU-LAW COMPANDING), 6 Sine Fold (tonal wavefolder, decoupled gain, ~1-2 folds max), 7 Fractal (iterated polynomial, clamped to stable region). WHAT IS GENUINELY UNIQUE EACH WAY: into Parfait from Discont - HARD CLIP, FULL-WAVE RECT, plain TANH, and SQRT ASYMMETRIC RECTIFY (Parfait's Diode is arctan not tanh, and its Half Rect is an asymmetric soft clip rather than a rectifier, so none of these four have a Parfait equivalent). Into Discont from Parfait - FRACTAL, SINE FOLD, DIODE (arctan), TUBE, HALF RECT, and Parfait's mu-law-companded CRUSH is richer than Discont's fixed 8 levels. GENUINE OVERLAP, do not duplicate: Fold (Parfait's multi-pass Tri Fold is a superset of Discont's) and Crush (take Parfait's). THE COLLISION THAT DECIDES SEQUENCING: adding Discont's HARD-EDGED shapers (hard clip, full-wave rect) to Parfait AGGRAVATES THE OPEN parfait-shaper-oversampling BUG. That item documents drive 5.2 giving ~27x effective gain, pushing shaper harmonics above Nyquist where they fold back, unmasked as the clean lerp mix pulls dry level down; hard discontinuities are the worst possible generators of exactly that. So EITHER land parfait-shaper-oversampling first, OR ship the hard-edged additions only inside the oversampled path. Do not add them to the current unoversampled shaper and call it done. THE STRUCTURAL MOVE - A SHARED SHAPER ATOM: the same waveshaping function should not exist twice in two packages with different code, different signatures and different behaviour. This is the FOURTH instance of the same finding today alongside stft-frontend-atom, ochre-character-eq's band atom and poly-voice-allocator-atom. SIGNATURE RECONCILIATION IS REAL WORK, not a rename: Parfait's applyShaper(x, type, amount, bias) applies 'sig = (x + bias) * (1.0f + amount * 5.0f)' so drive and an asymmetry BIAS are baked into the call, while Discont's take amount plus mix and have no bias term at all. Bias is a genuine feature Discont lacks and should probably gain. Note also Breccia has its own crush, already libm-audited, which is a third implementation of the same idea. SERIALIZATION CONSTRAINT, IMPORTANT AND EASY TO GET WRONG: both units select shapers by MODE INDEX, so INSERTING a new type mid-list renumbers every type above it and silently changes the sound of every saved preset. APPEND new types to the end of each list, never insert, even where that makes the ordering aesthetically wrong. Verify by loading a pre-change preset. DO IT WHILE THE PACKAGES ARE OPEN: biome-discont-mix-left-only is an open Discont bug (Mix tied only to the left DSP instance in a stereo chain, reported by the reference audit and NOT independently confirmed) and should be confirmed and fixed in the same pass. Per feedback_ui_labels, every mode name list, button and description moves together."

[[item]]
id = "sample-swap-downstream-mute"
title = "Swapping a sample under a player mutes downstream units (Larets/Parfait reported); suspect NaN latching in recursive state"
status = "todo"
stamped = "2026-08-15T12:58:19-05:00"
area = "dsp"
verify = { kind = "manual", ref = "Reproduce: clocked player -> Larets -> Parfait, swap the sample mid-playback, observe whether output mutes and whether it EVER recovers; then instrument the chain to catch the first non-finite sample and identify which stage originates it; after the fix, 200 consecutive swaps under load produce no mute and no discontinuity beyond the expected splice" }
rev = 2
note = "BUILTINS CONVENTION CHECKED 2026-08-15 (user asked to base the policy on what the builtins do): THE FIRMWARE HAS NO GUARDS AT ALL. Zero isnan / isinf / isfinite across od/, mods/core/ and xroot/. Zero FPSCR / flush-to-zero / FTZ setup anywhere in the tree. The single denormal mention in the whole firmware is hal/simd.c:25, 'x = vmaxq_f32(x, vdupq_n_f32(0)); /* force flush to zero on denormal values */', which is a DOMAIN CLAMP INSIDE simd_log (the cephes NEON log approximation, which returns NaN for x <= 0 by design) - a local correctness guard, not a policy. AND THE ONE CLAMPING OBJECT DOES NOT SANITISE NaN: mods/core/objects/Clipper.cpp uses vminq_f32/vmaxq_f32, and ARMv7 NEON VMIN/VMAX are NaN-PROPAGATING (the IEEE minNum/maxNum forms are VMINNM/VMAXNM, ARMv8/VFPv4 only, unavailable on Cortex-A8), so a NaN passes through Clipper unchanged. CONFIRM THIS ON DEVICE before relying on it - it is load-bearing for the conclusion. The only protective pattern that DOES exist in core is COEFFICIENT clamping, not signal clamping: LadderFilter.cpp:46-68 clamps q to [2*samplePeriod, 0.9999] every block. CONCLUSION AND POLICY, following the builtins as directed: DO NOT add per-sample non-finite guards to habitat units. The firmware convention is guard-free signal paths, and matching it means the fix belongs AT THE ORIGIN, not spread across every consumer. That convention works for the builtins because nothing in core generates a NaN; if the sample-swap path does generate one, the guard-free convention is precisely what makes a single bad sample system-wide and permanent, which is consistent with the reporter seeing it with several different units. So: find and fix whatever emits the non-finite sample, add a DEBUG-BUILD-ONLY detector or assert at unit boundaries rather than a shipping per-sample cost (a per-sample branch across every unit is real CPU on Cortex-A8 and feedback_runtime_branched_dsp_dispatch applies), and clamp COEFFICIENTS the way LadderFilter does where a parameter path could go non-finite. This supersedes the three-option policy question posed in rev 1 - option (c) is now the evidenced answer rather than a preference. FZ in FPSCR is a separate DENORMAL PERFORMANCE question, not part of this mute bug, and the firmware not setting it is its own open question. || USER-REPORTED BUG, third party. Reported 2026-08-15 by 'Cameron' on Discord, relayed by the user. VERBATIM: 'One minor bug I encountered, and it has happened with other units before this firmware swap, at least im pretty sure: When I had samples loaded to a clocked player, running through larets and parfait, when swapping samples mid jam, itd mute the outputs of larets/parfait'. NOT REPRODUCED LOCALLY - this item starts at reproduction, not at a fix. TWO THINGS THE REPORT ALREADY TELLS US: (1) it is NOT Larets/Parfait-specific - the reporter says it has happened with other units and predates the firmware swap, which points at the SAMPLE SWAP as the source and at any downstream unit holding recursive state as the victim; (2) the swap is upstream of both units, so whatever propagates is arriving through the audio path rather than being a control-side glitch. PRIMARY HYPOTHESIS - NaN LATCHING. NEITHER UNIT HAS ANY NON-FINITE GUARD: grepping mods/spreadsheet/Larets.cpp and mods/spreadsheet/MultibandSaturator.cpp for isnan / isfinite / 1.18e-23 / denormal returns NOTHING. Both hold recursive state that a single NaN would poison permanently - Parfait has per-band AA filters and SVFs (4-lane NEON SoA) plus a compressor detector, Larets has per-channel buffer effects with feedback (ch[c].buffer). NaN times anything is NaN, so once it enters a recursive path the unit outputs NaN forever and the chain reads as muted until the unit is reset. This fits 'mutes the outputs' better than any gain-side explanation, and it explains why the same symptom would appear with OTHER downstream units, since almost nothing in habitat guards its input. HOW A SWAP COULD PRODUCE A NON-FINITE SAMPLE: the firmware's od::Sample is reference-counted (claim/release) and SampleLoader loads asynchronously; if a sample is released or its buffer reallocated while the audio thread is mid-read, the player can read freed or uninitialised memory, which as float32 is very often NaN or a huge denormal-adjacent value. A zero-length or zero-sampleRate sample reaching a rate calculation would divide by zero the same way. Both are firmware-side origins with habitat units as the victims - which matches 'happened with other units'. THE SINGLE MOST DIAGNOSTIC QUESTION, ASK CAMERON: does the mute EVER recover on its own, or does it persist until the unit is re-inserted / the chain rebuilt / the module rebooted? A permanent mute that survives new audio is essentially conclusive for latched NaN in recursive state. A brief dropout that recovers is a different bug entirely (buffer reallocation gap) and much less serious. Also worth asking: which player exactly (Clocked Player vs Variable Speed vs Card Player), whether the swap was via the sample pool or a card attach, whether Parfait alone or Larets alone reproduces it, and whether bypassing one of them changes anything. INVESTIGATION ORDER: (1) reproduce in the emu, which is where instrumentation is cheap; (2) instrument to find the FIRST non-finite sample and which stage emits it - if the player emits it, this is a firmware/sample-lifetime bug and should be reported upstream to the stolmine fork rather than patched per unit; (3) regardless of origin, decide the habitat-wide policy below. THE POLICY QUESTION THIS OPENS, which is bigger than one bug: habitat units almost universally do NOT guard their inputs, so ANY unit with recursive state is one stray NaN away from a permanent mute. Airwindows' own idiom is a cheap input guard ('if (fabs(x) < 1.18e-23) x = fpd * 1.18e-17') and gesso-glue-compressor and strata-channel-strip both already record that AW guards only the input while leaving internal IIR state unprotected. Options: (a) a shared input-sanitise helper applied at every unit boundary, costing a compare per sample; (b) guard only units with recursive state; (c) fix the origin and add a debug-build assert rather than a runtime cost. Prefer (c) plus targeted guards on the units that latch, but decide it deliberately - a per-sample branch across every unit is a real CPU cost on Cortex-A8 and feedback_runtime_branched_dsp_dispatch applies. SEPARATELY, and cheap either way: setting FZ in FPSCR globally is worth doing for the denormal half of this problem, and is already noted as an open item in strata-channel-strip's porting cautions. RELATED: anamnesis-insert-crash is a different failure (heap corruption from an insert path) but shares the shape of 'an upstream lifecycle event damages an unrelated unit'."

[[item]]
id = "larets-overview-skew-duplicate"
title = "Larets: decide whether the Overview expansion should keep its duplicate Skew fader"
status = "todo"
stamped = "2026-08-20T15:56:12-05:00"
area = "ui"
verify = { kind = "manual", ref = "expanding Larets' Overview ply exposes Skew exactly once, by whichever route is chosen, and Skew still reaches the DSP" }
note = """DECISION PENDING, no code change yet. Raised by user 2026-08-17 asking whether the fader under Overview's default 3-button subdisplay does anything.

IT DOES, and it is Skew - fully traced, not inert. Larets.lua:73-75 makes objects.skew a ParameterAdapter with tie(op, 'Skew', skew, 'Out'); Larets.cpp:113 registers mSkew; process() reads it at Larets.cpp:407; it feeds skewMultiplier() which scales per-step tick counts at Larets.cpp:442, 462 and 497. Shift-toggling Overview out of its rand/steps/loop param mode gives a working Skew fader.

THE ACTUAL ISSUE IS DUPLICATION. The 'overview' and 'skew' entries in onLoadViews are bound to IDENTICAL arguments - same branch (branches.skew), same gainbias and range (objects.skew), same skewMap, same units, precision and initialBias. Only the button label and Overview's extra op/stepCountParam/loopParam differ. The expansion list `overview = { 'overview', 'skew', 'stepCount', 'loopLength' }` then puts both in the same expanded view, so Skew appears twice side by side.

WHY IT IS SHAPED THIS WAY, so nobody 'fixes' the wrong half: LaretOverviewControl extends GainBias and therefore MUST be handed a parameter; Skew is the only spare. And listing 'overview' first is the documented convention (feedback_expansion_custom_graphic) - the original control key has to lead or the custom graphic is replaced by a plain fader on expansion. So the structure is correct and it is the trailing 'skew' entry that is redundant.

OPTION A (agent recommendation): drop 'skew' from the expansion list, leaving { 'overview', 'stepCount', 'loopLength' }. Skew stays reachable via shift-toggle on Overview, frees a ply slot, and serialization is unaffected either way since it reads objects.skew directly.
OPTION B: keep it, on the grounds that shift-toggle is less discoverable than a labelled fader, and treat the duplication as deliberate.

Tradeoff is purely discoverability vs tidiness; no correctness issue either way. Related: feedback_control_expansion_views, feedback_parammode_convention. AUDIT-VERIFIED 2026-08-17 against DMC, and WORSE THAN FILED: the unit is effectively dead, not merely mislabelled. DMC lfo.h:89-94 shows the sync_ branch of Configure calls set_level(parameter[0]) and NEVER calls set_rate at all. So Param1 is level, and rate_ keeps its Init value of 0 (our lfo.cc:50). Because our deliberate ER-301 adaptation makes rate_ the clock multiplier (lfo.cc:100-106, shift = (rate_-32768)>>12), rate_ = 0 pins shift at -8, so phase_increment_ = base_inc >> 8: the LFO always completes ONE CYCLE PER 256 CLOCK PULSES (~128 s at 120 BPM, near DC), and the clock-multiplier feature is unreachable. FIX: after Configure, call set_rate(params[0]) and set_level(40960); note the multiplier only recomputes inside the if (period != period_) guard at lfo.cc:98-106, so it must be hoisted out, as Plo already does at lfo.cc:670-675. AUDIT-VERIFIED 2026-08-17 for BOTH units. DMC lfo.h:192-193 is set_fm_rate(parameter[2]), set_fm_depth(parameter[3]); lfo.h:310-311 is set_wsm_rate(parameter[2]), set_wsm_depth(parameter[3]). Ours has FmLfo.lua:68-73 labelling Param3 as FM Amount and :74-79 labelling Param4 as FM Rate, and WsmLfo.lua the same. The PARAMETER INDICES ARE CORRECT; only the labels are transposed, so this is a pure rename. PLO already gets it right (Plo.lua:79-90 vs lfo.h:426-427), so match that. AUDIT-VERIFIED 2026-08-17, but RECLASSIFIED: the behaviour is real and the wrapper is NOT at fault. WsmLfo::set_shape_parameter_preset reads presets[value] while wsmlfo_presets[] sits declared and unused two lines above (ours lfo.cc:424,437; DMC lfo.cc:424,437, and the same for Plo at :636). Diffed: the region is byte-identical to DMC, so this is an INHERITED UPSTREAM BUG, not a mismapping we introduced. Consequence: the seven Shape positions land on FoldedSine, FoldedPowerSine x2, OverdrivenSine, Triangle, Square x2, so WSMLFO_SHAPE_NOISE is unreachable and the accompanying parameter presets (+/-32767) are the ones meant for LFO shapes. CANNOT be fixed in the wrapper - it needs a DSP edit, which means deliberately diverging from DMC. Decide whether to fix or to keep parity with upstream. AUDIT-VERIFIED 2026-08-17, exactly backwards as filed. DMC bytebeats.h:52-57 maps parameter[0] to set_frequency and parameter[3] to p2; bytebeats.cc:62 computes bytepitch = (65535 - frequency_) >> 11 (the tick rate) and :66 computes equation_index_ = p2_ >> 13, selecting one of 8 equations at bytebeats.cc:86-152. Ours labels Param1 as Formula (ByteBeats.lua:56-61) and Param4 as Speed (:74-79). Param2/Param3 are correct. FIX: swap the two view blocks, and ideally quantize the equation dial to 8 steps. AUDIT-VERIFIED 2026-08-17 and worse than filed. HighHat.lua:16-24 declares no ParameterAdapters and :26-38 exposes only the gate, but PeaksUnit.cpp:135 still constructs the four od::Parameters, which sit at their 0.5f default (PeaksUnit.h:13-16) and reach the DSP as 32767 every frame. DMC high_hat.h:60-69 reads parameter[0] frequency, [1] decay, [2] frequency randomness, [3] decay randomness. So both RANDOMNESS amounts are permanently pinned at 50 percent and every hit random-walks pitch and decay by up to +/-8191 (high_hat.cc:64-100) with no way to turn it off - the hat sounds unstable and cannot be edited. FIX: add the four adapters/views as the other drum units do, defaulting BOTH randomness dials to 0. SCOPE UPDATE 2026-08-17 after the DMC wrapper audit. All five original defects confirmed with file:line evidence on both sides. Three more found and filed: peaks-snare-frequency-unipolar-display, peaks-fm-wsm-rate-map-polarity, peaks-modseq-four-dials-eight-steps. One of the original five (peaks-wsm-plo-wrong-preset-table) turns out to be an inherited DMC bug needing a DSP edit, so it does NOT belong in a wrapper-only sweep - handle it separately. That leaves SEVEN wrapper-layer fixes for one release. Audited clean against DMC: Bass Drum, FM Drum, Number Station, Randomised Envelope, Bouncing Ball, Mini Sequencer, PLO. Also established: our vendored DSP is DMC verbatim apart from a corrected copyright name and the deliberate lfo.cc ER-301 adaptation (Rate as clock multiplier in sync mode, phase reset moved to the auxiliary/reset inlet), so the DSP layer needs no audit. BUILT 2026-08-20 as stft-frontend-atom-built: mods/spreadsheet/atoms/StftFrontEnd.h, gating acceptance test met at a measured -140 dB round-trip noise floor. Split-call API as preferred here. Package is spreadsheet, per this item's own rule. The two EXISTING units are not yet refactored onto it, so this item stays open for that conversion."""

[[item]]
id = "peaks-snare-frequency-unipolar-display"
title = "Peaks Snare Drum: Frequency is a signed detune shown as a unipolar 0..1 dial"
status = "todo"
stamped = "2026-08-20T15:56:12-05:00"
area = "ui"
verify = { kind = "manual", ref = "Snare Drum Frequency reads 0.00 at nominal pitch and spans -1..+1, matching Bass Drum" }
note = """Found by the DMC wrapper audit 2026-08-17. DSP is fine, display only.

SnareDrum.lua:56-61 uses Encoder.getMap('[0,1]') with initialBias 0.5, and PeaksUnit.cpp:134 leaves the bipolar mask at 0x0. But DMC drums/snare_drum.h:62 does set_frequency(parameter[0] - 32768), so 32768 is the no-detune centre. The readout therefore says 0.50 for nominal pitch and 0.00 for maximum down-detune. Bass Drum already does this correctly: BassDrum.lua:56-61 with mask 0x1 at PeaksUnit.cpp:133.

Full range is still reachable, so this is cosmetic, but it is inconsistent with the sibling unit. FIX: set bit 0 of SnareDrum bipMask and give p1 the [-1,1] map with initialBias 0.0."""

[[item]]
id = "peaks-fm-wsm-rate-map-polarity"
title = "Peaks FM LFO / WSM LFO: modulator Rate is unipolar but presented as bipolar [-1,1]"
status = "todo"
stamped = "2026-08-20T15:56:12-05:00"
area = "ui"
verify = { kind = "manual", ref = "the modulator rate dial on FM LFO and WSM LFO reads 0..1; the depth dial stays bipolar" }
note = """Found by the DMC wrapper audit 2026-08-17. Display only.

FmLfo.lua:71 and WsmLfo.lua:71 map Param3 as Encoder.getMap('[-1,1]'), and PeaksUnit.cpp:188-189 sets bipMask 0xC. But fm_rate_ and wsm_rate_ are plain uint16_t fed straight into lut_lfo_increments (DMC lfo.h:211-213 and lfo.h:329-331, lfo.cc:246-248 and :443-445). There is no centre point, so the fastest half of the range reads as positive and the slowest half as negative, implying a bipolar quantity that does not exist.

Note the DEPTH dial on Param4 IS legitimately centre-zero (DMC lfo.h:215-223), so [-1,1] is correct there. Only the rate dial is wrong. FIX: clear bit 2 of the bipMask for both units and give Param3 the [0,1] map. Pairs with peaks-fmlfo-wsmlfo-swapped-labels, which moves which dial is which."""

[[item]]
id = "peaks-modseq-four-dials-eight-steps"
title = "Peaks Mod Sequencer: four Step dials drive an eight-step mirrored sequence"
