[[item]]
id = "units-buffer-shuffler"
title = "Buffer Shuffler / Groovebox — BBCut-style beat-slicing buffer manipulation"
status = "wip"
stamped = "2026-08-13T23:51:41-05:00"
area = "units"
verify = { kind = "manual", ref = "insert; confirm buffer record/assign, transient-or-grid slicing, per-slice reverse/repeat/pitch/level, algorithmic BBCut-style shuffle modes, clock-synced playback with gate-triggered stutter/glitch" }
note = "planning/todo-archive.md '## Buffer Shuffler / Groovebox', bbcut.md. Could evolve into a groovebox framework (seq + slices + effects). BUILT 2026-08-13 as BRECCIA in spreadsheet 2.8.5.4 (rock formed from angular fragments cemented together). Deliberately minimal per user: a card-loaded buffer cut into N slices, played back continuously through a rearrangement, with a gate that reshuffles. Controls are Size + Shuffle + Level, nothing else. KEY CHOICE - SLICE COUNT, NOT LENGTH (user's own instinct): count is length-agnostic, the buffer always divides into exactly N pieces whatever its duration, the loop period stays equal to the buffer, and every slice plays exactly once per cycle so playback is a true PERMUTATION with content preserved. Length would make the count drift with duration and leave a ragged remainder. Size and order changes are adopted only at slice boundaries so neither jumps mid-slice; Fisher-Yates via od::Random::generateFloat; 3 ms equal-power splices from a precomputed LUT (never runtime sinf/cosf, feedback_package_trig_lut); file-rate vs engine-rate compensation retained. VERIFIED: both arches build, three lints clean, Breccia.o NEON-clean, emu insert/delete smoke passes, and the per-sample loop calls ONLY the two readSource reads - sin/cos are the crossfade LUT and Random is the shuffle, both outside it. Python replica measures the permutation at -0.009 dB total energy change (the deficit is the splices). This supersedes the kaleidoscope-slicer and lane-shear-sorter directions as the thing being built; both stay documented. OWED: hardware test, and the listening pass on slice count. SIZE MODE OPTION added 2026-08-13 (spreadsheet 2.8.5.6): user reported 'we appear to always get quite large chunks'. ROOT CAUSE: Size was a slice COUNT capped at 64 on a LINEAR map, so slice duration = buffer/N and a 30 s sample bottomed out at 469 ms even maxed. Fixed in three steps: ceiling 64 -> 1024; Size map made exponential (each detent roughly halves the slice); and a new Size Mode option - 1 = count (length-agnostic, musical divisions line up, duration scales with the buffer) or 2 = length (absolute slice duration, count follows from the buffer), loosely after the sampler slice-mapping idiom (VariSpeed's CV-to-Slice Mapping nearest/index/12TET - same shape of choice, different axis). ALSO FIXED a real bug found while in there: changing Size called identity(), silently UN-SHUFFLING the unit every time the size knob moved, so the shuffle gate appeared broken; it now rebuilds a permutation at the new count while keeping the shuffled state, and snaps to the nearest boundary of the new grid instead of jumping the playhead to the top of the buffer."

