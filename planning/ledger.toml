2026-07-17 Rauschen CA FREQUENCY is emergent too (spreadsheet 2.8.3.30). Rauschen has no V/Oct for the CA, so pitch is a function of the same per-instance X/Y field, NOT wired to voctPitch: caF0 = 50 * 2^(2.4*nFreq + 3.6*Y^2), nFreq=caVNoise(px,py,caSeed+505). Field term spreads pitch per instance+position; Y^2 term lifts it with Y. Constants tuned in planning/ca-freq-tune.py (mirrors caVNoise exactly, 240 instances x 24x24 grid): ~50% of cases below 220Hz (49.0%), floor ~50Hz, low-Y median ~124Hz (93% below 220), high-Y median ~684Hz reaching ~1.3kHz p95 (2% below 220) = low weighting with upward excursions along Y, per user. Dropped the earlier V/Oct-base + caCenterOct scaffold. am335x re-verified: CellularEngine all 0/0, Rauschen::process 0 q/0 hints (powf now 6, all block-rate).

