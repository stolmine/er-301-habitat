verify = { kind = "manual", ref = "a generative source unit driven by a 1D elementary cellular automaton (Rule 0-255) whose evolving row is the grain material; the CA clock (Rate) locks the grains; Evolve spans static structured tone -> tuned noise; sounds distinct per rule; am335x-cheap (bitwise CA per generation)." }
note = """Full design note: planning/ca-wavetable-noise-design.md. Inspired-in-spirit by Kentaro's "tonemata" M4L device (noise generator built on wavetables generated+updated by 1D cellular automaton rules; granular processing locked at sample level to the CA clock; 7 modulators). Clean-room (CA = public-domain math), generic name ([[feedback_no_third_party_branding]]; provisional Vivary/Lattice/Palimpsest/Cendre). Emphasis chosen 2026-07-16: GRANULAR NOISE TEXTURE (not a clean pitched osc) -- CA-clocked grains, gritty/sound-design. Core: 256-cell elementary CA (Rule 0-255 via 8-entry bitwise LUT, toroidal, single-cell/density seed) = the grain material; a read head scans the current row at Rate (the CA/grain clock, sub-audio glitch -> audio grit), CA advances LOCKED to the read (Evolve: frozen tone -> new generation per grain = aperiodic rule-structured NOISE). Grain/Window (raw clicky <-> windowed+2-head overlap), Smooth/Depth (harsh binary +/-1 <-> history-accumulated grayscale), Scatter (mono <-> decorrelated stereo heads). Controls v1: Rate, Rule, Evolve, Grain, Seed(trig+density), Smooth, Scatter. am335x-trivial (bitwise CA once/generation, per-sample = windowed table read; no NEON). Source unit (biome or spreadsheet), distinct-method sibling to Rauschen ([[project_spreadsheet_effect_positioning]]). Build phasing: (1) POC = CA engine + one read head + binary out, hear structured noise, sweep Rule/Rate/Evolve; (2) grain window + overlap + grayscale; (3) stereo + seed + optional input-seed; (4) anti-alias LP/OS + rule curation; (5) CA space-time viz overview + name. Risks: CA fixed-point die-out (all-0/all-1) -> re-seed watchdog so it never goes silent; aliasing is character but tunable LP to tame; POC SHIPPED (2026-07-16, spreadsheet 2.8.3.19): new unit Vivary, atom mods/spreadsheet/Vivary.h. 256-cell elementary CA (Rule 0-255 via 8-entry bitwise LUT, toroidal branch-wrapped edges = no integer division, single-cell seed); read head scans the row at Freq, CA advances one generation at each wavetable-PASS BOUNDARY (click-free) every NClk passes; linear-interp binary +/-1 read; die-out watchdog reseeds all-0/all-1 + optional Reset interval. 5 controls: Freq (oscFreq map), Rule, Res (2..256 cells), NClk (passes/update = tone<->noise), Reset (0=off). Mono out. am335x-safe (process: 0 q-reg/hints, NO libcalls incl. no idiv; vtable COMDAT; exported clean). Offline CA sim confirms logic: rules 30/110/54/150/105/45/73/126 stay ALIVE from single-cell seed (continuous noise); 90/60/22/18/146/182 DIE @gen31-62 (need Reset>0 or the auto-reseed). AUDITION: sweep Rule (alive vs dying), Res (2=brute square .. 256=detail), NClk (1=noise .. high=static tone), Freq (pitch). NORMALIZED (2026-07-16, spreadsheet 2.8.3.20): all 5 controls now 0..1 (house 0.01 coarse step) for easy modulation from any unit at unity gain; C++ maps internally -- Freq 0..1 -> exp ~0Hz..8kHz (powf, block rate), Rule ->0..255, Res ->2..256, Evolve (1=per-pass noise, 0=static) -> nClk 1..64, Reset ->0..256(0=off). am335x-safe (1 block-rate powf, else no libcalls; 0 q-reg/hints). FREQ=f0 + V/OCT + PHASE-2 SMOOTH (2026-07-16, spreadsheet 2.8.3.21): Freq is now a normal oscillator f0 (Hz, oscFreq/octaveMapWithZero map) with a V/Oct inlet (Pitch ViewControl + ConstantOffset; f0 = fund*2^(voct*10), ER-301 convention, block rate). Rule/Res/Evolve/Reset stay normalized 0..1. Phase-2 grayscale SMOOTH control (0..1): per-cell grayscale EMA (0.35 leak ~3-4 gens of the +/-1 states) updated at each caStep; the read blends binary +/-1 -> grayscale by Smooth -> harsh digital <-> soft time-baked waveforms. am335x-safe (0 q-reg/hints; 1 block-rate powf, no per-sample libcalls). RULE CURATION (2026-07-16, spreadsheet 2.8.3.22): user asked to select for more interesting rules. Offline sweep of all 256 (planning/ca-rule-analysis.py) scored by COMPLEXITY = spatial-entropy x row-variety (NOT raw flip rate, which rewards trivial period-2 buzzers) -- surfaces the canonical gems (rule 30->rank2, 110->14, 149/73/45/193/137/126/150/105). 88 distinct symmetry classes; curated 48 DISTINCT (mirror/complement-deduped) interesting rules into kVivaryRules[48] in Vivary.h, complexity-ranked. Rule 0..1 now indexes this table (every position a distinct lively texture, no dead rules) instead of raw 0..255. Default rule 0.0 = 86 (= rule-30 chaos class). am335x-safe (just array index; 0 q-reg/hints). Follow-ups noted: curated<->all-256 option toggle; richer rule FAMILIES (totalistic multi-state, radius-2 neighborhood) for genuinely different textures. MULTI-STATE FAMILIES (2026-07-16, spreadsheet 2.8.3.23): new Family control (0..1 -> 3 families) = a genuinely different palette. Family 0 = elementary binary (k=2, 48 curated rules, +/-1 waveforms); Family 1 = TOTALISTIC 3-state (k=3, next from neighborhood SUM, 32 curated rules from a full 2187-sweep, 3-level waveforms); Family 2 = totalistic 4-state (k=4, 32 curated from 20k random samples, 4-level). Curated + state-complement-deduped + complexity-ranked (planning/ca-rule-analysis.py): kVivaryRules3[32] (uint16), kVivaryRules4[32] (uint32). Cells 0..k-1 -> multi-LEVEL amplitude (ampScale=2/(k-1)); family-aware caStep (LUT-by-pattern vs table-by-sum); reseed on family change (stale cells out-of-range for new k); grayscale EMA + Smooth work in amplitude domain across all k. am335x-safe (0 q-reg/hints; base-k unpack idiv is block-rate-on-change only, totalistic step + read use no division). AUDITION: sweep Family -- 3-state/4-state should sound rounder/more organic (multi-level) than binary; each family has 32-48 distinct curated rules. GRAIN OVERLAP (2026-07-16, spreadsheet 2.8.3.24): interpreted tonemata's 'granular processing locked at sample level to the CA clock' -- the grain clock IS the CA/wavetable clock (we already had that: CA advances at the pass boundary = sample-locked, click-free, coupled to the rule set); the MISSING granular part was OVERLAP. New Overlap control = overlap-ADD of the last N=4 CA generations: keep a gen-history ring (mGenRing[4][256], pushed each caStep, filled on reseed); the read sums the last activeGen generations at the shared pass-phase weighted by a decaying window (age m weight = max(0,1-(m+phase)/D), D=1+overlap*3), normalized. Overlap 0 = current gen only (hard swap, = prior behavior); up = generations layer/morph -> smears the evolution into a continuous morph + thickens. Works across all Families (multi-level amps) and composes with Smooth (blend to grayscale EMA after overlap-add). am335x-safe (0 q-reg/hints; per-sample normalize is hardware vdiv, no new libcall; activeGen loop bounded 1..4, minimal at overlap=0). MULTI-STATE REPLACED w/ RADIUS-2 BINARY (2026-07-17, spreadsheet 2.8.3.25): user found totalistic families 1/2 'wrap into sameness' -- LESS rhythmic than binary family 0. Diagnosis (correct): (1) totalistic = SUM-based -> can't see arrangement -> averages away positional structure; (2) multi-level amps soften edges; (3) the entropy x variety curation metric optimized for CHAOS (Wolfram class III = undifferentiated noise), not rhythmic structure (class IV). Fix (user's path a): extend family 0 to WIDER-NEIGHBORHOOD BINARY (keeps sharp +/-1 rhythmic edges) + re-select with a STRUCTURE metric = spectral tonality (peaky=structured, flat=noise) x timbral motion. Validated: structure metric picks entirely different high-tonality rules; old entropy picks rank low on structure (confirming they were chaos). Families now: 0 = radius-1 elementary (3-neighbor, kept the 48-rule set), 1 = RADIUS-2 (5-neighbor, LUT[32], 32-bit rules, 48 curated from 16k sample of 2^32 by structure metric, mirror+complement deduped). All binary (sharp). Removed totalistic/k/ampScale/base-k-unpack (idiv gone). am335x-safe (0 q-reg/hints; only libcall = block-rate powf). Metric + curation in planning/ca-rule-analysis.py. AUDITION: does radius-2 give richer rhythmic structure + timbral variation while keeping binary bite; is family 0 vs 1 a good progression? FIVE FAMILIES (2026-07-17, spreadsheet 2.8.3.26): user insight -- family 0's appeal is MAXIMUM VARIETY (0.88: a distinct new wavetable nearly every generation = relentless novelty; structure/tonality trades variety for repetition = 'miniature sequences' = less alive). User wants a heuristic PALETTE. Now 5 binary families via a Family control (round 0..4), each a caStep mode + curated table: 0 = radius-1 CHAOS (max variety, the beloved, 48); 1 = radius-2 STRUCTURE (5-neighbor, 48); 2 = EDGE-OF-CHAOS/class IV (variety x moderate-change -> gliders/particles incl. rule 110, 40); 3 = REVERSIBLE 2nd-order (next=f(l,c,r) XOR prev-gen -> can't die, perpetual wave/interference, 40 base rules, needs mPrev[]); 4 = ADDITIVE/XOR fractal (linear rules -> nested Sierpinski, 10). caStep modes: 0=r1, 1=r2(5-nbr LUT[32]), 2=reversible. Curated in planning/ca-rule-analysis.py. am335x-safe (0 q-reg/hints; only libcall = block-rate powf). AUDITION: sweep Family 0..4; does edge-of-chaos give gliders, reversible give never-dying waves, fractal give self-similar? TRIMMED TO 3 FAMILIES + GRAIN REDESIGN (2026-07-17, spreadsheet 2.8.3.27): user kept families 0-2 (chaos/structure/edge-of-chaos), CUT 3 reversible + 4 fractal (removed REV/FRAC tables, mPrev, reversible caStep mode). Family control now 0..2. GRAIN ENGINE REWORK: the old overlap read all N generations at the SAME phase and summed -> averaged the (correlated consecutive) generations' sharp edges together = a LOWPASS (user's exact complaint), plus linear normalization dipped (the Network/Petrichor fade-law issue). Fix: (1) DECORRELATE -- each generation grain is now read at its own phase offset (m*ovDelta, ovDelta=overlap*0.5) so edges don't align/average -> a layered mashup instead of a smoothed average; (2) EQUAL-POWER sum -- weights decay by age (1/(1+m)), normalized by 1/sqrt(sum w^2) (block-rate sqrtf), the correct law for decorrelated content. am335x-safe (0 q-reg/hints; sqrtf is block-rate, only other libcall is block-rate powf). AUDITION: does Overlap now sound like layered generations (mashup) rather than a lowpass; level steady across the sweep? FEEDBACK / fb DONE (2026-07-17, spreadsheet 2.8.3.28): tonemata's granular 'fb' as a PITCH-TRACKED FEEDBACK COMB on the grain output. Delay = one wavetable period (SR/f0) so it reinforces the current texture at pitch -> resonant, Karplus-like sustained tail that blooms with pitch/res/overlap. Feedback amount 0..0.9, mild one-pole HF damping (0.5, Karplus), cubic soft-clip in the loop (bounds +/-2/3, self-limits, no runaway). New Feedback control (fb, 0..1). At fb=0 the dry passes clean. 8192-sample delay buffer (32KB, covers down to ~6Hz). am335x-safe (0 q-reg/hints; per-sample comb all VFP -- masked delay + one-pole + cubic clip; the SR/f0 delay is a block-rate vdiv; block libcalls stay powf+sqrtf). AUDITION: does fb grow a resonant sustained tail; stable at high fb; musical with pitch sweeps? Remaining phase 3: stereo scatter, freeze, rand-reseed + trigger inlet, CA space-time viz., stereo Scatter, fb/freeze/trigger, anti-alias, CA space-time viz. TUTORIAL SPECIFICS (2026-07-16 screencaps, informative not prescriptive): rule updates ONLY at the wavetable-pass boundary (click-free); n-clk = CA update interval in passes (=Evolve as int); r-clk+rand = reset interval + random reseed (CONFIRMED essential -- rules converge/die); res = variable CA resolution (2..N cells at constant pitch = STANDOUT timbral axis, add it); o-lap grain overlap; fb pre/post granular feedback; freeze hold; trigger manual reseed; f-clk/pitch/gate = fixed-clock vs MIDI-pitch melodic mode (-> make Rate V/oct-able). Refined control set in the design note.

