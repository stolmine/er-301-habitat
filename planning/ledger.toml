drops discreteCoarseStep=5 back to the default 1 and takes discreteJumpStep=5.
CAVEAT to check in the emu: the shift-jump depends on `shifted` actually reaching
ModeSelector:encoder. If a higher layer swallows shift+encoder it degrades gracefully to the coarse
step rather than breaking, but the jump would silently not work.
