[[item]]
id = "bionic-lester-clone"
title = "Profiling-informed clone of a switched-capacitor dual filter (target: Bionic Lester Mk1)"
status = "todo"
stamped = "2026-07-15T22:07:09-05:00"
area = "units"
verify = { kind = "manual", ref = "a dual multimode filter unit whose linear response, resonance, aliasing min/max, and per-mode input distortion track a Bionic Lester Mk1 hardware capture corpus (Canals-style); the signature low-cutoff foldback grit is reproduced by the clamped fc-tracked switch-clock model; CPU envelope measured across the cutoff range on am335x." }
note = """Full design note: planning/bionic-lester-clone-design.md. Target = IME/Harvestman Bionic Lester Mk1 (Model 1873), a dual 12dB/oct switched-capacitor multimode filter (per side LP+BP + switchable HP/AP/notch; shared resonance/mode/aliasing; ch1 CV normalled to ch2; clock-source routing; no self-oscillation; input distortion that changes with mode). Almost certainly an MF10/LMF100-class universal SCF biquad, so the linear core is datasheet-derivable and only tuned/validated by profiling (reuse the Canals harness [[reference_three_sisters_model]]). KEY MODEL: an SCF is discrete already (clean coeff fit, no bilinear warp) and its aliasing is reproduced by running the SVF at the modeled switch clock (fc=fCLK/N, N=100/50 = the aliasing min/max switch) CLAMPED to the host rate - low fc gives a low internal rate that is cheap AND authentically gritty, high fc runs clean at host rate, never oversample. Estimate ~90-95% of shapes/resonance/routing + ~85-90% of the foldback grit (nearly free), with the last ~10% (per-mode input distortion coloration, clock-feedthrough tone) being ear-voicing not research. Reuses: Canals normalling ([[feedback_multi_input_normalling_pattern]]), stereo/dual-instance shared-state ([[feedback_stereo_pattern_selection]]), multi-output picker ([[project_multi_output_framework]]), aliasing-as-synthesis ([[project_alias_synthesis_paradigm]]). Generic functional name, no third-party branding ([[feedback_no_third_party_branding]]). Assessed a better candidate than Canals (discrete core removes the hardest analog step; no self-osc removes the nastiest nonlinear match)."""

[[item]]
id = "network-gain-compensation"
title = "Gain compensation for Network (Fabula's makeup model, tap-weight-energy basis)"
status = "done"
attested = "2026-07-15T22:42:06-05:00"
stamped = "2026-07-15T22:42:07-05:00"
area = "dsp"
verify = { kind = "manual", ref = "an RMS/loudness sweep across Network's Density + Size shows roughly constant perceived level with the makeup on vs stepping without it; a Motion sweep leaves the stereo image intact (pan preserved, no loudness change); no transient pumping; the density swell still audible (not flattened). Block-rate cost only (no per-sample additions), am335x-confirmed." }
note = """Full design note: planning/network-gain-compensation-design.md. Bring Fabula's gain-compensation PRINCIPLE (static, block-rate, param-driven scalar - deterministic compensation, never a dynamic AGC that pumps) to Network, but with a tap-weight-energy BASIS instead of Fabula's single-knob linear makeup, because Network's level is a 32-way weighted sum (driven by Density = active-tap fraction, Size/geometry, and feedback) not a one-knob function. Phase 1 (high value): in the block-rate per-tap geometry loop, accumulate E = sum(gainL^2 + gainR^2) over active taps, makeup = sqrt(E_ref/max(E,eps)) reference-normalized + clamped, applied as ONE common scalar to BOTH wet channels (per-channel normalization would flatten the azimuth-panned stereo image - stabilize loudness, preserve balance). Partial-strength exponent (<1) so the density swell is not flattened ([[feedback_self_balancing_converges_to_bypass]]). Phase 2 (optional): f(Decay,Connectivity) feedback-tail term modeled on Fabula's Freeze-makeup. Reuses Petrichor tap normalization ([[feedback_multitap_weighted_feedback]]) as the basis + Fabula's diffusion-makeup principle ([[project_fabula_am335x]]). Folds into [[diffusion-makeup-model-notate]]: one principle, two implementations (single-knob vs tap-weight energy). Cheap: ~32 mul-adds + 1 sqrt/div per block, no per-sample cost."""

