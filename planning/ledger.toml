2026-08-05 ROUTING INCREMENTS REWORKED AGAIN (spreadsheet 2.8.3.88). The 2.8.3.85 pass made COARSE
step 5 (a whole filter-A family) and fine step 1. Wrong way round in use: coarse is the DEFAULT
encoder state (EncoderControl.lua:11), so every ordinary turn crossed a whole family per ~2 detents
and landing on a specific filter pair was impossible. User: "current fine should be coarse ...
extrapolate other settings from there."
A discrete list has no fractional positions, so the encoder's resolutions cannot be four step VALUES
the way a continuous dial's are. They become TWO AXES - how many entries a step moves, and how much
travel one step costs:
  shift  -> discreteJumpStep (5 = one filter-A family), for crossing a 50-item list
  coarse -> discreteCoarseStep (1 entry) at threshold 8            <- the default
  fine   -> the same 1 entry at DOUBLE the threshold, so landing is deliberate and cannot overshoot
