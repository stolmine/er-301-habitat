note = "Plan of record: planning/open303-port.md (supersedes open303-port-scoping.md; part of the port-mit-direct backlog). MIT confirmed (License.txt, (c) 2009 Robin Schmidt; attribution kept). Voice = rosic::Open303 with the internal AcidSequencer stripped (run it OFF), driven by ER-301 trig / V-oct / accent / slide inlets. Target: am335x-shippable spreadsheet flagship alongside Ngoma; prototype in catchall, promote after listening. Engine audit: the port is NOT free - ~385KB double wavetables (8 mip-gathers/sample, blows 256KB L2), per-sample pow2 on cutoff, 4x oversampling. Optimization plan (see doc): float + pull the oscillator OUT of the 4x loop + shrinking mip pyramid + derive square from one saw table (-> ~30KB tables) + fast exp2 + approx filter coeffs + 2x(am335x)/4x(CM4) tiers. User-facing name stays generic (no Roland/303)."

