[[item]]
id = "modeselector-gain-moves-bias"
title = "ModeSelector: turning the mod-gain knob moved the mode instead of the gain"
status = "done"
stamped = "2026-08-06T20:19:49-05:00"
area = "ui"
touches = ["mods/spreadsheet/assets/ModeSelector.lua", "mods/biome/assets/ModeSelector.lua"]
attested = """2026-08-06: shipped in v2.8.1 and confirmed working on hardware by the user.
2026-08-06 FIXED (spreadsheet 2.8.4.1, biome 2.2.2.1), hardware confirmation owed.
User: "vitrail got a bug at some point, routing and clock source gain knobs move bias position!"
CAUSE: GainBias:encoder (xroot/Unit/ViewControl/GainBias.lua:808) routes by focus - gain readout
focused -> edit gain, otherwise -> edit bias. ModeSelector:encoder intercepted UNCONDITIONALLY on
`if self.discrete then` and always called stepDiscrete(), which writes self.bias. So with the gain
readout focused, turning the encoder stepped the MODE.
Fix: take the discrete path only when `self.focusedReadout ~= self.gain`; otherwise fall through to
GainBias, which edits what the user is looking at.
HONEST PROVENANCE: the unconditional intercept is ORIGINAL to the class - v2.7.0's ModeSelector has
the same shape, so any discrete selector has had this since discrete mode was added. I did not
introduce it, but I did two things that surfaced it: (1) the rollout took the discrete selector count
from 2 (Parfait, Vitrail) to 15 across both packages; (2) normalizing Vitrail's routing to 0-1 was
done specifically to make it CV-modulatable, which is exactly what makes someone reach for the
mod-gain knob for the first time. So the bug is old and the exposure is mine.
AFFECTED (all now fixed by the one change, since both ModeSelector copies are identical): Canals,
Pecto, Filterbank, Vitrail, Etcher, MultitapDelay, TrackerSeq, Rauschen, MultibandSaturator
(spreadsheet); Discont, LatchFilter (biome).
NOT AFFECTED: the DiscreteStep sub-display controls compare focus against a SPECIFIC readout, so a
focused gain never matches and falls through correctly. Verified.
FIXED IN v2.8.1 (2026-08-06, spreadsheet 2.8.5 / biome 2.2.3), shipped as a hotfix alongside the
DiscreteStep accumulator carry-over. Provenance corrected for the release notes: the gain bug is NOT
a v2.8.0 regression - Parfait's saturation selector shipped discrete in v2.6.2, so it has been live
there for two releases. v2.8.0 widened the exposure from 2 controls to 11."""
verify = { kind = "manual", ref = "on Vitrail's Routing and Clock Src: focus the gain readout, turn the encoder, and confirm the gain moves and the mode does NOT. Repeat on a second selector (Rauschen algorithm) and confirm the bias still steps normally when the gain is not focused." }
note = """Class of bug: a ViewControl subclass overriding encoder() must respect which readout the base
class considers focused, or it edits the wrong parameter.
SWEEP DONE 2026-08-06, three shapes checked across every package:
 (1) GainBias subclasses overriding encoder() - 48 of them. ModeSelector was the ONLY one that
     intercepted without respecting focus; every other either tests focusedReadout/paramFocusedReadout
     or falls through to GainBias.encoder. The 13 sub-display controls converted this cycle compare
     against a SPECIFIC readout, so a focused gain never matches them.
 (2) The adjacent handlers - zeroPressed / cancelReleased / upReleased / enterReleased across the same
     subclasses. All clean: each checks focus or delegates.
 (3) The 22 DiscreteStep call sites - target field assigned, focusable, bounds sane. All sound.
FALSE POSITIVE worth recording so it is not re-investigated: scope's SpectrogramFactory looks like a
blind intercept (no gain check, no fallthrough) but is a plain ViewControl with ZERO gain readouts, so
there is no parameter to steal from; its focusedSlot is only ever "freq" or "amp" and S3 returns early
as read-only. Not a bug, deliberately not "fixed".
SECOND REAL BUG FOUND BY THE SWEEP (fixed, spreadsheet 2.8.4.2): 11 of the DiscreteStep hosts never
called DiscreteStep.reset on focus change, because the regex that added it only matched
`self.focusedReadout = self.<name>Readout` and these assign via a helper (`= readout`) or clear with
`= nil`. Consequence: a part-turn accumulated on one readout carried into the next one focused - turn
5 ticks on `type`, focus `freq`, and it steps after 3 instead of 8. Reset now fires on EVERY focus
assignment including nil. Hosts fixed: BandControl, BandListControl, DelayInfoControl,
FilterListControl, LaretStepListControl, RaindropControl, SegmentListControl, SeqInfoControl,
TimeControl, TransferCurveControl, TransformGateControl."""

[[item]]
id = "controls-discrete-encoder-rollout"
title = "Discrete-control stepping standard: one feel for every integer/discrete control (surveyed)"
status = "todo"
stamped = "2026-08-05T23:05:00-05:00"
area = "ui"
verify = { kind = "manual", ref = "on each target selector confirm one detent = one step regardless of turn speed, threshold ≈ 4×(detents/option) scaled to option count (full sweep ~30-40 detents, ≥2 detents/option)" }
note = """SURVEYED 2026-08-05 - full inventory + the standard at
planning/discrete-control-standard-inventory.md. User: "we should survey all controls that address
integers or discrete values/states, even if these are mapped on 0-1 or otherwise float-style
controls. i would [like] stepping through discrete options to have a standard feel. probably based
on vitrail's settings for the routing options. these include a lot of subdisplay options."
MEASURED ADOPTION - the gap is much wider than the earlier note assumed:
  ModeSelector instances        ~26 across 22 files, only 2 discrete (Parfait, Vitrail)
  files defining their own encoder()  89, only 3 use the accumulate model
  files with a paramMode sub-display  41 (route straight to a Readout - the big block)
  files with an integer dial map      83
THE STANDARD, taken from Vitrail routing as the user asked: a discrete list has no fractional
positions, so the encoder's four resolutions collapse to TWO AXES - entries per step, and travel per
step. coarse = 1 entry at threshold 8 (~2 detents, and coarse MUST be the useful one since it is the
default state); fine = the same 1 entry at DOUBLE the threshold (deliberate, cannot overshoot);
shift = discreteJumpStep, a whole group, only where the list has real internal structure. Every step
is an exact index multiple so nothing can land between entries.
Threshold 8, not the 16 in the older note - 8 is what actually shipped and reads better.
TIER 2 IS THE BIG ONE and was the user's own observation: the paramMode sub-display readouts. They
need the accumulate model in the host control's encoder(), the way scope's SpectrogramFactory
open-coded it. TransformGateControl alone is shared by Larets, Pecto, TrackerSeq and MultitapDelay,
so one fix covers four units.
SEQUENCING: ModeSelector.lua is duplicated in biome + spreadsheet and consumed by ~20 units, so this
is a catalogue-wide regression surface. Do it AFTER v2.8.0 ships, not inside it.

PRIOR NOTE (2026-07-22): planning/todo-archive.md '## Controls Audit'. UNIVERSAL STANDARDIZATION PASS:
discrete-value scrolling is too touchy across essentially ALL habitat controls; standardize on
Parfait's saturation-picker tick sensitivity as THE model. Mechanism (Parfait/ModeSelector,
shipped 2.8.1.11): accumulate the RAW encoder change into encoderSum, step +/-1 only when
|encoderSum| > threshold (=16), then reset - acceleration-independent, deliberate, not twitchy.
The obvious approach (scaling the dial-map step) is wrong: it FIGHTS encoder acceleration so fast
turns still jump. threshold 16 ~= a few detents per step.

DONE so far: Parfait shaper-type; Spectrogram sub-display S1/S2 freq/amp toggles (scope 1.2.6,
open-coded the accumulate-step-reset in the view's encoder() since it is not a ModeSelector).

SCOPE (every discrete selector, not just ModeSelector-based):
- ModeSelector-based (share the patched ModeSelector.lua per package): Pecto patternFader(16)/
  resonator/slope(4), Rauschen algo(11), Filterbank scale, MultitapDelay vol/pan macros +
  grid/stack; Clouds mode(mi), Chime scale(porcelain), Sfera config + Lambda seed(catchall),
  stolmine duplicates. One build per package.
- CUSTOM discrete selectors (open-code the accumulate/threshold-16 in their own encoder handler,
  like Spectrogram): any sub-display toggle, OptionControl-style pickers, ModeSelector siblings,
  and any control that steps through discrete values on encoder. Audit each package's ViewControls.
Standard threshold = 16 unless a control has a strong reason to differ (document it if so)."""

