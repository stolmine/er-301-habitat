[[item]]
id = "switch-1-to-n-unit"
title = "1-to-N switch unit: output selection + output count + passthrough, on the multi-out framework"
status = "todo"
stamped = "2026-08-05T22:20:15-05:00"
area = "units"
verify = { kind = "manual", ref = "a unit that takes the chain input and routes it to exactly one of N sub-outputs, with a selectable destination, a settable destination count, and a passthrough toggle controlling whether the chain continues to the right; no click at the switch point; setting round-trips" }
links = { depends_on = ["multiout-framework-quadlfo"] }
note = """User idea, 2026-08-05: "a simple 1 > N switch, a unit with three controls. 1) output
selection 2) number of outputs 3) passthrough. this would dynamically adjust number of outputs
exposed via multiout framework, and allow signal from the left to pass through to the right or not.
input just comes from the left."
BLOCKING CONSTRAINT, read from the framework docs BEFORE any code:
docs/multi-output-units-author-guide.md:197 states plainly - "The framework today assumes FIXED
sub-out count declared at Unit init." The count comes from the LENGTH of args.subOutLabels, which is
set in init() before Unit.init(self, args) runs, alongside args.channelCount. Confirmed against all
three in-repo multi-out units (JF, Canals, Mirror): every one declares a fixed list and none varies
at runtime. So control (2) as literally specified - dynamically adding/removing EXPOSED outputs on an
inserted unit - is not buildable without a firmware-side framework change.
THREE WAYS TO GET THE INTENT, decision owed:
 (a) FIXED MAX + ACTIVE RANGE. Declare the maximum once; the "outputs" control bounds which
     destinations the selector can reach and the rest go silent. One unit, keeps all three controls,
     but the picker still shows every slot including the inactive ones.
 (b) VARIANT FAMILY (Switch 4 / 6 / 8), count fixed per variant, no count control. Exactly the
     habitat precedent already used by Fade Mixer 4/6/8 and Spectrogram 3/4/6, and the cleanest UI;
     costs the count control.
 (c) Extend the framework to a dynamic count. Firmware-side, far bigger than the unit.
DESIGN NOTE worth keeping either way - WHAT SUB-OUT 1 SHOULD BE. All three existing habitat multi-out
units reserve Out1/Out2 as the chain L/R pair and start their real outputs at Out3. That resolves the
passthrough question neatly: make Out1/Out2 the PASSTHROUGH (input, or silence when the toggle is
off) and put the N switch destinations at Out3..Out(N+2). Two payoffs - the passthrough control then
has an obvious home, and on VANILLA firmware (where sub-outs 3+ are invisible, per the guide's
compatibility contract) the unit degrades into a harmless passthrough instead of a dead end.
Budget the count accordingly: N destinations needs N+2 framework outputs, and the guide's practical
ceiling is single digits, so N=6 (8 outputs) is comfortable and N>=8 starts fighting the M6 cycler.
STEREO/MONO ADAPTATION IS BUILDABLE - VERIFIED (user asked 2026-08-05: "perhaps the unit can adapt
based on stereo vs mono chain though?"). It can, and the mechanism is exact:
Chain/Base.lua:441-444 builds the unit args as { chain = self, depth = ..., channelCount =
self.channelCount }, so when the unit's OWN init(args) runs, args.channelCount is already the HOST
CHAIN's count (1 mono / 2 stereo) - it only becomes the unit's forced fan-out when the unit
overwrites it. Unit/init.lua:28 then resolves `args.channelCount or chain.channelCount`, and
args.chain is passed too, so either route works. Nothing here needs a framework change.
So the sub-out list can be built per-insert:
    function Switch:init(args)
      local stereo = (args.channelCount or 1) > 1          -- host chain, not ours yet
      local labels = stereo and {"thru", "thru R"} or {"thru"}
      for i = 1, kMaxDest do labels[#labels + 1] = tostring(i) end
      args.subOutLabels = labels
      args.channelCount = #labels
      Unit.init(self, args)
    end
Payoff: a MONO chain does not need the "thru R" slot, so it spends N+1 outputs where a stereo chain
spends N+2 - one more destination for the same fan-out budget, and a tighter M6 picker. This is
still a per-INSERT decision, not a live one: the count is fixed once the unit exists, so re-deciding
after insertion would still need the framework change described above.
DECLICK: switching a live signal between destinations steps bothDECLICK: switching a live signal between destinations steps both the outgoing and incoming outs.
Reuse the pattern just shipped in FadeMixer (see [[fademixer-snap-mode]]): per-destination gains
chasing 0/1 targets through a ~3 ms one-pole, coefficient chosen at block rate so the per-sample path
stays branchless.
Also settle whether selection is CV-modulatable - if so it wants an od::Inlet or a ParameterAdapter,
not an od::Option ([[feedback_inlet_vs_parameter_audio_rate_mod]], [[feedback_option_vs_parameter]]).
Package: biome fits the utility character (it already hosts Fade Mixer and Gridlock)."""

[[item]]
id = "fademixer-snap-mode"
title = "Fade Mixer: Smooth/Snap config option so the family works as N-to-1 switches too"
status = "done"
stamped = "2026-08-06T20:19:49-05:00"
area = "units"
touches = ["mods/biome/FadeMixer.cpp", "mods/biome/FadeMixer.h", "mods/biome/assets/FadeMixerFactory.lua"]
attested = """2026-08-06: shipped in v2.8.0.
2026-08-05 SHIPPED (biome 2.2.1.14), hardware audition owed. User: "i'd like to add a
config option that selects between smooth and 'snap' so that they can be faders as well as simple
N > 1 switches." All three variants (4/6/8) get it from the shared factory.
od::Option mMode (1 = Smooth default, 2 = Snap) per [[feedback_option_vs_parameter]], exposed as an
OptionControl in the unit config menu, enableSerialization in the ctor so it round-trips.
SELECTION LAW: Snap picks by NEAREST CENTRE - sel = round(fade*(n-1)) - not by equal 1/n slices.
That is deliberate: it selects exactly the input Smooth would be loudest on, so toggling the option
never jumps to a different source and a given fade position means the same thing in both modes.
Documented consequence: the two END inputs own half-width zones (at n=4, in0 holds fade 0..0.167
while in1 holds 0.167..0.5). If equal-width switch zones are wanted instead, that is a one-line
change to sel = min(n-1, (int)(fade*n)) - flagged for the audition.
DECLICK: a hard switch mid-waveform steps the output and clicks, so the live per-channel gains chase
their targets through a one-pole with a 3 ms time constant. Measured: complementary gains cross at
0.368/0.632 at 3 ms and the outgoing input is at -58 dB by 20 ms.
SMOOTH IS BIT-IDENTICAL: the coefficient is chosen at BLOCK rate (1.0 in smooth, the ramp in snap)
so the per-sample path has no runtime branch inside it (per
[[feedback_runtime_branched_dsp_dispatch]]), and at coeff 1.0 the gain equals the target on the very
first sample. Verified against a port of the old law: 0 mismatches over n=2..8 x 101 fade positions.
Gains live in a CLASS-MEMBER float[8], not a stack local ([[feedback_neon_intrinsics_drumvoice]]).
SWIG wrapper force-cleaned - the new Option + float[8] change sizeof(FadeMixer)
