2026-07-17d Deep-dive done (~40 captures): RESONANCE Q law (1.1->35, no self-osc); DISTORTION fully characterized (input VCA, saturating nonlinearity, out ceiling ~-20dBFS, soft knee ~6dB below, odd-dominant symmetric clip; needs hot drive to reach it); GAIN STAGING resolved (Gain A = A-only input amp, A->B normal taps pre-gain; Gain B = between-filters drive in series); CLK-SRC mechanism confirmed (selects which channel clock tunes the filters: clk-A drives B to A freq, clk-B to own, clk-both = clock-blend not fast AM/XOR). All in findings.md. REMAINING: series across modes, distortion mode-dependence, aliasing deep-dive (hot send @ low cutoff), cutoff-law refinement (BP-center track), B-confirmation. Then model build (one filter + SC clock + saturating input + clock-mux).

