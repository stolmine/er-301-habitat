[[item]]
id = "parametric-band-atom"
title = "house: ParametricBand atom - one constant-Q EQ band, bell or shelf, with AW level-dependent nonlinearity"
status = "done"
stamped = "2026-08-20T18:38:27-05:00"
area = "dsp"
verify = { kind = "manual", ref = "swept measurement confirms constant half-gain bandwidth across gain, exact bypass at 0 dB, and both Q laws behaving differently" }
attested = """Built and MEASURED 2026-08-20. tools/parametric-band-test compiles the real header with shipping flags and sweeps sine probes; all 8 checks pass.

Headline numbers: half-gain bandwidth 1.36 octaves at +6, +12 AND +18 dB - identical to three significant figures, which is the log-symmetry claim actually verified rather than asserted. Bell peak lands within 0.00 dB of the requested gain at 100 Hz, 1 kHz and 6 kHz. 0 dB is bit-identical bypass over 96000 samples. Shelves reach gain and pass the far side within 0.03 dB. Proportional-Q narrows 0.93 -> 0.56 octaves as gain rises while constant-Q does not move. Finite and bounded at every extreme including 30 Hz in float recursion. Drive adds 11% THD and sits at the float noise floor (0.013%) when off.

DESIGN DECISION, deviating from the design note. ochre-character-eq says to lift Airwindows BiquadStack's single-band kernel. Only the NONLINEARITY was lifted (dis = fabs(a0*(1+out*nonlin)) clamped to 1, i.e. the input coefficient modulated by instantaneous level, no transcendentals). The STRUCTURE is a TPT state-variable filter instead, because BiquadStack is a stack of three BANDPASSES and cannot make a shelf - and a four-band EQ needs shelves for LF and HF. The SVF yields LP/BP/HP from one structure so bell and shelf are the same code with a different tap, is unconditionally stable at high Q, and is already proven on am335x here (Breccia uses the same kernel).

A REAL BUG THE MEASUREMENT CAUGHT. The naive SVF bell (out = in + (G-1)*k*BP, k = 1/Q) is NOT constant-Q: its half-gain bandwidth measured 1.88, 2.51 and 3.27 octaves at +6/+12/+18 dB. Fix is one line - divide the SVF damping by A = 10^(dB/40), which reproduces the RBJ peaking transfer exactly, because the tap gain (G-1)*k then makes the numerator s*A/Q. At 0 dB A is 1, so exact bypass is unaffected. This would have shipped silently without a swept measurement.

TWO TEST BUGS worth remembering, both of which first read as filter faults: (1) bandwidth for a peaking EQ is measured at HALF-GAIN, not 3 dB below peak - those coincide only at +6 dB, so at +18 a -3 dB reading sits near the tip of the bell and must read narrow regardless of the filter; the design note's '+/-3 dB points' phrasing is the special case. (2) A THD probe must land on an exact DFT bin: 1000 Hz at N=32768/48k is 682.67 periods and leaked as 0.04% phantom THD on a provably linear path.

CONSUMERS: ochre-character-eq (four bands) and strata-channel-strip's EQ section. Neither is built yet."""

[[item]]
id = "pop3-dynamics-atom"
title = "house: Pop3Dynamics atom - linear-domain compressor + phase-based gate, AW Pop3 port"
status = "done"
stamped = "2026-08-20T18:38:27-05:00"
area = "dsp"
verify = { kind = "manual", ref = "measured: exact bypass at ratio 0, monotonic gain reduction, gate reads the uncompressed signal, libm-free on am335x" }
attested = """Built and MEASURED 2026-08-20. tools/pop3-dynamics-test compiles the real header with shipping flags; all 11 checks pass on the first run.

Numbers: ratio 0 on both stages is bit-identical bypass over 96000 samples. Gain reduction rises monotonically 0.00 / -3.85 / -8.25 / -12.64 / -14.79 dB across the ratio control. Transfer curve monotonic with no fold-back (unity below threshold, compressing above). Attack timing 59 samples fast vs 657 slow. Gate passes 0.90 intact and takes 0.02 to zero.

THE DISTINGUISHING BEHAVIOUR IS VERIFIED, not assumed: with heavy compression driving the output to 0.0009, the gate phase still reads 7.950, far above pi/2. The gate reads the UNCOMPRESSED signal, so squashing the input does not drag the gate shut. That is the property most easily lost in a port and it now has a test.

THREE ADAPTATIONS, no character change. (1) libm sin replaced by a 7th-order odd polynomial over [0, pi/2], measured worst error 1.57e-04 against libm - the argument is never outside that range, and libm sin costs 300-500 ns on am335x during every sample of a gate close. (2) doubles to float on the sample path, coefficients stay double at bake. (3) AW's 32-bit dither dropped: it shapes truncation noise for a VST host writing 32-bit output, and the ER-301 path is float and never truncates here.

VERIFIED ON REAL ARM CODEGEN rather than asserted: a probe consuming both new atoms compiles with -mcpu=cortex-a8 -mfpu=neon -O3 -ffast-math and has NO libm relocations in the sample loop and zero NEON alignment hints.

STEREO LINK is preserved and is two distinct behaviours, which the header spells out because they are easy to conflate: the COMPRESSOR link is asymmetric (the less-compressed channel is pulled toward the other by one attack step, so a hard pan still moves), while the GATE is genuinely SHARED - one variable triggered by either channel. Measured: L and R gate phases converge to the identical value under a hard-panned input.

NO MAKEUP GAIN, by design - ConsoleX supplies it externally and Channel Strip's Out section must too. Sample-rate scaling carried from AW's overallscale, since every time constant is 44.1 kHz-calibrated; strata-channel-strip flags that class of bug.

CONSUMER: strata-channel-strip's Comp section. Not built yet."""

[[item]]
id = "stft-frontend-atom-built"
title = "spreadsheet: StftFrontEnd atom - shared STFT analysis/resynthesis scaffolding, perfect-reconstruction verified"
status = "done"
stamped = "2026-08-20T18:38:27-05:00"
area = "dsp"
verify = { kind = "manual", ref = "analysis followed immediately by resynthesis with no processing is transparent, with its noise floor measured and documented" }
attested = """Built and MEASURED 2026-08-20. mods/spreadsheet/atoms/StftFrontEnd.h, harness tools/stft-frontend-test, 9 checks pass.

THE GATING ACCEPTANCE TEST from stft-frontend-atom is met with a measured number rather than a claim: analysis-then-resynthesis with NO processing gives a residual of -139.9 dB on a tone, -140.4 dB on white noise and -143.8 dB on impulses, peak error 1.8e-07. That is the float noise floor, and it is the documented figure every consumer's 'depth/morph = 0 is a bit-identical bypass' claim now rests on. Reconstruction delay is 1024 samples.

Also measured: the COLA constant is DERIVED from the window rather than hard-coded, and comes out to 0.000651041686 against the originals' literal 1/(N*1.5) = 0.000651041686 - identical, so the literal was right, but changing kHop can no longer silently leave a wrong constant behind. Halving every bin gives exactly -6.021 dB. Level drift over 200 frames is +0.0000 dB. pffft's real layout is confirmed by probe rather than by comment: a DC input puts 256.00 in slot0[0] and 0.00 in slot0[1]; a Nyquist input does the reverse.

SCOPE QUESTION SETTLED as the item directed: the atom is a PAIR of calls the unit drives (push/gather/forward ... inverseAndOverlap/consume/tick), not one class with a processing callback. That suits assay-audio-listener, which analyses but never resynthesises.

EXTRACTED, not designed. SpectralFreeze and Sediment had independently arrived at identical scaffolding - same geometry, same Hann build in double, same COLA constant, same ring advance - and differed only in what happens between forward and inverse. A THIRD implementation was checked: zaum's STFTSpectral.h (933 lines) independently uses N=1024 hop=256, the same geometry. Three agreeing is why the geometry is fixed rather than parameterized. STFTSpectral is not a donor: it is one algorithm with the transform embedded, not a front end.

PACKAGE CORRECTED MID-BUILD. It was first written into house, which was wrong - the item says to put it where the first consumers land, and house has no spectral consumer at all. Palimpsest and Anneal are spreadsheet units and Sediment already lives there, so it moved to spreadsheet. Assay targets biome and will need this vendored across, exactly as pffft already is in four packages.

am335x VERIFIED ON REAL CODEGEN with construction and the sample loop in separate functions so attribution is unambiguous: the only libm call is the window-build cos, and it is in the constructor. The hot loop has no libm at all and zero NEON alignment hints. House's pffft was removed again when the atom moved; house builds clean.

NOT DONE: SpectralFreeze and Sediment are NOT yet refactored onto this. The atom is proven and available for new consumers; converting the two existing units is a separate change that should be gated on byte-identical output before and after."""

[[item]]
id = "parametric-eq-unit"
title = "house: Parametric EQ - four-band unit on the ParametricBand atom"
status = "done"
stamped = "2026-08-20T18:38:27-05:00"
area = "units"
verify = { kind = "manual", ref = "all gains at 0 dB is an exact bypass; each band reaches its gain at its own centre; Colour changes the gain range; shelf and bell differ" }
attested = """Built and MEASURED 2026-08-20, house 0.1.1.1. tools/parametric-eq-test drives the real four-band object; emu test 9D-parametric-eq covers insert, per-band ENTER expansions and delete.

Measured: all gains at 0 dB is bit-identical through all four bands (0 of 51200 samples differ). Each band reaches +12.00 dB at its own centre with at most 1.5 dB leaking into the others. Brown clamps a +18 request to exactly +15.00 dB and Black passes +18.00, so Colour changes range as well as Q law. Mix at 0.5 gives 2.4905 against a linear prediction of 2.4905. LF shelf holds +12.18 dB at 40 Hz where the bell has fallen to +1.22.

WHY IT EARNS A SLOT NEXT TO THE FIRMWARE'S EQ3, measured not asserted. EQ3 asked for +12 dB at mid delivers +9.9 dB at 250 Hz and +9.1 dB at 4 kHz - its mid band is over six octaves wide - and it overshoots to +13.1 dB. It is a three-way crossover splitter with NO Q at all and its two frequencies are crossover points, not band centres. This unit at Q=4 lands 12.00 dB and is within 0.4 dB of flat an octave away. User confirmed Q control alone justifies the unit.

DELIBERATE NON-GOAL: EQ3's three gains are Inlets and take audio-rate CV. Here everything is block-rate through ParameterAdapters. Twelve inlets to duplicate a capability the firmware already ships is poor value; reach for EQ3 when the gain itself is the modulation target. Recorded so it is not later mistaken for an oversight.

A REAL BUG THE HARNESS CAUGHT, in the band atom, found only at extreme settings: four bands at +18 dB with Q=10 and full drive produced NaN. Cause: the level-dependent nonlinearity was modulating a2, directly copying BiquadStack. In AW's direct-form biquad a0 is an INPUT coefficient, so inflating it only boosts level; in a TPT SVF a2 sits in the FEEDBACK path (both v1 and v2), so inflating it MOVES THE POLES. At Q=10 proportional at +18 dB, k falls to 0.0142 and a2 at 100 Hz is 0.0065 while the clamp allowed 1.0 - 153x the coefficient it replaced, and the filter left the unit circle. FIX: the saturation now acts on the band's output TAP, outside every feedback path, so it cannot move a pole. Same musical idea, still no transcendental, and nonlin 0 leaves the tap exactly untouched.

A TEST-INFRASTRUCTURE BUG worth remembering, found at the same time: std::isfinite is UNRELIABLE under -ffast-math, because the compiler is told to assume NaN and Inf never occur and folds the check to constant true. The diagnostic printed 'finite: YES' on output that was entirely NaN. All five DSP harnesses used it. They now inspect the exponent bits via memcpy, which no optimization can elide.

EFFICIENCY PASS 2026-08-20, measured on real Cortex-A8 codegen by counting inner-loop instructions, not estimated.

  sample-major scalar   41.5 instr per band per channel   332 per sample, stereo 4-band
  band-major scalar     29.0                              232
  band-major NEON       30.0 per band for BOTH channels   120

Net 332 -> 120, a 2.8x reduction. Three separate fixes:

(1) THE DIVIDE. The tap saturator was 1/(1 + |tap|*n), which emitted one vdiv.f32 per band per channel - eight per sample stereo. An A8 VFP divide is ~14 cycles and does not pipeline: 8 x 14 x 48000 = 5.4 M cycles/s, 1.1% of a 500 MHz A8 on divides alone. Replaced with a clamped linear rolloff, same behaviour class, multiply and max only. Zero vdiv remain.

(2) THE PER-SAMPLE COMPARES. The branchless tap select was evaluating (shape == X) ? 1 : 0 inside the sample loop - 50 vcmpe.f32 per sample to re-decide something fixed for the whole block. The three selectors are now baked floats in the coefs struct. 12 compares -> 4 in the band kernel.

(3) REGISTER SPILL, the biggest one. Four bands hold 32 coefficients, which exceeds the 32 VFP s-registers, so a sample-major loop reloaded them every sample: 45 vldr per sample. Running ONE band across the whole block keeps its 8 coefficients resident. That alone was 41.5 -> 29.

Then NEON: L and R are independent and elementwise, so 2-wide is the natural axis and it is the same axis EQ3 uses. ParametricBandStereo carries a scalar fallback so x86 and the emulator still build and the harness compares both paths. State and scratch are CLASS MEMBERS, never stack locals (feedback_neon_intrinsics_drumvoice); check-neon-hints is clean on every house object.

HONEST COMPARISON WITH EQ3: EQ3's whole kernel is 39 instructions per sample for 3 bands stereo, i.e. 13 per band stereo, against our 30. So we are ~2.3x per band - for a band that has Q, shelf/bell switching and level-dependent saturation, none of which EQ3 has. A one-pole with no Q is genuinely less work; the ratio is the price of the feature that justifies the unit.

STILL OWED: an actual hardware CPU percentage. Instruction counts are a proxy, and a good one for a loop with no memory pressure, but they are not a measurement.

DRIVE FIX 2026-08-20, reported by the user as "drive does not appear to be hooked up". It WAS wired, but three separate defects made it near-inaudible:

(1) NOTHING AT FLAT GAINS, and this stays that way by user decision. A band contributes gain*tap and gain is exactly 0 at 0 dB, so Drive cannot act on a flat EQ. That is the same property giving the exact-bypass guarantee. Options offered were a global output stage or a rename; user chose PER-BAND ONLY, matching the design note's "per-band level-dependent nonlinearity" and avoiding overlap with Parfait and the Console0 atoms. Consequence to document for users: Drive needs a band boosted before it does anything.

(2) ~8x TOO WEAK: measured 0.29% THD at a realistic -12 dBFS with a +12 dB band, where a couple of percent is musical.

(3) THE CURVE FOLDED BACK. sat = 1 - |tap|*d floored at 0.25 degenerates into a constant gain once clamped, so THD FELL as drive rose past a point (5.38% -> 3.66% at the loudest corner). Replaced with a parabolic soft-clip y = t - d*t*|t| clamped at its vertex 1/(4d), which is monotonic by construction and still multiply-only.

FINAL: kDriveScale 0.5, monotonic in BOTH level and drive across the whole grid, full Drive reading 0.31% at -26 dBFS, 1.73% at -12 dBFS and 8.07% near full scale.

TWO CALIBRATION ERRORS MADE AND CAUGHT, both by measurement rather than review. First, the scale calibrated for the old gain-factor curve was carried onto the parabolic one unchanged, overshooting to 35-71% THD. Second, the recalibration probed an OCTAVE OFF-CENTRE and picked 6.0, which at the band centre - where the bandpass peaks and where a user listens when boosting - gives 71%. The operating point mattered more than the curve. Correct point is fc == probe.

THE TEST BUG THAT LET THIS SHIP. The atom harness probed a single hot point (amp 0.9, Q 2) and reported a healthy 17% THD while the control was inaudible everywhere real and folded at the top. Measuring the ceiling is not measuring the working range. It now sweeps a 4x5 grid of drive x level and asserts monotonicity in BOTH axes plus audibility at -12 dBFS - which is exactly what caught both calibration errors above, immediately."""
