[[item]]
id = "kryos-spectral-freeze-rebuild"
title = "Kryos: replace the biquad-bank engine with a phase-vocoder spectral freeze, single voice"
attested = "Closed 2026-08-20. Engine replaced wholesale with an STFT phase vocoder and shipped as the biome unit Spectral Freeze (biome 2.2.4.1); the standalone kryos package is retired. Verify criteria met: freeze sustains a full spectrum not 12 partials, all 5 Movement modes differ, and Ether drives 11 partials down to 2 with harmonic share rising 0.23 to 0.76 - all asserted by tools/spectral-freeze-test (7 checks). No user-facing string names any third-party product. NOT MET: am335x CPU is not measured; see kryos-spectral-freeze-cpu."
status = "done"
stamped = "2026-08-20T15:56:12-05:00"
area = "dsp"
verify = { kind = "manual", ref = "freeze sustains a full spectrum rather than 12 partials; Movement audibly differs across all 5 modes; lowering Ether tends the result toward a few pure tones per the reference behaviour; am335x CPU measured and recorded; no user-facing string names any third-party product" }
note = """Design: planning/kryos-spectral-freeze.md (2026-08-13). User goal: ape the Disting EX Spectral Freeze, SINGLE VOICE (the 4-voice structure is explicitly not wanted). Read from the disting EX user manual 1.26 chapter 24 pp.171-176.
THE CURRENT ENGINE IS NOT A SPECTRAL FREEZE. mods/kryos/Kryos.cpp has NO FFT at all: it is 12 fixed biquad bandpass bands, an envelope follower each, and one held sine per band on freeze. That is a 12-partial static additive resynth. The manual explicitly names this failure mode ('a completely static sound ... doesn't give you the sort of textural sustain that is often wanted') for the case of a single captured frame, and the current unit is weaker than that. Replace the engine; keep the name, the Lua shell and the package.
ATTRIBUTION MUST CHANGE WITH IT: assets/toc.lua credits 'Emilie Gillet / ER-301 port by stolmine' and Kryos.cpp:2 says 'inspired by Mutable Instruments Clouds, code by Emilie Gillet'. Once the biquad bank is gone that is false and would misattribute work. Rewrite both. Never use the deadname.
FEASIBILITY IS GOOD, the scaffolding exists: Sediment.h already runs an am335x STFT at kFFT 1024 / kHop 256 / pffft / COLA overlap-add, est 2-4% CPU, and pffft already ships in spreadsheet. A freeze is CHEAPER than Sediment because while frozen there is no analysis FFT, only synthesis.
TWO HARD CONSTRAINTS. (1) Trig: a textbook phase vocoder does polar-to-rect per bin per hop, ~192k sin/cos per second at 512 bins and 187.5 hops/s, unaffordable at the measured 300-500 ns am335x sin. Escape: for a FREEZE the per-bin phase advance is CONSTANT, so precompute one complex rotation per bin at construction and advance by a single complex multiply per bin per hop - no trig in the loop, SoA and NEON-friendly. (2) Memory forces a scope cut: the reference stores up to 128 frames, which as complex spectra is 512 KB against a 256 KB L2. Use MAGNITUDE-ONLY history at 32 frames = 64 KB = ~170 ms, so Depth maps 1-32 not 1-128. Magnitude-only is the mechanism, not a compromise: regenerated phase is what makes the loop wrap interpolated rather than a splice.
ETHERIZATION IS THE SIGNATURE FEATURE, not a trim - it is what gives the algorithm its identity. Manual defines behaviour only: lowering it 'progressively drops out components judged to be transient', tending 'towards a small number of pure tones which represent the strongest harmonics'. Method: per-bin steadiness score across the history frames (temporal mean over variation), threshold swept by the control. Runs ONCE PER FREEZE over 32x512, not per sample, so it is free.
DROPPED: 4 voices, Freeze target/Auto, per-voice gain/pan/shift, MIDI notes, and the built-in delay+reverb (Fabula/Petrichor/Network already cover those).
MOVED INTO BIOME 2026-08-13 as the unit "Spectral Freeze" (moduleName SpectralFreeze), biome 2.2.4.1; the standalone kryos package is RETIRED and mods/kryos deleted (recoverable from git). Class is now stolmine::SpectralFreeze in mods/biome/SpectralFreeze.{h,cpp}; harness moved to tools/spectral-freeze-test; emu test is now er-301/tests/emu/94-spectral-freeze-insert-smoke.test. The old name "kryos" survives ONLY as a toc search keyword per the index-vs-identity rule. Moving it required three things biome lacked: pffft vendored in, a .c build rule, and -fno-tree-vectorize extended to LINUX (biome had it for am335x only, and without it the double-sin LUT vectorizes into libmvec and the .so will not load). Also added -MMD -MP header deps to biome while there. Was built as kryos 1.0.0.5 (1.0.0.4 + energy preservation): ENERGY PRESERVATION was needed because Ether and Shift were both secretly LEVEL controls - measured -4.1 dB across the Ether sweep and an 11.4 dB SWING across Shift (-7.2 dB at -24 ST, +4.2 dB at +24 ST, asymmetric because a downshift reads from the quieter top of the spectrum and loses content off the end while an upshift stretches loud low content over more bins). Fix accumulates frame energy before and after gate+shift and scales by sqrt(ratio), capped 8x and one-pole smoothed ~30 ms. Now -1.8 dB and 2.2 dB respectively. THIS IS ALSO THE BLOOM: holding total energy while discarding all but a few bins necessarily makes the survivors much louder, so they fill the space the transients vacated rather than leaving a hole - the wanted behaviour falls out of the normalization and needed no separate mechanism. Original 1.0.0.4 notes: engine replaced wholesale with an STFT phase vocoder, pffft copied into the package, biquad bank gone, Lua rebuilt around Freeze/Depth/Rate/Offset/Ether/Attack/Release/Shift/Mix plus a Movement menu option. Functional harness tools/kryos-test (7 checks) all passing; both arches build; NEON hints clean; emu insert smoke passes. STEP 7 (hardware CPU + listening pass) IS THE ONLY THING LEFT. Three bugs the harness caught, all recorded in the design doc: (1) the freeze collapsed to EXACT silence when input stopped, because analysis kept overwriting the magnitude history while frozen - fix is that the FFT still runs every hop but the history ring is written only while NOT frozen; (2) -fno-tree-vectorize was missing for LINUX, so GCC vectorized the double-sin LUT loop into libmvec (_ZGVbN2v_sin) and the .so failed to load with undefined symbol on insert; (3) kryos had no -MMD -MP header dep tracking at all. Also: editing mod.mk does not invalidate objects, and make kryos-clean deletes the WHOLE testing/<arch> tree not just the package. STEP 0 DONE 2026-08-13, tools/kryos-proto/freeze.py, results in the design doc section 6a. Four measured decisions that bind the C++: (a) store TRUE instantaneous frequency per bin at capture, +2 KB once - bin-centre rotation measured 3.6x worse envelope wobble (0.615 vs 0.172) because adjacent bins of one partial beat; (b) Ether must score steadiness*LEVEL not steadiness alone - the steadiness-only version was completely inert because 492 of 513 bins are noise floor inside a 0.039-wide score band; corrected it goes 56 partials to 1 with harmonic share 0.23 to 0.76; (c) all 5 Movement modes verified distinct; (d) pitch remaps magnitude AND rotation together with out-of-range bins silenced, worst error 0.50 ST. ORIGINAL BUILD ORDER: 0 offline Python prototype FIRST (Etherization and the 5 Movement modes are sound questions - this was right for Sediment and Breccia), 1 lift Sediment's STFT scaffolding, 2 capture + rotation table, 3 envelope/mix/gate = first audible milestone, 4 Movement/Rate/Depth/Offset, 5 Etherization, 6 pitch shift, 7 hardware CPU + listening."""

[[item]]
id = "kryos-load-hang"
title = "Kryos (spectral freeze): hangs hardware on load — isolate emu vs hardware"
attested = "Closed 2026-08-20: DOES NOT REPRODUCE. The user ran it on hardware 2026-08-13 and the unit loaded and ran fine. Emulator was clean too. The static pass ruled out vectorization, NEON hints, stale objects, unbounded loops and allocation size. The engine has since been replaced entirely and the kryos package retired, so the original artifact no longer exists to hang."
status = "done"
stamped = "2026-08-20T15:56:12-05:00"
area = "dsp"
verify = { kind = "manual", ref = "insert Kryos in the emulator first: if it hangs there it's a DSP bug; if only hardware hangs it's am335x-specific. Then fix and confirm clean insertion on hardware" }
note = "planning/todo-archive.md 'Bugs/Kryos', '## Kryos'. High priority: blocks a multiband spectral-freeze unit (per-band freeze gates on the crossover engine). DOES NOT REPRODUCE: user ran it on hardware 2026-08-13 and the unit loads and runs fine. Keep the emu test as a regression guard; if it ever returns, the crash-diagnostics procedure below is the route. ISOLATION DONE 2026-08-13, no longer blocked. Emulator is CLEAN: new test er-301/tests/emu/94-kryos-insert-smoke.test installs the package, inserts the unit, runs 360 frames and removes it, all passing. So this is am335x-specific, not a DSP bug. Static pass also came back clean and RULES OUT the usual suspects: -fno-tree-vectorize IS applied in mods/kryos/mod.mk; check-neon-hints clean on both Kryos.o and kryos_swig.o; the shipped libkryos.so is byte-identical to a forced clean rebuild so it is not a stale-object sizeof bug; process() has NO unbounded loops (every loop is b<NUM_BANDS or i<FRAMELENGTH, no while, no recursion) so a spin in the DSP is ruled out by control flow; Internal is ~12 bands of scalars (no FFT despite the 'spectral' label, ~800 B) so it is not an allocation-size problem; Kryos.lua uses only stock GainBias/Gate with no custom graphic. NEXT STEP is a hardware capture, not more code reading: arm BOTH toggles in Admin > Settings > General ('Enable crash diagnostics?' AND the separate 'Enable UI hang detection?', both default OFF), reproduce, then read Admin > Crash Reports and run tools/symbolize_crash.py. The facility covers this exact failure class - audio-thread heartbeat plus am335x watchdog for freezes the exception hook never sees, naming the spinning PC, with a package-bounded module map so a Kryos address symbolizes. UNVERIFIED LEAD, do not treat as diagnosis: heldEnv decays exponentially toward zero and am335x links -nostdlib -nodefaultlibs, so the crtfastmath.o that normally sets FTZ is absent and denormal ops may trap to slow support code. ALSO PIN DOWN what 'on load' means - insert, first audio, or first freeze gate - since the emu survives insert plus 360 frames of audio."

