[[item]]
id = "larets-random-step-advance"
title = "Larets: random step-advance mode (sequential/random, never the same step twice in a row)"
status = "wip"
stamped = "2026-08-05T21:26:10-05:00"
area = "seq"
touches = ["mods/spreadsheet/Larets.cpp", "mods/spreadsheet/Larets.h", "mods/spreadsheet/assets/LaretOverviewControl.lua"]
attested = """2026-08-05 (spreadsheet 2.8.3.83): SHIPPED, emu-installed, user audition owed.
Scope narrowed by the user: sequential/random only (Brownian dropped), and "the only
intelligence I want on the step control is that it should never pick the same step twice
in a row". Implementation: od::Option mStepMode (1=random, 2=sequential, default
sequential) per [[feedback_option_vs_parameter]], enableSerialization in the C++ ctor +
Lua. The advance picks an OFFSET in [1, wrapLen-1] from the current step rather than an
absolute index, so an immediate repeat is structurally impossible and the choice stays
uniform over the other wrapLen-1 steps; wrapLen==1 falls through to the sequential
advance (no other step exists). Verified offline over 200k advances at every wrapLen
1-16: 0 repeats, visit min/max spread 0.97-1.00, no out-of-range step. Reset still
forces step 0 in both modes. Both arches build, Larets.o 0 NEON suspect hints,
graphic-virtual lint OK, linux pkg installed to emu."""
verify = { kind = "manual", ref = "in the emu: toggle sub1 of the Larets overview sub-display, confirm the indicator lights for random, that the sequence audibly stops advancing in order, that no step ever fires twice consecutively, and that the mode survives quicksave/reload" }
note = """planning/todo-archive.md '## Larets'. UI: the toggle REPLACED the skew readout in
slot 1 of the overview paramMode sub-display (user's call, 2026-08-05); skew is unchanged
and still reachable as its own GainBias control in the overview expansion and as the
overview control's own encoder target. NOT done (deliberately out of the narrowed scope):
Brownian mode, and the cross-pollination to Excel(TrackerSeq)/Ballot(GateSeq)/Etcher -
that port still wants an audit of downstream consumers that assume a monotonic mStep."""

