verify = { kind = "manual", ref = "every control with a shift-toggled param subdisplay either expands on ENTER or has a recorded reason not to; inventory in the note re-runs clean" }
note = """User-reported 2026-08-18, with Larets' Mix as the example. INVENTORY DONE, fixes not started.

THE RULE (feedback_control_expansion_views): a control expands on ENTER if and only if the unit's onLoadViews layout table declares an entry named after that control's key, listing the sub-param faders. No entry means SHIFT reveals sub-controls but ENTER does nothing, which reads as a dead button.

METHOD: 42 control classes in the tree contain setParamMode or paramSubGraphic, i.e. they carry a shift-toggled sub display. Cross-referencing every instantiation of those classes against its unit's layout table gives 38 such controls in unit files, of which 14 have NO expansion entry. 4 of the 14 are in mods/stolmine, which is NOT BUILT (no Makefile entry, no package artifact, 21 units against spreadsheet's 23, files diverged) and appears to be an unshipped legacy twin of spreadsheet - see the separate observation below. That leaves TEN live gaps.

LIVE GAPS
  spreadsheet Etcher         xform     TransformGateControl
  spreadsheet Fabula         xform     TransformGateControl
  spreadsheet GateSeq        xform     TransformGateControl
  spreadsheet Larets         xform     TransformGateControl
  spreadsheet MultitapDelay  xform     TransformGateControl
  spreadsheet Pecto          xform     TransformGateControl
  spreadsheet TrackerSeq     xform     TransformGateControl
  spreadsheet GateSeq        ratchet   RatchetControl
  spreadsheet Larets         mix       LaretsMixControl        <- the reported case
  catchall    Sfera          cutoff    SferaCutoffControl

THIS IS FOUR DECISIONS, NOT TEN. Seven of the ten are the same class, TransformGateControl, instantiated as the xform control across seven units. Decide once whether a transform gate should expand and the seven follow together. The remaining three are individual: RatchetControl (sub buttons mult/len/vel), LaretsMixControl (out/comp/auto), SferaCutoffControl (Q).

NOT AUTOMATICALLY A DEFECT. Expansion is only meaningful if the sub-params are worth a fader row. TransformGateControl is gate-shaped (sub buttons input/thresh/fire, plus a math mode func/...), and a gate may reasonably have nothing to expand into, in which case the right outcome is to record that and move on rather than add an empty view. The three single-instance controls all look like genuine fader candidates.

WHEN FIXING, the layout entry must list the ORIGINAL CONTROL KEY FIRST, not a duplicate fader, or the custom graphic is replaced by a plain fader on expansion (feedback_expansion_custom_graphic). And beware creating the situation in larets-overview-skew-duplicate, where the expansion lists a fader for the same parameter the control itself already edits.

Related: feedback_control_expansion_views, feedback_expansion_custom_graphic, feedback_parammode_convention, larets-overview-skew-duplicate.

SIDE OBSERVATION worth its own item if it matters: mods/stolmine has a mod.mk (PKGNAME stolmine) but no Makefile entry and no built package, while duplicating GateSeq, TrackerSeq, MultitapDelay and Filterbank from spreadsheet with diverged contents. Either it is dead and should be deleted, or it is live and is missing from the build.

=== SCOPE AND DECISIONS RESOLVED 2026-08-18 (user interview) ===

SCOPE CUT: ignore mods/stolmine and ignore catchall. That drops Sfera cutoff and the 4 stolmine entries. NINE controls remain, all in spreadsheet: xform in Etcher, Fabula, GateSeq, Larets, MultitapDelay, Pecto and TrackerSeq; ratchet in GateSeq; mix in Larets.

DECISION 1 - gate-shaped controls DO expand. Both xform (7 units) and ratchet get expansions, accepting that they are the first gates in the catalog to do so. Rationale: consistency with the other 24 paramMode controls, and both carry genuine parameters.

DECISION 2 - Larets mix expands to Out and Comp ONLY. Auto Makeup is a boolean and stays on SHIFT. This follows the existing precedent: every expansion in the catalog contains faders and never a toggle, and adding one would need a widget type this pattern does not have.

DECISION 3 - discrete selectors DO belong in expansions, as stepped faders using the discrete-stepping standard (see controls-discrete-encoder-rollout). So xform's func, a 7-way named selector (all, t+p, type, prm, tick, rot, rev), gets a stepped fader rather than being left on SHIFT.

RESULTING POLICY, worth stating because it is not obvious from the two decisions taken separately: an expansion may contain continuous faders AND stepped/discrete faders, but NOT boolean toggles.

=== THE WORK IS BIGGER THAN IT LOOKS - READ BEFORE ESTIMATING ===

An expansion entry lists KEYS FROM THE VIEWS TABLE, not object names. Verified against the working example: Larets overview = { overview, skew, stepCount, loopLength } and all three of skew, stepCount and loopLength are separately declared as view controls in that same file.

NONE of the nine targets have their sub-faders declared as view controls today. Checked all seven xform units: zero declare xformFunc, xformDepth, xformFactor or xformScope as views. The sub-params exist ONLY as ParameterAdapter objects plus Readouts living inside the custom control class.

So each unit needs, in order:
  1. new GainBias view controls wrapping the EXISTING ParameterAdapter objects (they are already there, e.g. Larets xformFunc at Larets.lua:108 and xformDepth at :112; Pecto xformTarget at :156 and xformDepth at :161; GateSeq ratchetMult at :64 and xformFunc at :75; Larets outputLevel at :83 and compressAmt at :88), with a stepped map for the selectors per Decision 3
  2. then the one-line layout entry

That is roughly 2 to 3 new control declarations per unit across 9 controls, not 9 one-line additions.

TRAPS: the layout entry must list the ORIGINAL CONTROL KEY FIRST or the custom graphic is replaced by a plain fader on expansion (feedback_expansion_custom_graphic). Do not add a fader for a parameter the control itself already edits - that is the larets-overview-skew-duplicate situation. Mod gain defaults to 0 on any new adapter-backed control (feedback_mod_gain_default_zero).

=== DECISION 2 REVERSED 2026-08-18: TOGGLES ARE IN ===

The earlier ruling (faders only, Auto Makeup stays on SHIFT) rested on a claim that was WRONG. It came from scanning what existing expansions happen to contain, not from checking the framework or the widget list. Both checks say there is no restriction:

  - parseViewDescriptor at er-301/xroot/Unit/Section.lua:25-30 simply looks each name up in self.controls and appends whatever it finds. NO TYPE CHECK. Any registered ViewControl is legal in any descriptor, and the expanded row and named expansions go through the identical function.
  - Unit.ViewControl.OptionControl is a ply-width ViewControl built for exactly this, and THE PRECEDENT ALREADY EXISTS INSIDE AN EXPANSION: Helicase.lua:190 has views.overview = { overview, overModMix, overCarrierShape, overLinExpo } where overLinExpo is an OptionControl declared at Helicase.lua:224. biome GatedSlewLimiter.lua:97 uses the same widget as a plain ply-row control.

USER DECISION: include toggles, for completeness. ENTER should show everything SHIFT shows.

REVISED POLICY, superseding the earlier one: an expansion may contain continuous faders, stepped/discrete faders, AND boolean toggles via Unit.ViewControl.OptionControl. There is no widget class that is off limits.

=== THIS ADDS TWO FIXES TO EXPANSIONS THAT ALREADY EXIST ===

Scanning every paramMode control class for a hidden boolean (getOption or BinaryIndicator) and checking whether its expansion surfaces it, ignoring stolmine and catchall:

  Helicase       overview  HelicaseOverviewControl  LinExpo     -> ALREADY SURFACED (the model to copy)
  Larets         overview  LaretOverviewControl     StepMode    -> MISSING from { overview, skew, stepCount, loopLength }
  Larets         mix       LaretsMixControl         AutoMakeup  -> no expansion at all (the reported case)
  MultibandCompressor mix  CompMixControl           AutoMakeup  -> MISSING from views.mix = { mix, mixOutput } at MultibandCompressor.lua:383
  Blanda         (inputs)  MixInputControl          BinaryIndicator only, Blanda.lua:119 - CHECK what the indicator represents and whether it is user-settable

So the sweep is no longer only about controls that fail to expand. TWO UNITS HAVE AN EXPANSION THAT SILENTLY DROPS A TOGGLE the control carries on SHIFT: Larets overview loses StepMode (random vs sequential step advance) and impasto mix loses AutoMakeup. Both are exactly the same defect as the reported one, just half hidden.

Revised Larets mix target: { mix, outputLevel, compressAmt, autoMakeup } with autoMakeup as an OptionControl on the AutoMakeup option, which is two-choice and fits the widget directly.

=== INCIDENTAL, VERIFY BEFORE ASSUMING THE SYMPTOM IS UNIFORM ===

er-301/xroot/Unit/init.lua:84-96 auto-generates a { scope, <control> } descriptor for any control listed in `expanded` that has no descriptor of its own - BUT ONLY IF the unit has no control named scope. So on some units ENTER already shows a scope plus the control rather than doing nothing. Check this per unit before describing the symptom as identical across all nine.

=== IMPLEMENTED AND TESTED 2026-08-18, spreadsheet 2.8.6.1 ===

All nine live gaps closed, plus the two toggle omissions in expansions that already existed. Eight unit files changed: Larets, Etcher, Fabula, Pecto, MultitapDelay, TrackerSeq, GateSeq, MultibandCompressor.

KEY IMPLEMENTATION CHOICE - use Fader, not GainBias. GainBias REQUIRES a branch (er-301/xroot/Unit/ViewControl/GainBias.lua:95 logs an error without one), and several units had no branch on their xform sub-objects, so GainBias would have meant bolting new patchable CV inlets onto those units purely to make ENTER work. Unit.ViewControl.Fader takes the parameter directly and needs no branch. Same for OptionControl on the toggles. Net effect: zero change to any unit's patchable surface.

What each got:
  Larets    xform   = { xform, func, depth }        mix = { mix, out, comp, auto }
            overview gained the missing stepMode toggle
  Etcher    xform   = { xform, func, depth }
  Fabula    xform   = { xform, func, depth }
  Pecto     xform   = { xform, func, depth }
  Petrichor xform   = { xform, func, depth, sprd }
  Excel     xform   = { xform, func, fact }
  Ballot    xform   = { xform, func, prmA, prmB }   ratchet = { ratchet, mult, len, vel }
  Impasto   mix gained the missing autoMakeup toggle

TEST: er-301/tests/emu/95-control-expansion-coverage.test. It asserts on unit.views[key] contents rather than driving the UI, since a control expands iff the unit built a view named after its key. It checks CONTENTS not just existence, which matters: Unit/init.lua:84-96 auto-generates a { scope, control } view for any expanded control lacking a descriptor when the unit has no scope control, so several of these ALREADY had a view and an existence-only check would have passed on broken code. Confirmed by running the test against the pre-change build spreadsheet-2.8.5.26: it fails there at the mix contents assertion and passes after. Both directions verified.

Full emu suite: 62 of 63 pass. The one failure is 93-breccia-insert-smoke, which is PRE-EXISTING and unrelated - see breccia-libcore-require-emu."""

