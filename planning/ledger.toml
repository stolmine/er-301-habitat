[[item]]
id = "rate-time-control-octave-maps"
title = "Rate/time controls on wide-ratio LINEAR dial maps swing far too wide (Constant Random fixed; audit open)"
status = "todo"
stamped = "2026-08-05T21:42:49-05:00"
area = "ui"
verify = { kind = "manual", ref = "Constant Random's Rate is usable across its whole range - one coarse detent is a musically sensible proportion of the current value at 0.05 Hz as well as at 50 Hz, not a jump clean over the entire slow region. Same for every other rate/time control confirmed to be a real divergence by the audit below." }
links = { depends_on = ["control-step-standards"] }
note = """User, 2026-08-05: "constant random's rate increment scaling is awful in use, it swings much
too wide."
MEASURED. ConstantRandom.lua:46 is app.LinearDialMap(0.01, 100) with setSteps(10, 1, 0.1, 0.01), i.e.
LINEAR across four decades. One coarse detent from the 5 Hz default is 5 -> 6 Hz (+20%, fine), but
one coarse detent from 0.05 Hz is 0.05 -> 1.05 Hz (+2000%). The ENTIRE 0.01..1 Hz region - which is
the whole point of a slow random CV - is one coarse step wide. superCoarse is +10 Hz, so it crosses
the useful range in a single detent. The map is linear over a quantity that is perceived
multiplicatively; that is the bug, not the step VALUES.
FIX SHAPE: an octave map, per the framework's own standard for this quantity class -
dialMaps["clockFreq"] = octaveMapWithZero(-5, 5, 2, 1) gives 0.0625..64 Hz at one octave per detent.
Constant Random wants a wider low end than clockFreq's 0.0625, so either extend the octave range or
use a matching octaveMapWithZero; do NOT just re-step the linear map.
IMPORTANT - THIS WAS ALREADY SEEN AND DISMISSED: planning/control-step-standards-inventory.md:191
lists this exact control and classifies it "(c) no clean analog", so the 2026-07-16 audit looked
straight at it and left it alone because the built-in `rate` LUT (0/10/100/1000/10000) is not a
match. That judgement is what real use has now overturned: the absence of an exact built-in analogue
does not make a four-decade linear map acceptable. Re-audit the other "(c) no clean analog" verdicts
in that inventory with the same skepticism - "no exact builtin" was being read as "leave as is".
CONSTANT RANDOM RESOLVED 2026-08-05 (biome 2.2.1.10) - and NOT by the octave map proposed above.
User's call: "realistically coarse can be .1 hz, you can extrapolate for other incs. also, it
should bottom out at 0hz for pause." So the map stays LINEAR and simply gets sane steps:
app.LinearDialMap(0, 100) with setSteps(1, 0.1, 0.01, 0.001) - the framework's own [0,10] step
pattern one decade up, coarse as specified and the rest extrapolated at the 10x ratio the built-in
maps use. biasPrecision 2 -> 3 so the extrapolated fine/superFine are actually visible on the
readout. One coarse detent at 0.05 Hz is now 0.05 -> 0.15 Hz (was 0.05 -> 1.05).
Worth keeping in mind for the rest of the audit: a well-chosen LINEAR map with the right step sizes
was the right answer here, so "wide ratio -> convert to octave" is NOT the rule. The octave form
buys proportional steps across decades; this control instead wanted a usable absolute resolution at
the slow end plus a hard zero, which linear gives directly.
0 Hz = PAUSE, which needed a DSP change too: ConstantRandom.cpp clamped rate to a 0.01 Hz floor, so
a "paused" unit still drew a new random every 100 s (measured: 2 draws in 300 s). Floor is now
exactly 0.0f - phaseInc goes to 0, the phase never wraps, no target is ever drawn, and the slew
finishes travelling to the target it was already heading for and then holds there. Measured: 0 draws
and 0.000e+00 movement over 300 s once settled. Note the held value is the TARGET, not the
instantaneous value at the moment of pause - if a slow slew was mid-travel it completes first.
Both arches, ConstantRandom.o 0 NEON suspect hints, pkg installed to emu. Emu audition owed.
SLEW REPLACED WITH THE BUILT-IN TIME CONTROL 2026-08-05 (biome 2.2.1.11). User: "slew range should
also be increased, we should just steal the time control wholesale from the builtin slew." Taken
verbatim from GatedSlewLimiter/ExpoD: biasMap Encoder.getMap("slewTimes") (timeOctaveMap 0.003..1000,
19 octave steps), biasUnits unitSecs, scaling app.octaveScaling, gainMap Encoder.getMap("gain").
The private 0-1 "amount" it replaces was worse than just narrow - the law
coeff = (1-s)*50 + 1 is hyperbolic in s, so the middle HALF of the dial (0.25..0.75) spanned only
22..39 ms while the last 25% jumped 74 ms -> 1 s. New throw is 3 ms .. 786 s in even octaves.
DSP: the Parameter is renamed Slew -> Time and now carries SECONDS;
alpha = (t > dt) ? 1 - exp(-dt/t) : 1, so a time under one sample is a hard jump = pure S&H, which
preserves what the old slew=0 default did. New default 0.003 (the map floor) keeps the shipped
character crisp.
BREAKING FOR EXISTING PATCHES, and unlike the Vitrail move this unit IS publicly released (present in
the v2.7.0 biome toc): a stored slew of 0.5 used to mean "38 ms" and now means "0.5 seconds". No
clean migration exists because the old 0-1 range overlaps valid new second values, so old patches
will load with a much longer slew than intended and need re-dialling. Flagged to the user.
Both arches, ConstantRandom.o 0 NEON suspect hints, pkg installed to emu.
LEVEL ADOPTS THE BUILT-IN OSCILLATOR CONVENTION 2026-08-05 (biome 2.2.1.12). User: "level also goes
too high ... perhaps level just needs to default to 0.5 instead of 1", and pointed at the sine osc.
Checked: EVERY core oscillator (Oscillators/Sine, SingleCycle, AliasingTriangle, AliasingSaw) uses
biasMap Encoder.getMap("[-1,1]") with initialBias 0.5. Adopted verbatim, replacing a private
LinearDialMap(0,1) at default 1.0. The default now swings +/-0.5 internal = +/-5 V = 10 Vpp, which is
what a modulation source is normally expected to do; 1.0 (+/-10 V) is still reachable.
The bipolar map also opens NEGATIVE level = inverted random, which the 0-1 map forbade, so the C++
clamp widened from CLAMP(0,1) to CLAMP(-1,1).
WORTH RECORDING, because the first analysis was wrong-headed: the earlier reading of "too high" chased
the OUTPUT SCALING and concluded there was nothing to fix, since at level 1.0 with mod gain 0.5 the
throw across a 0-1 control is already exactly 1.00 (cv pp 2.0 x gain 0.5). That arithmetic was right
and irrelevant - the complaint was about the DEFAULT, not the ceiling, and the answer was in the
built-in convention the whole time. Look for the framework's analogue BEFORE reasoning from first
principles about scaling.
AUDIT CANDIDATES (crude sweep:AUDIT CANDIDATES (crude sweep:AUDIT CANDIDATES (crude sweep:AUDIT CANDIDATES (crude sweep: every app.LinearDialMap in mods/*/assets/*.lua whose max/min ratio is
>= 50x - this is a CANDIDATE list, not a fix list, and each needs its quantity class judged):
  biome     CodescanOsc 0.1..2000, VarishapeOsc 0.1..2000, VarishapeVoice 0.1..2000,
            ConstantRandom rate 0.01..100, SpectralFollower 20..20000 + 0.0001..0.5 + 0.0001..5,
            Quantoffset 2..128, Transport 1..300
  catchall  Lambda 0.1..2000 + 20..20000, Sfera 20..20000, Som 0.001..20 + 0.01..1,
            SomModControl 0.001..20, SomScanControl 0.01..1
  spreadsheet BandListControl 20..16000, FilterListControl 20..10000, BandControl 20..20000,
            DriveControl 50..5000
COUNTEREXAMPLE, so the sweep is not applied blindly: Transport's 1..300 is BPM, and the framework's
own dialMaps["tempo"] IS linear (linMap(1, 501, 10, 1, 0.1, 0.01)) - tempo is perceived additively,
so linear is CORRECT there. Frequency/rate/time are the multiplicative classes; a wide ratio alone
does not prove a divergence.
Overlaps the D3 row of [[control-step-standards]] (linear-Hz vs octave for filter/osc cutoff), which
covers the PITCH side; this item is the RATE/TIME side plus the dismissed-verdict re-audit. Batch
the fixes into one point release with the rest of the control-standards work - each is a
shipped-behaviour change that needs an emu audition."""

[[item]]
id = "control-step-standards"
title = "Adopt built-in dial-map standards across habitat; inventory every control vs the framework registry"
status = "todo"
stamped = "2026-07-16T08:13:07-05:00"
area = "ui"
verify = { kind = "manual", ref = "every habitat control's dial map matches the firmware standard for its type (xroot/Encoder.lua dialMaps): normalized 0-1/-1-1 controls use coarse step 0.01; gain uses dB/[-10,10]; cutoff/freq uses octave maps; etc. Divergences fixed or reasoned. Inventory: planning/control-step-standards-inventory.md." }
note = """User principle (2026-07-16): any 0..1 or -1..1 control should have COARSE step 0.01; more broadly, inventory every control in habitat, find its built-in analogue, and adopt the built-in standard where they differ. CONFIRMED at the framework level: xroot/Encoder.lua dialMaps is the source of truth - default / [-1,1] / [0,1] / unit / [0,2] all use coarse 0.01 (linMap(min,max, superCoarse, COARSE, fine, superFine)); gain = [-10,10] coarse 0.1; volume / gain36dB = decibelMap; filterFreq / oscFreq / clockFreq = octave maps; cents, feedback, int[...], tempo, rate etc. Many habitat units instead roll a private floatMap with setSteps(1, 0.1, 0.01, 0.001) -> coarse 0.1 for normalized controls, diverging. Full inventory (published pkgs, all control types, divergence table + prioritized fixes) dispatched to a Fable 5 agent -> planning/control-step-standards-inventory.md. FIX MECHANISM: private maps shared across many controls can't be globally re-stepped (affects siblings) - use a dedicated map, a per-control step override, or switch to Encoder.getMap. [[mix-control-standards]] is the dry/wet subset (Pecto/Petrichor/Parfait/Impasto at 0.1). Prioritize published packages; batch into a point release. INVENTORY DONE (2026-07-16, planning/control-step-standards-inventory.md, full file:line tables): root cause = a copy-pasted file-local floatMap in two forms - fine (0.1,0.01,...) correct vs coarse (1,0.1,0.01,0.001) = 0.1 coarse. Divergences: D1 normalized-coarse-0.1 (HIGH) = spreadsheet Pecto/Petrichor/Parfait/Impasto/Etcher/Filterbank + biome DJFilter/FadeMixer/Integrator/TiltEQ/CodescanFilter + catchall Alembic; D3 linear-Hz-vs-octave (MED, changes feel) = most osc/cutoff controls; D4 linear-feedback-vs-dB (MED) = Som/Clouds/Mirror/Petrichor/Pecto/Helicase; D2 superFine 0.001-vs-0.0001 (LOW). Clean: peaks/mi/scope (use Encoder.getMap); JF/Visadhara = compliant private-map refs. Fix caveat: D1 units route BOTH normalized + level faders through one floatMap - split into normMap/levelMap or use Encoder.getMap, don't globally re-step. Also found 3 latent range bugs (Colmatage div readout, Etcher SegmentList, DriveControl freqReadout) + 1 unused map (GateSeq scopeMap). Batching: D1+mix+D2 = one mechanical release; D3+D4 = a separate listened-through release (they change parameter feel). D1 DONE (2026-07-16): spreadsheet 2.8.3.3 (Pecto/Petrichor/Parfait/Impasto/Etcher/Filterbank via a normMap helper on strict 0-1/-1-1 controls) + biome 2.2.1.1 (DJFilter cut+q / FadeMixer fade / Integrator leak / TiltEQ tilt / CodescanFilter mix -> framework steps 0.1,0.01,0.001,0.0001). Catchall skipped (unfinished business, not shipped). D3 (linear-Hz->octave) + D4 (linear->dB feedback) remain for the listened-through pass. D3-f0 SUBSET DONE (2026-07-16): the 5 oscillator fundamental controls (spreadsheet Mirror + Helicase, biome VarishapeOsc/VarishapeVoice/CodescanOsc) switched to Encoder.getMap("oscFreq") -> reach 0 Hz + octave/semitone scaling like built-in oscillators (spreadsheet 2.8.3.4 / biome 2.2.1.2, commit a371725). Mirror overview f0 readout repointed to oscFreq to match. Feel-changing (linear-Hz -> octave grid, range now ~0..28 kHz with a 0 Hz point) -> pending hardware audition, folds into the v2.7.1 point release. Mirror/Helicase FORMANT controls left on the linear f0Map (out of scope). Remaining D3: the cutoff/filter-freq controls; plus all of D4.
TAXONOMY FRAMING (user, 2026-08-05, prompted by [[rate-time-control-octave-maps]]): the request is
now explicitly to "classify kinds of controls and then standardize incrementing for them in ticks,
probably based on similar controls from builtins". That is a stronger form of this item: instead of
a per-control divergence table, define the CLASSES first (normalized 0-1 / bipolar -1-1 / gain in dB
/ frequency / rate / time / integer count / discrete selector / tempo / mix), fix the tick behaviour
per class from the built-in analogue, then assert every habitat control against its class. Two
lessons already paid for: (1) the quantity class decides LINEAR vs OCTAVE before any step value is
argued - tempo is legitimately linear, frequency and rate are not; (2) "no exact builtin analogue"
must not be recorded as "leave as is", which is how ConstantRandom's four-decade linear rate map
survived the first pass. Discrete selectors are the tick-accumulator axis and live in
[[controls-discrete-encoder-rollout]]; dry/wet is [[mix-control-standards]].
"""

[[item]]
id = "fdn-reverb"
title = "NEON FDN reverb (Householder core + per-line filters + spectral flavor overlay)"
status = "wip"
area = "dsp"
stamped = "2026-07-16T16:03:03-05:00"
verify = { kind = "manual", ref = "a new reverb unit whose FDN tank vectorizes on NEON (contiguous fixed-delay reads, Householder/Hadamard mix as a reduce/butterfly, per-line SoA filter bank) costs well under the native-object FDN ~20% stereo, sounds denser/more resonant than Sujet, and has a spectral flavor layer (per-line frequency-dependent decay at minimum). objdump confirms no gather in the delay reads; am335x insert-safe." }
note = """Full design note: planning/fdn-reverb-design.md. A CUSTOM C++ ATOM FDN (so the whole tank NEON-vectorizes, unlike Fabula's gather-bound Dattorro and unlike native-object-wired FDNs). Core: N=8 Householder feedback (y_i = x_i - (2/N)*sum(x); Hadamard/FWHT alt), FIXED/block-modulated delay lengths so reads are contiguous (not per-sample gathers = the NEON crux), per-line low+high-shelf damping as an SoA filter bank ([[feedback_neon_soa_svf_bank]]) = frequency-dependent decay = the first spectral element, plus a 3-4 allpass input diffuser. Reference the user enjoys: yrn1/er-301-custom-units fdelay FDN/SFDN (Baekelandt, Tom Erbe 'Reverb Topologies and Design'): 4-line Hadamard, per-line 3-band EQ, reflection-ratio delays, but built from native Lua objects -> ~20%/11% stereo (object overhead) -> our single-atom NEON version should beat that widely. Spectral element ranked: (1) per-line filters [native, yrn1-proven], (2) band-split parallel FDNs for per-band RT60, (3) STFT SEND/overlay reusing zaum STFTSpectral (Sujet) Space-width+Bloom-shimmer - NOT in the recirculation (1024-sample frame latency would force frame-rate loop = washy, the Sujet failure mode). Lessons from Sujet: spectral magnitude-smear as the ENGINE is washy; keep its structured phase width + bloom as FLAVOR on a strong time-domain core. NEON verdict + rails: [[project_fabula_am335x]]. Generic name ([[feedback_no_third_party_branding]]). PHASE 1 SCAFFOLD DONE (2026-07-16, spreadsheet 2.8.3.5): new unit "Plenum" (provisional name), atom mods/spreadsheet/FDNTank.h. 8-line Householder FDN (f = d - 0.25*sum), 4-stage Schroeder input diffuser, per-line one-pole HF damping (SoA states, the future NEON bank), DC-blocked mono feed, decorrelated +/-1 stereo output taps (one shared tank -> true stereo), equal-power dry/wet baked in. 4 controls: Size/Decay/Damp/Mix. DSP is SCALAR for Phase 1 (verified am335x-safe: FDNTank::process has zero q-reg ops, all scalar VFP, zero alignment hints, -fno-tree-vectorize held; adds 0 to the 164 baseline suspects). Both arches build+link clean; emu-installed. Known Phase-1 deferrals: NEON pass (matrix/damping-bank/output-dots vectorize because reads are contiguous, unlike Fabula's gathers) = Phase 2; Size sweeps zipper (block-rate length recompute, no crossfade); wet makeup 1.2x untuned by ear; no voiced saturator (only a +/-16 blow-up guard, math earns stability); Diffusion/Predelay/spectral-flavor overlay (band-split or STFT send) later phases. Design note: planning/fdn-reverb-design.md (now holds the full phased roadmap: P1 core / P2 voicing / P3 spectral flavor / P4 NEON / P5 UI). PHASE 2a-2c DONE (2026-07-16, spreadsheet 2.8.3.6): frequency-dependent RT60 decay. Decay is now a log-spaced mid-RT60 (~0.2..30 s) not a linear loop gain; per-line RT60 gains g_i = exp(-3ln10*T_i/RT60) so all lines decay at the same wall-clock rate (uniform tuned tail); new Bass control = per-line low-shelf toward a separate bass RT60 (~0.25x..4x, 0.5 neutral); Damp folded into a proper loss filter (HF decays faster than mids); Householder matrix now PURELY lossless (all decay in the per-line loss filters = the correct Jot structure, sets up the P4 NEON filter bank). Controls now Size/Decay/Bass/Damp/Mix. Verified am335x-safe (process: 0 q-reg, 0 alignment hints; 16+ expf/powf per block are scalar bl <expf>/<powf>, not vectorized _ZGV; +0 to the 164 baseline). PHASE 2d DONE (2026-07-16, spreadsheet 2.8.3.7): delay modulation + fractional reads. Per-line slow LFOs (magic-circle oscillator, area-preserving/amplitude-stable, small-angle eps = 2pi*f/SR, decorrelated 0.37..1.19 Hz rates + hardcoded unit-circle init phases -> NO runtime sinf/cosf, dodges feedback_package_trig_lut) wobble the delay lengths +/-0.25% to break the fixed eigenfrequencies (de-metalize sustained tails). Reads are now MODULATED FRACTIONAL: base delay slewed per-sample toward the Size target (one-pole ~30ms -> Doppler-smooth Size sweeps, kills the block-rate integer zipper), plus LFO, then 2-tap linear interpolation. Still a local 2-tap (contiguous), not a scattered gather -> NEON-friendly for P4. Baked-in depth (no new control; a Mod knob is a candidate). Verified am335x-safe (process: 0 q-reg, 0 alignment hints; only block-rate scalar expf/powf, no sinf/cosf/floorf; +0 to the 164 baseline). Remaining voicing: Diffusion control, predelay, true-stereo input, wet HPF/LPF, matrix A/B. Then P3 spectral or P4 NEON. Open: wet makeup 1.2x still untuned by ear; mod depth/rate baked (expose if wanted). PHASE 3 SPEC'd (2026-07-16, interviewed; full spec in fdn-reverb-design.md 'Phase 3'): the spectral layer = a COUPLED 6-8 band SVF channel vocoder (not STFT; am335x-affordable, reuses Tomograph/SoA-SVF). The processed spectrum REFEEDS the tank input (spectral as modulator of the time engine, not a parallel layer). ONE macro control 'Spectral' (6th knob), a CONTINUOUS morph through 5 stations (clean -> contour/tilt -> gate/sparkle -> bloom/smear -> resynth-freeze), which is simultaneously a refeed-amount ramp (0 = send off). Resynth freeze (held band mags -> excitation) keeps the FDN loop gain fixed so coupling can't run away. Macro + hidden depth subs: refeed ceiling/intensity, spectral tilt/voice, spectral focus (rolls the band CENTER FREQS around = movable lens). Build order P3.1 analysis+coupling+contour -> P3.2 gate+bloom+morph crossfade -> P3.3 resynth freeze -> P3.4 hidden subs -> P3.5 NEON the bank. Deferred: full STFT (Sujet reuse) as a CM4 'quality' mode; band-split parallel FDNs (demoted); shimmer (in-loop TD pitch shift) as a separate future intervention. PHASE 3.1 DONE (2026-07-16, spreadsheet 2.8.3.8): SVF analysis bank + coupling plumbing + contour station stub. 8-band TPT-SVF bandpass (log-spaced 100Hz..8kHz, Q=2, tan-approx coeffs = no runtime tanf) analyzes a mono tap of the tank field (avg of the 8 line outputs); flat band sum (contour tilt curve deferred to P3.4) -> bounded governor x/(1+|x|) -> refed into the tank input with the injection pattern, level = Spectral macro * 0.25 ceiling. New 6th control 'Spectral' (0..1, default 0 = bank bypassed). Coupling is stable by construction: refeed bounded to +/-0.25, injected into the g<1 FDN. Verified am335x-safe (process: 0 q-reg, 0 align hints; per-sample loop all hardware VFP incl. vabs+vdiv governor, NO per-sample libcall; only block-rate scalar expf/powf/sqrtf; +0 to 164 baseline). AUDITION (2026-07-16): coupling stable, governor holds at clipping, BUT dull -- a held mid-low drone. Diagnosis: static positive spectral feedback of a flat filterbank = a resonator that locks to the highest-gain (low-mid, since HF is tank-damped) mode. Contour/flat is inherently the dullest station. Fix chosen (user: 'Motion on current bank'): P3.1 MOTION+TILT (2026-07-16, spreadsheet 2.8.3.9): (1) slow spectral-focus sweep -- a block-rate magic-circle LFO (0.11 Hz, +/-1 oct) moves ALL band centers together via focusMult=2^(depth*lfo) so the hold GLIDES across the spectrum; (2) bright tilt on ABSOLUTE freq (kFdnBandTiltBase = sqrt(fc/900), +3dB/oct-ish, x tiltGlobal=sqrt(focusMult)) pulls energy up off the low-mid mud. tan-approx arg clamped to 0.55 for validity as bands sweep up. Still am335x-safe (0 q-reg/hints; +3 block-rate powf/sqrtf for focus/tilt, none per-sample; governor stays vabs+vdiv). AUDITION FOCUS: does the sweeping+brighter refeed read as evolving/alive vs a phaser-y wah on a drone (coherent all-band sweep = possible phaser character; per-band decorrelation is the fallback). Deeper alternative if still uninteresting: the RESYNTH path (envelope->excitation, +upward spectral shift = shimmer) breaks the lock harder (freshly-generated energy) -- deferred but noted. DECOHERED (2026-07-16, spreadsheet 2.8.3.10): per-band decorrelated focus LFOs (0.061..0.127 Hz) replace the single coherent sweep -> spectrum churns not phases. User: more interesting, but 'doesn't feel related to the input' -> wants reactivity; agreed envelope-following is the move. INPUT CROSS-SYNTHESIS (2026-07-16, spreadsheet 2.8.3.11): a VOCODER relationship. A second 8-band SVF analyzes the DRY input (same band centers), per-band envelope follower (30ms); the tank carrier is gated per band by a soft gate on that envelope (keyGain = clamp((env-0.02)*8)). So the reverb spectrally TRACKS the input's spectrum ('speaks' with your playing). Keying RELEASES toward freeze: keyAmt = clamp((1-Spectral)*2) (full through the reactive lower half, ramps to 0 by the top), effKey = (1-keyAmt) + keyAmt*keyGain -> the macro journey is now reactive(low) -> autonomous/freeze(high). am335x-safe (0 q-reg/hints; +1 block-rate expf for env coef; two SVF banks + env + gate per sample all hardware VFP; NEON later). CPU ~2x the vocoder when active (bypassed at Spectral=0). AUDITION FOCUS: does it now feel connected to the input (reverb tracks your spectrum), and does turning the macro up read as reactive->autonomous? Next candidates: transient->focus nudge (cheap reactive lever), P3.2 gate+bloom stations, or P3.3 resynth freeze (real hold at the top vs the current unkeyed drone). Open: key threshold/slope + env tau are baked (sensitivity sub later); wet makeup 1.2x untuned. SPECTRAL VERDICT (2026-07-16): cross-synthesis reactivity barely noticeable except at the drone end. User + agent conclusion: spectral keeps falling flat because on a strong FDN it is a garnish capped low for stability and RE-SMEARED by the FDN each pass; dramatic spectral needs domination (washy, the Sujet failure) or FFT-grade resolution/CPU (not on am335x). REAL platform ceiling. Base FDN sounds very good. PIVOT to a TIME-DOMAIN flagship = the Erbe-Verb alpha-matrix TOPOLOGY MORPH (the abandoned Network 'plexus' idea, now viable because we finally have a real FDN; design already in planning/spatial-glitch-impl/02-field.md). WEAVE morph DONE (2026-07-16, spreadsheet 2.8.3.12): one control alpha in [0,1] morphs the feedback matrix -- fb = loss - alpha*(2/N)*sum. alpha=1 = full Householder (dense wash, default); alpha=0 = identity (each line isolated = 8 sparse addressable echo/comb resonators). A(alpha)=I-alpha*(2/N)*11^T is symmetric with all singular values <=1 for alpha in [0,1] -> contractive/stable at EVERY alpha (common-mode attenuated, never amplified), ~1 extra mul/sample. New 7th control 'Weave' (button weav, default 1.0). am335x-safe (0 q-reg/hints). AUDITION: does sparse<->wash morph read as dramatic/musical (turn Weave DOWN from 1)? If yes, this is the flagship; then demote/remove Spectral, add Erbe levers: Givens-rotation LFO on the matrix (anti-metallic, Schlecht-Habets) + feedback >1 for swells (~1.25, guarded by output soft-clip). Name 'Weave' provisional. WEAVE AUDITION (2026-07-16): promising but the scalar A(alpha)=I-alpha(2/N)11^T morph only moved ONE eigenvalue (common-mode +1->-1); extremes good (high size=reverb, low size=karplus), middle 90% unremarkable, changed pitch more than character. User: remove Spectral, make Weave 'traverse architectures'. SPECTRAL REMOVED + WEAVE = BUTTERFLY (2026-07-16, spreadsheet 2.8.3.13): all the coupled-vocoder code deleted (real platform ceiling on spectral; base FDN is strong). Weave now morphs the feedback matrix through a 3-STAGE BUTTERFLY of 2x2 rotations (FWHT structure): stage 0 mixes pairs (i,i^1), stage 1 quads (i,i^2), stage 2 (i,i^4); progressive openness p0/p1/p2 ramp over Weave [0,1/3],[1/3,2/3],[2/3,1], angle=p*pi/4. So Weave traverses: identity (isolated 8 lines) -> coupled PAIRS -> coupled QUADS -> full Hadamard wash. Product of rotations = ORTHONORMAL at every setting -> stable AND energy-preserving (better than the old contractive-only morph); distinct block-size regimes fill the middle. Poly cos/sin approx (block rate, no sinf/cosf). am335x-safe (0 q-reg/hints; only block-rate expf/powf/sqrtf). Controls now Size/Decay/Bass/Damp/Mix/Weave (6; Spectral gone). AUDITION: does the pairs->quads->wash traversal give the middle real character now? Erbe levers still pending: Givens-rotation LFO (anti-metallic on the sparse end) + feedback >1 swells. Name 'Weave' provisional. WEAVE AUDITION 2 (2026-07-16): butterfly regimes audible but still subtle; whole thing sounds more like a resonator. User idea: WRAP CONTINUOUS TIMBRAL EFFECTS around the discrete Weave states (topology moves structure, not timbre; timbre = the drama). Wardrobe = house/atoms (Spiral[sin], WoodenBox[body], ChromeOxide[tape], Lacquer[lo-fi/derez], Distance2[air], Capacitor2[tone], Console0[drive], Point[transient]; KWoodRoom/RotCoat/Galactic/Verbity are full reverbs = too heavy to nest). Architecture call: in-loop coloration compounds per recirculation (dramatic) vs wet-bus one-shot (cheaper). IN-LOOP SATURATION DONE (2026-07-16, spreadsheet 2.8.3.14): per-line cubic soft clip fdnSoftSat (sin-free, unity small-signal slope so it can't boost loop gain; bounded +/-2/3 = also the blow-up guard) applied to the butterfly feedback, drive tied to Weave: satDrive = 1+(1-Weave)*2 = 3 at sparse (driven/gnarly resonators) .. 1 at wash (clean lush). sat(drive*x)/drive keeps small-signal gain unity. am335x-safe (0 q-reg/hints; per-sample all VFP, no new libcalls). AUDITION: does in-loop drive escape the sterile-resonator feel; is driven-sparse/clean-wash the right mapping? NEXT (wardrobe, wet-bus, Weave-zoned): WoodenBox body @ sparse, ChromeOxide/tape mid, Distance2 air @ wash -- one stereo instance each, crossfaded by Weave. Plus Erbe Givens-rotation + >1 feedback swells. WOODEN BODY @ SPARSE DONE (2026-07-16, spreadsheet 2.8.3.15): NOTE the real house/atoms/WoodenBox is a full double-precision FDN reverb (4x4 Householder/side, undersampled) with no per-sample tick -- too heavy/awkward to nest -- so captured its resonant-body ESSENCE in-atom instead: a 5-mode inharmonic modal bank (TPT-SVF bandpasses at 180/296/471/683/1029 Hz, ~1:1.6:2.6:3.8:5.7; Q~6 woody-not-ringy; lower modes weighted) rung by the wet, added back scaled by bodyMix=(1-Weave)*0.06 so it fades in only at the sparse (resonator) end. Branchless (always run, scaled). am335x-safe (0 q-reg/hints, no per-sample trig; re-added fdnTanApprox). AUDITION: does the sparse end pick up a hollow wooden body; is depth 0.06 / Q~6 / the mode freqs right (all baked, tunable)? If the essence-approach lands we continue the wardrobe (tape mid, air wash); if the user wants the EXACT WoodenBox algorithm, wire the real atom downstream as a graph node w/ a Weave crossfade instead. WOODEN BODY MASKED (2026-07-16): hard to hear through the FDN (subtle parallel mix). User pivot: instead of tying wardrobe FX to Weave alone, take an AGGREGATE/centroid of ALL controls and map onto wardrobe FX params; and open the palette to the WHOLE library (not just house/AW). Picked palette: wavefold, bitcrush, ring-mod, comb. AGGREGATE-DRIVEN WARDROBE DONE (2026-07-16, spreadsheet 2.8.3.16): 3 control aggregates -- mass=1/2(Size+Decay), ferocity=Decay*(1-Weave), bright=1/2+Bass-Damp -- drive a mono wet-bus series chain: (1) triangle wavefold, drive=1+ferocity*3; (2) bitcrush/decimate, rate + quantize step from mass (branchless S&H); (3) ring-mod, magic-circle carrier 50-800Hz from bright, AM amount from ferocity; (4) comb resonator, length from mass, fb from decay, mix from ferocity. Added color = wardPresence*(chain - wetMono) into BOTH channels (stereo kept, centered color); wardPresence = clamp(ferocity + mass*0.3 - 0.15) ~0 at the clean default wash, rising in the resonant zone. am335x-safe (0 q-reg/hints; no per-sample trig/floor -- poly fold, magic-circle carrier, int-cast quantize, masked comb). Wooden body from 2.8.3.15 still present (gated by 1-Weave). AUDITION: is it now AUDIBLE + bold; do the aggregates carve distinct timbral zones across the control space; too harsh/muddy? All amounts/ranges baked + tunable. Next: tune mappings, maybe stereo-ize the wardrobe, prune what doesn't earn its place. USER (2.8.3.16): 'frankly already pretty cool, the macro approach works very well'; likes SR reduction. Wants: aggressive crush/decimate; ORTHOGONAL states (diverse combos, not all ferocity-correlated); a 'drama' heuristic with equal-ish spread across states; more effects for coverage. INVENTORY + REDESIGN (2026-07-16, harness planning/fdn-reverb-wardrobe-inventory.py): measured the current mapping -- inter-effect |corr| 0.95 (all ride ferocity), 35% of space flat. Redesign 'C' = one distinct control per effect via directional ramps (calm end off): |corr| 0.08 (orthogonal), drama deciles 0.00..0.94 (even spread), 13% clean corner reachable, default-patch drama 0.073. SHIPPED 2.8.3.17: 6 orthogonal effects -- fold<-Decay, crush<-Size (AGGRESSIVE: rate to 0.03 = SR/33 ~1.4kHz, step to 0.4 ~2-3bit), ring<-1-Weave (carrier from bright), muffle<-Damp (NEW one-pole LP), drive<-Bass (NEW asymmetric even-harmonic), comb<-ferocity. Each at identity when its activation=0 so the calm corner passes clean; no global gate. am335x-safe (0 q-reg/hints, no per-sample trig/floor). AUDITION: aggressive crush good? do the 5 controls now carve genuinely distinct territories (orthogonal)? clean corner reachable? Harness verifies spread -- rerun after any mapping change. Open: wooden body still present (1-Weave gated, maybe fold into aggregates or drop); stereo-ize wardrobe; tune per-effect ranges. USER (2.8.3.17): orthogonal too independent -- high Size+Decay too heavy, Decay dominates everything, MISSES the interrelated feel of the coupled version. IDEA: Weave = meta-control for INTERDEPENDENCE among controls. WEAVE-COUPLING SHIPPED (2026-07-16, spreadsheet 2.8.3.18): the effect drivers shrink toward their shared mean by coupling = 1 - Weave (driver_i = ctl_i + coupling*(mean - ctl_i)); effects read the drivers. Weave=1 (wash) -> coupling 0 -> orthogonal (each effect its own control, cleaner); Weave=0 (sparse) -> coupling 1 -> every effect reads the mean -> move any control, everything shifts = the interrelated feeling. This UNIFIES Weave: it now sets interconnection at BOTH the audio matrix (isolated<->woven butterfly) AND the control-mapping. Verified in harness (redesign D): inter-eff |corr| sweeps 0.25->0.99 across coupling; control->drama influence balanced (Decay 0.39-0.46, no longer dominant -- its RT60 role is separate/inherent). Effect sources use driver VALUES not differences so ring survives full collapse. Fold drive tamed 4->2.5 (Size+Decay heaviness). ring<-0.5(dBass+dDamp), comb<-ctlMean, others<-own driver. am335x-safe (0 q-reg/hints, no per-sample trig/floor). Weave no longer a direct effect axis (it's the meta-controller). Direction: coupling=1-Weave keeps the wash cleaner + interrelation in the sparse zone (flippable). AUDITION: does Weave-down bring back the interrelated feel; is Decay less dominant; high Size+Decay tamed? PARKED (2026-07-16, spreadsheet 2.8.3.18): user likes the Weave-coupling CONCEPT; wants much more work on the EFFECTS CHOICE + per-effect PARAMETER MAPPING before it ships. State: Plenum is a strong FDN reverb (P1 core + P2 freq-dep RT60 decay + P2d mod/fractional reads) with the Erbe-Verb Weave butterfly topology morph + in-loop saturation + a 6-effect aggregate-driven wardrobe (fold/crush/ring/muffle/drive/comb) whose control-coupling is metered by Weave. Controls: Size/Decay/Bass/Damp/Mix/Weave. RESUME HERE = tune the wardrobe: (1) reconsider WHICH effects earn their place (prune/replace; whole library in scope); (2) redo per-effect PARAMETER ranges/curves by ear (crush aggression good; fold/ring/comb/muffle/drive ranges rough); (3) maybe stereo-ize the wardrobe (currently mono-summed centered color); (4) decide the wooden-body fate (still 1-Weave gated, likely fold in or drop); (5) coupling direction (currently 1-Weave) + whether Weave should also still nudge the matrix vs be purely meta. Design harness: planning/fdn-reverb-wardrobe-inventory.py (rerun to verify spread/orthogonality after any mapping change). Not yet touched: P4 NEON pass, P5 UI/viz/naming (Plenum provisional), the deferred Erbe levers (Givens-rotation LFO, feedback>1 swells), wet makeup 1.2x untuned.
