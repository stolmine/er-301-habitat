note = """User + diagnosis, 2026-07-23. User: grit persists much longer on the hardware than on Ngoma;
suspected a separate envelope / different level scaling. CONFIRMED: grit has two components with
different envelopes. (1) The noise-FM phase-mod (jitDev) rides the modes' own r3 envelope
(DrumVoice.cpp ~807/853/908) - persists with the voice, fine. (2) The NOISE BED (the audible grit at
>0.8) has its OWN envelope noiseEnv (line 770/928) with tau = noiseTau, which is CAPPED at 150 ms
(line 608, noiseTau = min(tauEff,150)) and HARD-FIXED at 60 ms above CC110 (line 609) - decoupled from
Decay. That short fixed tau is why grit dies early on Ngoma while it persists on hardware. FIX (needs
hardware, like the rest of grit): measure the hardware noise-bed persistence vs the Decay knob on the
re-pinned rig and refit noiseTau (likely tie it to the voice decay / a longer measured law, remove the
60 ms fix). Scoped follow-up to [[ngoma-grit-tuning]]; not blindly changed - measure first.
SECOND DIMENSION (user, 2026-07-23): even with timbre now closer, grit feels much more DRAMATIC on
hardware. Grit drama = FM depth x persistence x noise-bed loudness. The re-fit matched FM DEPTH (Hz
deviation, ratio 0.99-1.14) but did NOT measure audible LEVEL: the noise-bed loudness-vs-control is
set by noiseMix (line 605-607) + the blend y = y*(1-noiseMix*0.5) + noiseLp*(...) (line 931), never
validated against hardware. So the loudness-and-persistence-vs-CC scaling is the gap, not the FM
depth. Fix: measure TOTAL grit energy/level vs grit CC on the re-pinned rig (not just FM deviation),
then refit the noiseMix law + noiseTau together.
RESOLVED IN CODE 2026-07-23 (2.8.3.82, campaign planning/ngoma-grit-drama.md): measured on the
re-pinned rig (53 cells) + firmware gate decoded. Bed tau tracks Decay ONLY (37/105/252/412 ms,
grit-independent) -> noiseTau = 0.88*tauC^0.809, 150ms cap + 60ms fix deleted. Bed level = one flat
plateau from CC88 (pitch-scaled); the ~CC114 "step" is the VOICE being gate-killed, so the
(1-noiseMix*0.5) trim + tauEff collapse are replaced by the firmware cubed gate env. Validated:
persistence ratio 0.92-1.11 across grit x decay, bed +-0.9 dB, grit-0 bit-identical. Remaining:
the manual device ear-check vs the Trinity (checklist in the campaign doc).

PARKED 2026-08-07 (user): Ngoma is parked. No further hardware campaigns for now."""

