note = "Full report: planning/anamnesis-insert-crash.md. HW capture fw 9.5.2.56: data-abort in ti_sysbios_knl_Event_post, dfar=0x62 dfsr=0x5 (near-null deref, NOT alignment/NEON), thread=hwi from the audio EDMA ISR, flight-recorder 'insert Anamnesis' 0.2s prior -> a stray heap WRITE from Anamnesis's insert path clobbers the audio Event pend-queue pointer. AUDIT (2026-07-12): every member-array write in the ctor (memsets + init loops: mLoopBuf/mLine/mAp/mTapBuf/mHannLut/mGrain*/mDrop*/mBub*/mBandZ/pan-tap-fdn tables) and in process() (mLoopBuf[mLoopWr] Lint<=kLoopBufLen; mTapBuf[mTapWr]; mAp[k][idx] idx<kApLen<=kApMax; mLine[i][mWr]; bubble/drop/grain spawns all slot-in-range) is BOUNDED on a correctly-sized object -- no obvious index OOB found. anamnesis is SINGLE-TU (only the SWIG wrapper .o), so the classic stale-wrapper sizeof-MISMATCH cannot apply (a stale wrapper is consistently stale). So: either a subtle path not yet found (buildFieldFrame mFcGrid verified in-bounds too) or build/state/am335x-specific. NEXT: build the .so with -fsanitize=address + LD_PRELOAD libasan, insert in headless emu (ASan names the exact store), and re-capture on hardware with the CLEAN 0.2.0.83 build (original capture's build provenance unknown)."

