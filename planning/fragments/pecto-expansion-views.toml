[[item]]
id = "pecto-expansion-views"
title = "Pecto: add per-control expansion views so submenu params open as full faders on enter (impasto pattern)"
status = "todo"
stamped = "2026-07-14T21:05:16-05:00"
area = "ui"
verify = { kind = "manual", ref = "on Pecto, press enter on the Density control -> it toggles into a fader view showing Density + Pattern/Slope/Resonator as full faders; same for Mix (Input/Output/Tanh) and the Xform gate (Target/Depth). Currently enter does nothing useful because no per-control view is declared." }
note = "Pecto's DensityControl / MixControl / TransformGateControl show their sub-params only as compact submenu readouts (shift-toggle). They lack the per-control expansion views that let enter (ViewControl:enterReleased -> toggleContext, gated on callUp('hasView', self.id)) open the sub-params as real faders. The impasto/parfait BandControl pattern: register each sub-param as its own full GainBias/ModeSelector control in the controls table (NOT in expanded/collapsed), then add a view keyed by the parent control listing itself first + the expansion controls, e.g. density = { 'density', 'pattern', 'slope', 'resonatorType' }, mix = { 'mix', 'inputLevel', 'outputLevel', 'tanhAmt' }. Same gap fixed on Fabula in habitat 0.2.0.61 (see [[project_fabula_am335x]]); port the approach back to Pecto. Ref impl: mods/spreadsheet/assets/MultibandSaturator.lua onLoadViews (bandlo/bandmid/bandhi views)."
