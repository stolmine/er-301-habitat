[[item]]
id = "polyphonic-sample-playback"
title = "Polyphonic sample playback unit(s) - synth-style poly + drum-machine-style per-voice sample loader"
status = "todo"
stamped = "2026-07-15T08:07:54-05:00"
area = "units"
verify = { kind = "manual", ref = "a polyphonic sample player exists in one or both envisioned forms (identical-voice synth poly; and/or per-voice sample drum-machine with list-traversal overview, separate voice-selection param, multi-load auto-mapping), with a workable gate/voice-allocation story." }
note = """Two designs seen:

(A) Trad-synth poly: several IDENTICAL voices playing one loaded sample, like tomf's Polygon series. Standard poly voice-allocation.

(B) Drum-machine style: an overview ply that traverses a LIST, letting the user load a SEPARATE sample per voice/pad. A voice-selection parameter is SEPARATE from list navigation, and is mappable to v/oct, index, or nearest - like the VariSpeed player's slice param. Stretch: if the user loads a MULTI (selects several samples at once), they are auto-mapped across the pads up to the voice limit.

Open problem - GATES: with per-voice samples, each voice needs its own gate one way or another. Round-robin distribution from a single gate would mean only one sample plays at a time (defeats poly). Real per-voice gating likely needs a MIDI implementation, so (B) may have to wait for MIDI. Capture both designs; (A) is buildable now, (B)'s gate story is the blocker.

Refs: VariSpeed slice-param mapping (v/oct | index | nearest); tomf Polygon series; a future MIDI unit for per-voice gates."""
